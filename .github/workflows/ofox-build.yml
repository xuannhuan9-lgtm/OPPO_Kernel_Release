name: "[PGGM10] OrangeFox Recovery 编译（OPPO K10x 5G / OP5295 / holi）"

# ===========================================================================
# 这个工作流产出一个【可直接刷进 boot 分区的橙狐镜像】boot-ofox.img。
#
# ★方案：单分区双模式（Android 与橙狐共用 boot 分区）★
#   本机没有 recovery 分区，原厂 recovery 就在 boot 的 ramdisk 里。
#   同一个 AOSP init 依据启动模式选择执行哪个 recovery：
#     · 平时开机            → Android
#     · adb reboot recovery → misc 的 BCB 通道 → 橙狐
#
#   CI 三步（工具在 ofox-build/tools/）：
#     1) 编出橙狐 ramdisk（make recoveryimage → 解出 ramdisk）
#     2) ofox-merge-ramdisk.py：把橙狐部件合并进【原厂 ramdisk】
#        原厂为底，只白名单覆盖 recovery 相关文件；init/linker/libc 等
#        正常启动所需的一律保留原厂 ⇒ 从根上避免 libc 版本打架
#     3) ofox-splice.py：把新 ramdisk 拼回【原厂 boot 镜像】
#        头部与布局逐字节沿用原厂（kernel 区原样照抄，只改头部 @12 的
#        ramdisk_size，ramdisk 偏移不变）⇒ 对 aboot 与原生镜像同构
#
# ★分支必须是 fox_14.1★
#   目标机是 Android 14，原厂 ramdisk 同代。橙狐用同代分支，
#   libc/linker/HAL 才对得上。退到 fox_12.1 风险显著上升。
#
# 原料（内核/dtb/原厂ramdisk/原厂boot模板）都通过 GitHub Release 资产拿，
# ★不要 commit 46MB 内核 / 20MB ramdisk / 160MB boot 进公开仓库★。
# ===========================================================================

on:
  workflow_dispatch:
    inputs:
      fox_branch:
        description: '★橙狐官方脚本要【不带 fox_ 前缀的版本号】★（脚本内部自己拼 fox_）。默认 fox_14.1 = 按序尝试 14.1 → 13.1 → 16.0 → 12.1 → 11.0（14.1 与目标机同为 Android 14，首选）。写 fox_14.1 或 14.1 都可以，会自动去掉前缀。显式选其它值则只试那一个。twrp_* 用于 manifest_source=twrp_minimal（GitHub，不依赖 GitLab）'
        type: choice
        options:
          - fox_14.1
          - fox_13.1
          - fox_16.0
          - fox_12.1
          - fox_11.0
          - twrp-14.1
          - twrp-12.1
        default: fox_14.1
      manifest_source:
        description: '源码清单来源。orangefox = gitlab.com/OrangeFox/manifest（橙狐完整源，含 OF_* 支持，但依赖 GitLab 可达）；twrp_minimal = github.com/minimal-manifest-twrp（★GitLab 不通时用这个★，托管在 GitHub、不依赖 GitLab；功能比橙狐少但没有 OF_* 专属特性）'
        type: choice
        options:
          - orangefox
          - twrp_minimal
        default: orangefox
      device_tree_repo:
        description: '设备树仓库（就是本仓库）。留空则用当前仓库。前提：仓库里能找 ofox-build/device/oppo/PGGM10/ 或 device/oppo/PGGM10/'
        type: string
        default: ''
      kernel_source:
        description: '内核来源。★release = 从 GitHub Release 资产下载原厂内核 Image 与 dtb.img（推荐：原厂固件不适合 commit 进公开仓库）；local = 用仓库里已放好的 ofox-prep/Image + ofox-prep/dtb.img（私有仓库才建议）；custom = 从下面的自定义内核仓库取已编好的 Image'
        type: choice
        options:
          - release
          - local
          - custom
        default: release
      prebuilt_release_tag:
        description: 'kernel_source=release 时：存放原厂固件资产的 Release 标签。workflow 会去这个 tag 下找名为 Image 和 dtb.img 的资产'
        type: string
        default: 'ofox-prebuilt'
      prebuilt_repo:
        description: 'kernel_source=release 时：存放 Release 资产的仓库（形如 用户名/仓库名）。留空则用当前仓库'
        type: string
        default: ''
      custom_kernel_repo:
        description: 'kernel_source=custom 时：提供已编好 Image 的仓库（形如 用户名/仓库名）'
        type: string
        default: 'xuannhuan9-lgtm/OPPO_Kernel_Release'
      use_ccache:
        description: '是否启用 ccache 加速后续构建'
        type: boolean
        default: true
      build_target:
        description: '★通常不用填★ lunch 目标，仅作【兜底】。正常情况 workflow 会自动从 `lunch` 输出里探测合法组合（A13/A14 三段式如 fox_PGGM10-trunk_staging-eng；A12 两段式如 fox_PGGM10-eng），探测不到时才用这个值。留空 = fox_PGGM10-trunk_staging-eng'
        required: false
        default: ''
      make_jobs:
        description: '并行编译线程数。GitHub 免费 runner 是 4 核，填 4 最合适；填太大反而会 OOM 被 kill'
        type: string
        default: '4'

permissions:
  contents: read

jobs:
  build:
    name: Build OrangeFox for PGGM10
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    env:
      FOX_BRANCH: ${{ inputs.fox_branch }}
      MANIFEST_SOURCE: ${{ inputs.manifest_source }}
      KERNEL_SOURCE: ${{ inputs.kernel_source }}
      CUSTOM_KERNEL_REPO: ${{ inputs.custom_kernel_repo }}
      DEVICE_TREE_REPO: ${{ inputs.device_tree_repo != '' && inputs.device_tree_repo || github.repository }}
      MAKE_JOBS: ${{ inputs.make_jobs }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G
      CCACHE_COMPRESS: '1'
      DEVICE: PGGM10
      DEVICE_ALT: OP5295
      # ★只是兜底默认值★ 正常情况下 workflow 会从 `lunch` 输出里自动探测合法组合。
      # A13/A14 是三段式 <product>-<release>-<variant>，所以默认给三段式。
      BUILD_TARGET: ${{ inputs.build_target != '' && inputs.build_target || 'fox_PGGM10-trunk_staging-eng' }}
      HELPER_DIR: ${{ github.workspace }}/ofox-build/scripts
      PREBUILT_RELEASE_TAG: ${{ inputs.prebuilt_release_tag }}
      PREBUILT_REPO: ${{ inputs.prebuilt_repo != '' && inputs.prebuilt_repo || github.repository }}

    steps:
      - name: 检出本仓库（拿到设备树 + 辅助脚本 + ofox-prep 备份）
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 环境自检
        run: |
          echo "::group::基础环境"
          echo "runner       : $(uname -a)"
          echo "CPU 核数      : $(nproc)"
          echo "内存          : $(free -h | awk '/Mem:/{print $2}')"
          echo "磁盘可用      : $(df -h "$GITHUB_WORKSPACE" | tail -1 | awk '{print $4}')"
          echo "repo 分支     : $FOX_BRANCH"
          echo "manifest 来源 : $MANIFEST_SOURCE"
          echo "设备树仓库    : $DEVICE_TREE_REPO"
          echo "内核来源      : $KERNEL_SOURCE"
          echo "编译目标      : $BUILD_TARGET"
          echo "::endgroup::"
          test -d "$HELPER_DIR" || { echo "::error::找不到 $HELPER_DIR"; exit 1; }
          ls -la "$HELPER_DIR"

      - name: 释放磁盘空间
        run: |
          echo "清理前: $(df -h / | tail -1 | awk '{print $4}') 可用"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
                      /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          echo "清理后: $(df -h / | tail -1 | awk '{print $4}') 可用"

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            python3 python3-pip rsync schedtool squashfs-tools xsltproc \
            zip zlib1g-dev openjdk-11-jdk android-sdk-libsparse-utils \
            e2fsprogs f2fs-tools unzip xxd

      - name: 配置 git 身份与 repo 工具
        run: |
          git config --global user.name  "ofox-ci"
          git config --global user.email "ofox-ci@localhost"
          git config --global color.ui false
          mkdir -p "$HOME/bin"
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/repo" --version

      - name: 同步橙狐源码（GitLab，官方脚本 + 版本号，非 fox_ 前缀）
        if: env.MANIFEST_SOURCE == 'orangefox'
        run: |
          set -o pipefail
          SRC_ROOT="$GITHUB_WORKSPACE/fox_src/OrangeFox"
          mkdir -p "$SRC_ROOT"
          cd "$GITHUB_WORKSPACE/fox_src"

          # ================================================================
          # ★关键★ 橙狐官方同步脚本要的是【不带 fox_ 前缀的版本号】！
          #
          #   官方 Usage（sync 仓库里 orangefox_sync.sh 自带）：
          #     orangefox_sync.sh --branch 16.0 --path ~/OrangeFox_16.0
          #     orangefox_sync.sh --branch 14.1 --path ~/OrangeFox_14.1
          #     orangefox_sync.sh --branch 12.1 --path ~/OrangeFox_12.1
          #
          #   脚本内部自己拼 fox_ 前缀 ⇒ 传 `fox_14.1` 会得到
          #     "fatal: couldn't find remote ref refs/heads/fox_14.1"
          #   这正是 run #4 四个分支全失败的原因（GitLab 其实是通的）。
          # ================================================================
          strip_prefix() {
            # fox_14.1 / FOX_14.1 / fox-14.1 → 14.1 ；已是 14.1 则原样
            echo "$1" | sed -E 's/^[Ff][Oo][Xx][_-]?//'
          }

          DEFAULT_VERSIONS="14.1 13.1 16.0 12.1 11.0"
          if [ "$FOX_BRANCH" = "fox_14.1" ]; then
            CANDIDATES="$DEFAULT_VERSIONS"
            echo "::notice::使用默认候选版本序列（不带前缀）：$CANDIDATES"
          else
            CANDIDATES="$(strip_prefix "$FOX_BRANCH")"
            echo "::notice::用户显式指定，只尝试版本：$CANDIDATES"
          fi

          # ================================================================
          # 1) 连通性预检 + ls-remote 真实 ref 发现
          #    每条都写成独立 ::error:: 注解 —— 注解是远程唯一能看到的信息
          # ================================================================
          probe_ann() {
            local code
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -L "$2" 2>/dev/null || echo "000")
            echo "::error::$1 [$code] $2"
            [ "$code" = "200" ] && return 0 || return 1
          }

          GL_OK=1
          probe_ann "预检(git-upload-pack)" "https://gitlab.com/OrangeFox/manifest.git/info/refs?service=git-upload-pack" || GL_OK=0
          probe_ann "预检(git-upload-pack)" "https://gitlab.com/OrangeFox/sync.git/info/refs?service=git-upload-pack" || GL_OK=0

          echo "::error::预检结论：GitLab 可达性 GL_OK=$GL_OK（1=可达，0=不可达）"
          echo "::error::候选版本(不带前缀) = $CANDIDATES"

          # ---- ls-remote：把 manifest / sync 的真实分支全列出来 ----
          for REPO in manifest sync; do
            URL="https://gitlab.com/OrangeFox/${REPO}.git"
            echo "::error::ls-remote $REPO: 开始读取 $URL"
            LSRC=0
            LSOUT=$(git ls-remote --heads "$URL" 2>&1) || LSRC=$?
            if [ "$LSRC" -ne 0 ]; then
              echo "::error::ls-remote $REPO: 失败(rc=$LSRC) —— $(echo "$LSOUT" | head -1)"
            else
              N=$(echo "$LSOUT" | wc -l)
              echo "::error::ls-remote $REPO: 成功，共 $N 个分支"
              echo "$LSOUT" | awk '{print $2}' | sed 's#refs/heads/##' | tr '\n' ' ' > /tmp/refs-$REPO.txt
              echo "::error::ls-remote $REPO: 分支列表 = $(cat /tmp/refs-$REPO.txt)"
              # 再逐条打出来，避免一行太长被截断
              echo "$LSOUT" | awk '{print $2}' | sed 's#refs/heads/##' | while IFS= read -r r; do
                [ -z "$r" ] && continue
                echo "::error::ls-remote $REPO 分支: $r"
              done
            fi
          done

          # ---- 从 ls-remote 结果里挑出真正存在的目标分支 ----
          # 官方分支名是 fox_<ver>，脚本要的是 <ver>。所以：
          #   真实 ref = fox_<ver>  → 传给脚本的是 <ver>
          DISCOVERED=""
          if [ -f /tmp/refs-manifest.txt ]; then
            for V in $CANDIDATES; do
              if grep -qE "(^| )fox_${V}( |$)" /tmp/refs-manifest.txt; then
                DISCOVERED="$DISCOVERED $V"
              fi
            done
          fi
          if [ -n "$DISCOVERED" ]; then
            echo "::error::发现可用版本（manifest 里存在 fox_<版本>）= $DISCOVERED"
            CANDIDATES="$DISCOVERED"
          else
            echo "::error::未能在 manifest 的 ls-remote 结果里匹配到候选版本 $CANDIDATES"
            echo "::error::将按原候选顺序继续尝试（可能仍然失败）"
          fi

          if [ "$GL_OK" != "1" ]; then
            echo "::error::★结论：GitLab 不可达★（依据：上面两条 git-upload-pack 预检非 200/000）"
            echo "::error::这与分支名无关，请改用 manifest_source=twrp_minimal + fox_branch=twrp-14.1"
          else
            echo "::error::★结论：GitLab 可达★，若下面仍失败则是【分支/ref 不存在】，不是网络问题"
          fi

          # ================================================================
          # 2) 逐个候选版本尝试（官方脚本优先，repo init 回退）
          # ================================================================
          ROOT=""
          USED_BRANCH=""
          SYNC_SCRIPT=""
          FIRST=1

          for V in $CANDIDATES; do
            echo ""
            echo "::group::尝试版本 $V（官方脚本参数 --branch $V）"
            rm -rf "$SRC_ROOT"
            mkdir -p "$SRC_ROOT"

            OK=0
            rm -rf /tmp/ofox-sync
            if git clone --depth=1 https://gitlab.com/OrangeFox/sync.git /tmp/ofox-sync 2>&1 | tail -5; then
              echo "  sync 仓库克隆成功"
              SYNC_SCRIPT=""
              for cand in /tmp/ofox-sync/orangefox_sync.sh /tmp/ofox-sync/sync.sh; do
                [ -f "$cand" ] && SYNC_SCRIPT="$cand" && break
              done

              if [ -n "$SYNC_SCRIPT" ]; then
                chmod +x "$SYNC_SCRIPT"
                # 第一次尝试加 --debug，便于看脚本内部到底做了什么
                if [ "$FIRST" = "1" ]; then
                  ARGS="--branch $V --path $SRC_ROOT --debug"
                else
                  ARGS="--branch $V --path $SRC_ROOT"
                fi
                echo "  执行: $SYNC_SCRIPT $ARGS"
                if "$SYNC_SCRIPT" $ARGS > /tmp/sync-$V.log 2>&1; then
                  tail -20 /tmp/sync-$V.log
                  [ -f "$SRC_ROOT/build/envsetup.sh" ] && OK=1
                else
                  echo "  !! 官方脚本失败，报错尾部 20 行："
                  tail -20 /tmp/sync-$V.log
                  while IFS= read -r l; do
                    [ -z "$l" ] && continue
                    echo "::error::版本 $V 报错(官方脚本): $l"
                  done < <(tail -3 /tmp/sync-$V.log 2>/dev/null)
                fi
              else
                echo "  !! sync 仓库里没有 orangefox_sync.sh / sync.sh"
                echo "::error::版本 $V 报错(官方脚本): sync 仓库里没有 orangefox_sync.sh / sync.sh"
              fi
            else
              echo "  !! sync 仓库克隆失败"
              echo "::error::版本 $V 报错(git clone): 无法克隆 https://gitlab.com/OrangeFox/sync.git"
            fi

            # ---- 回退：repo init 用真实存在的 ref 名 fox_<ver> ----
            if [ "$OK" != "1" ]; then
              echo "  ---- 回退到 repo init -b fox_$V ----"
              cd "$SRC_ROOT"
              if "$HOME/bin/repo" init -u https://gitlab.com/OrangeFox/manifest.git \
                     -b "fox_$V" --depth=1 --no-repo-verify -q 2>&1 | tail -10; then
                if "$HOME/bin/repo" sync -c -j"$MAKE_JOBS" --force-sync --no-clone-bundle --no-tags \
                       > /tmp/reposync-$V.log 2>&1; then
                  tail -20 /tmp/reposync-$V.log
                  [ -f build/envsetup.sh ] && OK=1
                else
                  echo "  !! repo sync 失败，报错尾部 20 行："
                  tail -20 /tmp/reposync-$V.log
                  while IFS= read -r l; do
                    [ -z "$l" ] && continue
                    echo "::error::版本 $V 报错(repo sync): $l"
                  done < <(tail -3 /tmp/reposync-$V.log 2>/dev/null)
                fi
              else
                echo "  !! repo init 失败（refs/heads/fox_$V 可能不存在）"
                echo "::error::版本 $V 报错(repo init): refs/heads/fox_$V 可能不存在"
              fi
              cd "$GITHUB_WORKSPACE/fox_src"
            fi

            if [ "$OK" = "1" ]; then
              ROOT="$SRC_ROOT"
              USED_BRANCH="$V"
              echo "::notice::✓ 版本 $V 同步成功"
              echo "::endgroup::"
              break
            fi

            echo "::warning::版本 $V 同步失败"
            echo "::endgroup::"
            FIRST=0
          done

          # ================================================================
          # 3) 结果处理
          # ================================================================
          if [ -z "$ROOT" ]; then
            echo "::error::所有候选版本都同步失败（试过: $CANDIDATES）"
            if [ "$GL_OK" = "1" ]; then
              echo "::error::★原因判定：GitLab 可达，所以是【分支/ref 不存在】，不是网络问题★"
              echo "::error::依据：git-upload-pack 预检返回 200，但 refs/heads/fox_<版本> 拉不到"
              echo "::error::请对照上面 'ls-remote manifest 分支:' 的注解，挑一个真实存在的版本"
            else
              echo "::error::★原因判定：GitLab 不可达★（git-upload-pack 预检非 200）"
              echo "::error::请改用 manifest_source=twrp_minimal + fox_branch=twrp-14.1"
            fi
            for V in $CANDIDATES; do
              echo "::error::版本 $V 同步失败"
            done
            exit 1
          fi

          echo "::error::同步成功：使用版本 $USED_BRANCH（官方 ref = fox_$USED_BRANCH）"

          if [ "$USED_BRANCH" != "$(strip_prefix "$FOX_BRANCH")" ]; then
            echo "::warning::════════════════════════════════════════════════════════"
            echo "::warning::★注意：实际使用版本 $USED_BRANCH，不是请求的 $FOX_BRANCH★"
            echo "::warning::这是跨版本构建（目标机是 Android 14）。"
            echo "::warning::我们已用「原厂 ramdisk 为底 + 白名单覆盖」策略挡住"
            echo "::warning::绝大部分库版本冲突（init/linker64/libc 保持原厂），"
            echo "::warning::最坏情况是橙狐起不来、Android 仍可进。"
            echo "::warning::但 recovery 二进制自身仍可能更挑剔，风险高于 14.1。"
            echo "::warning::════════════════════════════════════════════════════════"
          else
            echo "::notice::使用版本 $USED_BRANCH"
          fi

          echo "$ROOT" > "$GITHUB_WORKSPACE/.srcroot"
          echo "fox_$USED_BRANCH" > "$GITHUB_WORKSPACE/.usedbranch"
          echo "::notice::源码根 = $ROOT (版本 $USED_BRANCH / ref fox_$USED_BRANCH)"

      - name: 同步 TWRP 精简源码（备选，托管在 GitHub，不依赖 GitLab）
        if: env.MANIFEST_SOURCE == 'twrp_minimal'
        timeout-minutes: 45
        run: |
          set -o pipefail
          SRC_ROOT="$GITHUB_WORKSPACE/fox_src/OrangeFox"
          rm -rf "$GITHUB_WORKSPACE/fox_src"
          mkdir -p "$SRC_ROOT"
          cd "$SRC_ROOT"

          # ★尊重用户的 fox_branch 输入★
          # 这条路由 minimal-manifest-twrp 提供，分支名是 twrp-<版本>。
          # 若用户填的是 fox_14.1 这类橙狐分支名，映射成对应的 twrp-<版本>。
          case "$FOX_BRANCH" in
            twrp-*) TWRP_BRANCH="$FOX_BRANCH" ;;
            fox_14.1|fox_14*) TWRP_BRANCH="twrp-14.1" ;;
            fox_13*) TWRP_BRANCH="twrp-13.0" ;;
            fox_12.1|fox_12*) TWRP_BRANCH="twrp-12.1" ;;
            fox_11*) TWRP_BRANCH="twrp-11.0" ;;
            *) TWRP_BRANCH="twrp-12.1" ;;
          esac
          echo "::notice::minimal-manifest-twrp：请求分支 $FOX_BRANCH → 实际使用 $TWRP_BRANCH"

          # 预检（便于诊断）
          echo "::group::GitHub 分支预检"
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -L \
                 "https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp/tree/$TWRP_BRANCH" 2>/dev/null || echo "000")
          echo "  [$CODE] https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp/tree/$TWRP_BRANCH"
          echo "::endgroup::"

          echo "::group::repo init"
          "$HOME/bin/repo" init \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b "$TWRP_BRANCH" --depth=1 --no-repo-verify -q
          echo "::endgroup::"

          # ★原来这里写的是  repo sync ... | tail -60★
          #   `| tail` 会把全部输出缓冲到结束才吐 ⇒ 日志里看不到任何进度，
          #   看起来就像卡死（实测同步要 15~23 分钟，很正常）。
          #   改成：后台跑 + 每 60 秒打一次心跳，进度实时可见。
          echo "::group::repo sync（实时心跳）"
          T0=$(date +%s)
          "$HOME/bin/repo" sync -c -j"$MAKE_JOBS" --force-sync --no-clone-bundle --no-tags \
              > /tmp/reposync.log 2>&1 &
          SYNC_PID=$!
          while kill -0 "$SYNC_PID" 2>/dev/null; do
            sleep 60
            kill -0 "$SYNC_PID" 2>/dev/null || break
            echo "[心跳 $(($(date +%s)-T0))s] 日志 $(wc -l < /tmp/reposync.log) 行 | $(tail -1 /tmp/reposync.log | tr -d '\r' | cut -c1-110)"
          done
          wait "$SYNC_PID"; SYNC_RC=$?
          echo "[同步结束] 耗时 $(($(date +%s)-T0))s，退出码 $SYNC_RC，日志 $(wc -l < /tmp/reposync.log) 行"
          tail -40 /tmp/reposync.log
          echo "::endgroup::"
          if [ "$SYNC_RC" != "0" ]; then
            echo "::warning::repo sync 退出码 $SYNC_RC（不一定是致命错误，继续看源码树是否完整）"
          fi

          if [ ! -f "$SRC_ROOT/build/envsetup.sh" ]; then
            echo "::error::同步后没有 build/envsetup.sh，源码树不完整（分支 $TWRP_BRANCH）。"
            exit 1
          fi

          echo "$SRC_ROOT" > "$GITHUB_WORKSPACE/.srcroot"
          echo "$TWRP_BRANCH" > "$GITHUB_WORKSPACE/.usedbranch"
          echo "::notice::源码根 = $SRC_ROOT (分支 $TWRP_BRANCH)"

      - name: 定位源码根目录
        id: srcroot
        run: |
          ROOT=""
          # 优先用同步步骤写下的路径
          if [ -f "$GITHUB_WORKSPACE/.srcroot" ]; then
            CAND=$(cat "$GITHUB_WORKSPACE/.srcroot")
            [ -d "$CAND/.repo" ] && ROOT="$CAND"
          fi
          if [ -z "$ROOT" ]; then
            for cand in "$GITHUB_WORKSPACE/fox_src/OrangeFox" \
                        "$GITHUB_WORKSPACE/fox_src/OrangeFox/OrangeFox" \
                        "$GITHUB_WORKSPACE/fox_src"; do
              if [ -d "$cand/.repo" ]; then ROOT="$cand"; break; fi
            done
          fi
          if [ -z "$ROOT" ]; then
            echo "::error::找不到源码根目录（没有 .repo）。同步步骤可能失败了，看上面的 repo sync 输出。"
            exit 1
          fi
          if [ ! -f "$ROOT/build/envsetup.sh" ]; then
            echo "::error::$ROOT 下没有 build/envsetup.sh，源码树不完整。"
            exit 1
          fi
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          if [ -f "$GITHUB_WORKSPACE/.usedbranch" ]; then
            echo "::notice::实际使用分支 = $(cat "$GITHUB_WORKSPACE/.usedbranch")"
          fi
          echo "::notice::源码根目录 = $ROOT"

      - name: 放入设备树 device/oppo/PGGM10
        run: |
          SRC_ROOT="${{ steps.srcroot.outputs.root }}"
          if [ -d "$GITHUB_WORKSPACE/ofox-build/device/oppo/PGGM10" ]; then
            SRC_DEV="$GITHUB_WORKSPACE/ofox-build/device/oppo/PGGM10"
          elif [ -d "$GITHUB_WORKSPACE/device/oppo/PGGM10" ]; then
            SRC_DEV="$GITHUB_WORKSPACE/device/oppo/PGGM10"
          else
            echo "::error::仓库里找不到 device/oppo/PGGM10（试过 ofox-build/ 与根目录）"
            exit 1
          fi
          mkdir -p "$SRC_ROOT/device/oppo"
          rm -rf "$SRC_ROOT/device/oppo/PGGM10"
          cp -a "$SRC_DEV" "$SRC_ROOT/device/oppo/PGGM10"
          echo "::notice::设备树已放入 $SRC_ROOT/device/oppo/PGGM10"
          ls -la "$SRC_ROOT/device/oppo/PGGM10"

      - name: 准备 prebuilt 与原料（Release 资产，全部 < 25MB）
        run: |
          set -e
          SRC_ROOT="${{ steps.srcroot.outputs.root }}"
          DEV_DIR="$SRC_ROOT/device/oppo/PGGM10"
          MAT="$GITHUB_WORKSPACE/materials"
          TOOLS="$GITHUB_WORKSPACE/ofox-build/tools"
          mkdir -p "$DEV_DIR/prebuilt" "$MAT"

          REL_REPO="${PREBUILT_REPO:-$DEVICE_TREE_REPO}"
          REL_TAG="${PREBUILT_RELEASE_TAG}"
          BASE="https://github.com/${REL_REPO}/releases/download/${REL_TAG}"

          # 下载一个资产；成功返回 0。$1=资产名 $2=目标路径
          fetch() {
            echo "::notice::尝试下载资产 $1"
            if curl -fsSL --retry 3 --retry-delay 2 "$BASE/$1" -o "$2"; then
              echo "  成功: $(stat -c%s "$2") 字节"
              return 0
            fi
            rm -f "$2"
            echo "  失败/不存在: $1"
            return 1
          }

          # ================= 1) 内核：优先 Image.gz，回退 Image =================
          if [ "$KERNEL_SOURCE" = "release" ]; then
            if fetch "Image.gz" "$MAT/Image.gz"; then
              echo "::notice::解压 Image.gz → prebuilt/Image"
              gunzip -c "$MAT/Image.gz" > "$DEV_DIR/prebuilt/Image"
              ISIZE=$(stat -c%s "$DEV_DIR/prebuilt/Image")
              echo "::notice::解压后大小 = $ISIZE 字节（期望 48595008）"
            elif fetch "Image" "$DEV_DIR/prebuilt/Image"; then
              echo "::notice::Release 里是未压缩的 Image，直接使用"
            else
              echo "::error::拿不到内核：Release '$REL_TAG' 里 Image.gz 与 Image 都没有。"
              exit 1
            fi

          elif [ "$KERNEL_SOURCE" = "local" ]; then
            echo "::notice::使用仓库里的 ofox-prep/Image"
            [ -f "$GITHUB_WORKSPACE/ofox-prep/Image" ] || {
              echo "::error::找不到 ofox-prep/Image"; exit 1; }
            cp "$GITHUB_WORKSPACE/ofox-prep/Image" "$DEV_DIR/prebuilt/Image"

          else
            echo "::notice::从 $CUSTOM_KERNEL_REPO 取自定义内核"
            mkdir -p /tmp/kern
            URL=$(curl -sL "https://api.github.com/repos/$CUSTOM_KERNEL_REPO/releases/latest" | grep -o '"browser_download_url": *"[^"]*"' | sed 's/.*"\(https[^"]*\)"/\1/' | grep -Ei '/(Image|Image\.gz)$' | head -1)
            [ -n "$URL" ] || URL="https://raw.githubusercontent.com/$CUSTOM_KERNEL_REPO/main/arch/arm64/boot/Image"
            echo "下载: $URL"
            curl -fL "$URL" -o /tmp/kern/Image || {
              echo "::error::自定义内核下载失败。"; exit 1; }
            if file /tmp/kern/Image | grep -qi gzip; then
              gunzip -c /tmp/kern/Image > "$DEV_DIR/prebuilt/Image"
            else
              cp /tmp/kern/Image "$DEV_DIR/prebuilt/Image"
            fi
          fi

          # ================= 2) dtb.img =================
          if ! fetch "dtb.img" "$DEV_DIR/prebuilt/dtb.img"; then
            if [ -f "$GITHUB_WORKSPACE/ofox-prep/dtb.img" ]; then
              cp "$GITHUB_WORKSPACE/ofox-prep/dtb.img" "$DEV_DIR/prebuilt/dtb.img"
              echo "::notice::使用仓库里的 ofox-prep/dtb.img"
            else
              echo "::error::拿不到 dtb.img"; exit 1
            fi
          fi

          # ================= 3) 原厂 ramdisk（合并的底）=================
          if ! fetch "stock-ramdisk.gz" "$MAT/stock-ramdisk.gz"; then
            if [ -f "$GITHUB_WORKSPACE/ofox-prep/stock-ramdisk.gz" ]; then
              cp "$GITHUB_WORKSPACE/ofox-prep/stock-ramdisk.gz" "$MAT/stock-ramdisk.gz"
              echo "::notice::使用仓库里的 ofox-prep/stock-ramdisk.gz"
            else
              echo "::error::拿不到 stock-ramdisk.gz（单分区双模式必需）。"
              exit 1
            fi
          fi

          # ================= 4) boot 模板 =================
          #   优先用完整的 boot_a.img（如果有，>=50MB，网页端传不上来，通常没有）；
          #   否则用 boot-header.bin(4096) 在 CI 里重建模板。
          TEMPLATE_OK=""
          if fetch "boot_a.img" "$MAT/boot_a.img"; then
            BSZ=$(stat -c%s "$MAT/boot_a.img")
            if [ "$BSZ" -ge 50000000 ]; then
              echo "::notice::使用 Release 里的完整 boot_a.img（$BSZ 字节）"
              TEMPLATE_OK="full"
            else
              echo "::warning::boot_a.img 只有 $BSZ 字节，太小，弃用"
              rm -f "$MAT/boot_a.img"
            fi
          fi

          if [ -z "$TEMPLATE_OK" ]; then
            if fetch "boot-header.bin" "$MAT/boot-header.bin"; then
              echo "::notice::用 boot-header.bin 重建 boot 模板"
              python3 "$TOOLS/rebuild_boot_template.py" \
                "$MAT/boot-header.bin" "$DEV_DIR/prebuilt/Image" "$MAT/boot_a.img"
              TEMPLATE_OK="rebuilt"
            elif [ -f "$GITHUB_WORKSPACE/ofox-prep/boot_a.img" ]; then
              cp "$GITHUB_WORKSPACE/ofox-prep/boot_a.img" "$MAT/boot_a.img"
              echo "::notice::使用仓库里的 ofox-prep/boot_a.img"
              TEMPLATE_OK="local"
            else
              echo "::error::拿不到 boot 模板：Release 里既没有 boot_a.img 也没有 boot-header.bin。"
              echo "::error::单分区双模式必须有原厂 boot 头部作为拼装模板。"
              exit 1
            fi
          fi
          echo "::notice::boot 模板来源 = $TEMPLATE_OK ($(stat -c%s "$MAT/boot_a.img") 字节)"

          # ================= 5) MANIFEST 校验（可选但推荐）=================
          if fetch "MANIFEST.txt" "$MAT/MANIFEST.txt"; then
            echo "::group::按 MANIFEST.txt 校验资产"
            python3 "$TOOLS/check_manifest.py" "$MAT/MANIFEST.txt" "$MAT" "$DEV_DIR/prebuilt" || {
              echo "::error::资产 sha256 校验未通过，拒绝继续（防止用到下载损坏的文件）"
              exit 1
            }
            echo "::endgroup::"
          else
            echo "::warning::Release 里没有 MANIFEST.txt，跳过 sha256 校验"
          fi

          # ================= 6) 汇总自检 =================
          echo "::group::内核自检"
          file "$DEV_DIR/prebuilt/Image" || true
          KSIZE=$(stat -c%s "$DEV_DIR/prebuilt/Image")
          KMAGIC=$(head -c4 "$DEV_DIR/prebuilt/Image" | od -An -tx1 | tr -d ' \n')
          echo "内核: $KSIZE 字节, magic=$KMAGIC (arm64 Image 应为 4d5a0091)"
          [ "$KSIZE" -ge 1000000 ] || { echo "::error::内核太小"; exit 1; }
          [ "$KMAGIC" = "4d5a0091" ] && echo "::notice::✓ 标准 arm64 Image" || echo "::warning::内核 magic 非 4d5a0091"
          echo "::endgroup::"

          echo "::group::dtb 自检"
          DSIZE=$(stat -c%s "$DEV_DIR/prebuilt/dtb.img")
          DMAGIC=$(head -c4 "$DEV_DIR/prebuilt/dtb.img" | od -An -tx1 | tr -d ' \n')
          echo "dtb: $DSIZE 字节, magic=$DMAGIC (FDT 应为 d00dfeed)"
          [ "$DMAGIC" = "d00dfeed" ] || { echo "::error::dtb magic 不对"; exit 1; }
          echo "::endgroup::"

          echo "::group::原料汇总"
          echo "boot 模板 : $(stat -c%s "$MAT/boot_a.img") 字节（来源 $TEMPLATE_OK）"
          echo "原厂 ramdisk: $(stat -c%s "$MAT/stock-ramdisk.gz") 字节"
          ls -la "$DEV_DIR/prebuilt" "$MAT"
          echo "::endgroup::"

      - name: 恢复 ccache
        if: inputs.use_ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ofox-${{ env.FOX_BRANCH }}-${{ env.DEVICE }}-${{ github.sha }}
          restore-keys: |
            ofox-${{ env.FOX_BRANCH }}-${{ env.DEVICE }}-
            ofox-${{ env.FOX_BRANCH }}-

      - name: lunch 并编译 recoveryimage
        timeout-minutes: 120
        run: |
          set -o pipefail
          SRC_ROOT="${{ steps.srcroot.outputs.root }}"
          cd "$SRC_ROOT"

          LOG=/tmp/build.log
          : > "$LOG"

          emit_errors() {
            local log="$1" label="$2" n="${3:-25}"
            local found=0
            echo "::group::$label —— 匹配到的报错行"
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              echo "::error::$label | $line"
              found=$((found+1))
            done < <(grep -n -i -E 'error:|FAILED:|ninja: build stopped|No rule to make|fatal error|undefined reference|Nothing to do|cannot find|No such file' "$log" 2>/dev/null | tail -"$n")
            [ "$found" = "0" ] && echo "（未匹配到典型报错关键字，见下面的结尾上下文）"
            echo "::endgroup::"
            echo "::group::$label —— 日志最后 20 行"
            while IFS= read -r line; do
              echo "::error::$label(尾) | $line"
            done < <(tail -20 "$log" 2>/dev/null)
            echo "::endgroup::"
          }

          # ================================================================
          # ================================================================
          # 1) lunch（★三套策略，绝不因为 set -e 丢日志★）
          #
          #   策略 A: 直接 lunch fox_PGGM10-trunk_staging-eng（A13/A14 三段式）
          #   策略 B: 从 lunch（无参数）输出里探测合法组合再 lunch
          #   策略 C: ★完全绕过 lunch★ —— 手工导出 TARGET_* 后直接 make
          #           （AOSP 的 lunch 本质就是设这几个变量 + 调 m，
          #             产品解析失败时这是唯一还能出错的路径）
          #
          #   ★为什么这么写★ run #7/#8/#9/#10 都死在 lunch，但 artifact 里
          #   连 /tmp/lunch.log 都没有 —— 说明 set -e 在写日志前就退出了。
          #   下面全程 set +e，每一步都把输出落到文件，最后统一打印。
          # ================================================================
          set +u
          set +e

          source build/envsetup.sh > /tmp/envsetup.log 2>&1
          ES_RC=$?
          echo "[envsetup] 返回码 $ES_RC，日志 $(wc -c < /tmp/envsetup.log) 字节"
          cat /tmp/envsetup.log || true

          : > /tmp/lunch.log
          : > /tmp/lunch-choices.log

          TARGET=""
          LUNCH_RC=1

          # ---- 策略 A：直接三段式 lunch ----
          for cand in "fox_PGGM10-trunk_staging-eng" "fox_PGGM10-trunk_staging-userdebug" \
                      "fox_PGGM10-trunk_staging-user"   "fox_PGGM10-eng"; do
            echo "::notice::策略A 尝试 lunch $cand"
            { echo "########## 策略A: lunch $cand ##########"; } >> /tmp/lunch.log
            lunch "$cand" >> /tmp/lunch.log 2>&1
            LUNCH_RC=$?
            echo "  返回码 $LUNCH_RC" | tee -a /tmp/lunch.log
            if [ "$LUNCH_RC" = "0" ]; then TARGET="$cand"; break; fi
          done

          # ---- 策略 B：先跑无参 lunch 拿到合法组合列表 ----
          echo "::notice::策略B 跑无参数 lunch 取组合列表"
          lunch > /tmp/lunch-choices.log 2>&1
          echo "=== lunch(无参) 输出 $(wc -l < /tmp/lunch-choices.log) 行 ==="
          cat /tmp/lunch-choices.log || true

          if [ -z "$TARGET" ]; then
            FOUND=$(grep -oE 'fox_PGGM10-[A-Za-z0-9_.]*-[a-z]+' /tmp/lunch-choices.log | sort -u | head -5)
            if [ -n "$FOUND" ]; then
              echo "::notice::策略B 从列表里发现: $(echo "$FOUND" | tr '\n' ' ')"
              for cand in $FOUND; do
                { echo "########## 策略B: lunch $cand ##########"; } >> /tmp/lunch.log
                lunch "$cand" >> /tmp/lunch.log 2>&1
                LUNCH_RC=$?
                echo "  返回码 $LUNCH_RC" | tee -a /tmp/lunch.log
                if [ "$LUNCH_RC" = "0" ]; then TARGET="$cand"; break; fi
              done
            else
              echo "::error::★策略B 的 lunch 列表里【没有】任何 fox_PGGM10-* 组合★"
            fi
          fi

          # ---- 全局打印 lunch.log（无论成败，都在这里落到 CI 日志 + artifact）----
          echo "===== lunch.log 开始（$(wc -l < /tmp/lunch.log) 行）====="
          cat /tmp/lunch.log || true
          echo "===== lunch.log 结束 ====="

          # ---- 策略 C：绕过 lunch，手工设变量 ----
          if [ -z "$TARGET" ] || [ "${TARGET_DEVICE:-}" != "PGGM10" ]; then
            echo "::error::★lunch 未成功，启用策略C：手工导出 TARGET_* 直接 make★"
            export TARGET_PRODUCT=fox_PGGM10
            export TARGET_DEVICE=PGGM10
            export TARGET_BUILD_VARIANT=eng
            export TARGET_RELEASE=trunk_staging
            export TARGET_BUILD_TYPE=release
            export TARGET_PRODUCT_ALT=OP5295
            export OUT_DIR="${OUT_DIR:-out}"
            unset TARGET_BOARD_PLATFORM_GPU 2>/dev/null || true
            # 让 build 系统按这些变量解析产品；报错会原样打出来
            { echo "########## 策略C: printconfig ##########"; } >> /tmp/lunch.log
            printconfig >> /tmp/lunch.log 2>&1 || true
            echo "===== 策略C printconfig 输出 ====="
            tail -30 /tmp/lunch.log || true
          fi
          set -e

          echo "::group::构建变量确认"
          echo "TARGET_DEVICE        = ${TARGET_DEVICE:-未设置}"
          echo "TARGET_PRODUCT       = ${TARGET_PRODUCT:-未设置}"
          echo "TARGET_BUILD_VARIANT = ${TARGET_BUILD_VARIANT:-未设置}"
          echo "TARGET_RELEASE       = ${TARGET_RELEASE:-未设置}"
          echo "OUT_DIR              = ${OUT_DIR:-未设置}"
          echo "OF_USE_MAGISKBOOT    = ${OF_USE_MAGISKBOOT:-未设置}"
          echo "FOX_VERSION          = ${FOX_VERSION:-未设置}"
          echo "::endgroup::"

          if [ "${TARGET_DEVICE:-}" != "PGGM10" ]; then
            echo "::error::★lunch/策略C 之后 TARGET_DEVICE 仍不是 PGGM10（实际='${TARGET_DEVICE:-}'）★"
            echo "::error::lunch.log 已完整打印在上面，artifact 里也有（build-log-PGGM10-${{ github.run_number }}）"
            echo "::error::最可能的原因：fox_PGGM10.mk 解析时报错（inherit 到不存在的文件 → \$(error)），"
            echo "::error::或 vendor/twrp/config/common.mk 自身 inherit 了精简 manifest 里没有的文件。"
            exit 1
          fi
          echo "::notice::★lunch 就绪：TARGET_DEVICE=$TARGET_DEVICE TARGET_PRODUCT=${TARGET_PRODUCT:-} 目标=$TARGET★"


          echo "::group::构建变量确认"
          echo "TARGET_DEVICE        = ${TARGET_DEVICE:-未设置}"
          echo "TARGET_PRODUCT       = ${TARGET_PRODUCT:-未设置}"
          echo "TARGET_BUILD_VARIANT = ${TARGET_BUILD_VARIANT:-未设置}"
          echo "TARGET_RELEASE       = ${TARGET_RELEASE:-未设置}"
          echo "OUT_DIR              = ${OUT_DIR:-未设置}"
          echo "OF_USE_MAGISKBOOT    = ${OF_USE_MAGISKBOOT:-未设置}"
          echo "FOX_VERSION          = ${FOX_VERSION:-未设置}"
          echo "::endgroup::"
          echo "::error::lunch 成功：TARGET_DEVICE=${TARGET_DEVICE:-未设置} TARGET_PRODUCT=${TARGET_PRODUCT:-未设置} VARIANT=${TARGET_BUILD_VARIANT:-未设置}"

          if [ "${TARGET_DEVICE:-}" != "PGGM10" ]; then
            echo "::error::lunch 之后 TARGET_DEVICE 不是 PGGM10（实际='${TARGET_DEVICE:-}'）"
            echo "::error::已 lunch 的目标 = $TARGET，TARGET_PRODUCT = ${TARGET_PRODUCT:-未设置}"
            echo "::error::排查: 1) AndroidProducts.mk 的 PRODUCT_MAKEFILES/COMMON_LUNCH_CHOICES"
            echo "::error::      2) fox_PGGM10.mk 里 PRODUCT_DEVICE 是否为 PGGM10"
            echo "::error::      3) 设备树是否真的放到了 device/oppo/PGGM10/"
            exit 1
          fi

          # ================================================================
          # 3) make
          # ================================================================
          echo "::group::make recoveryimage -j$MAKE_JOBS"
          set +e
          make -j"$MAKE_JOBS" recoveryimage > "$LOG" 2>&1
          RC=$?
          set -e
          tail -40 "$LOG"
          echo "::endgroup::"

          if [ "$RC" -ne 0 ]; then
            echo "::error::编译失败（make 返回 $RC），日志 $LOG（$(wc -l < "$LOG") 行）"
            emit_errors "$LOG" "make" 25
            if grep -q 'FAILED:' "$LOG"; then
              echo "::group::首个 FAILED 块上下文"
              START=$(grep -n 'FAILED:' "$LOG" | head -1 | cut -d: -f1)
              sed -n "$((START>5?START-5:1)),$((START+25))p" "$LOG" | while IFS= read -r line; do
                [ -z "$line" ] && continue
                echo "::error::FAILED块 | $line"
              done
              echo "::endgroup::"
            fi
            exit "$RC"
          fi
          echo "::notice::编译完成（日志 $(wc -l < "$LOG") 行）"
          echo "::error::编译成功，准备收集产物"

      - name: 收集产物（橙狐 recovery.img）
        run: |
          SRC_ROOT="${{ steps.srcroot.outputs.root }}"
          OUT="$GITHUB_WORKSPACE/out_artifacts"
          mkdir -p "$OUT"
          PROD="$SRC_ROOT/out/target/product/PGGM10"

          echo "::group::搜索 recovery 产物"
          find "$SRC_ROOT/out" -maxdepth 4 -name 'recovery*.img' 2>/dev/null | head -30
          echo "::endgroup::"

          FOUND=0
          for f in "$PROD/recovery.img" "$PROD/boot.img"; do
            if [ -f "$f" ]; then
              cp "$f" "$OUT/"
              echo "::notice::收集到 $(basename "$f") ($(stat -c%s "$f") 字节)"
              FOUND=1
            fi
          done

          for z in "$PROD"/OrangeFox*.zip "$PROD"/*.zip; do
            [ -f "$z" ] && cp "$z" "$OUT/" && echo "::notice::收集到 $(basename "$z")"
          done

          if [ "$FOUND" -eq 0 ]; then
            echo "::error::没收集到任何 recovery 镜像。检查上面的 make 输出。"
            ls -la "$PROD" 2>/dev/null || echo "（$PROD 不存在）"
            exit 1
          fi

          echo "::group::产物清单"
          ls -la "$OUT"
          sha256sum "$OUT"/* || true
          echo "::endgroup::"

      - name: 合并 ramdisk 并拼回 boot（产出 boot-ofox.img）
        run: |
          set -e
          OUT="$GITHUB_WORKSPACE/out_artifacts"
          MAT="$GITHUB_WORKSPACE/materials"
          TOOLS="$GITHUB_WORKSPACE/ofox-build/tools"
          IMG="$OUT/recovery.img"
          LIMIT=167772160

          echo "::group::工具检查"
          ls -la "$TOOLS"
          echo "::endgroup::"
          for t in cpio_tool.py ofox-merge-ramdisk.py ofox-splice.py extract_ofox_ramdisk.py verify_boot_ofox.py; do
            [ -f "$TOOLS/$t" ] || { echo "::error::缺少工具 $TOOLS/$t"; exit 1; }
          done

          if [ ! -f "$MAT/boot_a.img" ] || [ ! -f "$MAT/stock-ramdisk.gz" ]; then
            echo "::error::缺少原料（materials/boot_a.img 模板 或 materials/stock-ramdisk.gz）。"
            echo "模板会在上一步由 boot-header.bin + Image 自动重建（或直接用完整的 boot_a.img）；"
            echo "原厂 ramdisk 是合并的底，两个都不能少。请检查 Release 资产。"
            exit 1
          fi
          [ -f "$IMG" ] || { echo "::error::没有 recovery.img，无法合并。"; exit 1; }

          echo "::group::1) 从橙狐 recovery.img 解出 ramdisk"
          python3 "$TOOLS/extract_ofox_ramdisk.py" "$IMG" "$OUT/ofox-ramdisk.gz"
          echo "::endgroup::"

          echo "::group::2) 合并 ramdisk（原厂为底 + 橙狐白名单覆盖）"
          python3 "$TOOLS/ofox-merge-ramdisk.py" --stock "$MAT/stock-ramdisk.gz" --ofox "$OUT/ofox-ramdisk.gz" --out "$OUT/merged-ramdisk.gz" --report "$OUT/merge-report.md"
          echo "::endgroup::"
          [ -f "$OUT/merged-ramdisk.gz" ] || { echo "::error::合并失败"; exit 1; }

          echo "::group::3) 拼回 boot 镜像"
          python3 "$TOOLS/ofox-splice.py" --stock "$MAT/boot_a.img" --ramdisk "$OUT/merged-ramdisk.gz" --out "$OUT/boot-ofox.img"
          echo "::endgroup::"
          [ -f "$OUT/boot-ofox.img" ] || { echo "::error::拼装失败"; exit 1; }

          echo "::group::4) 产物严格校验"
          python3 "$TOOLS/verify_boot_ofox.py" "$OUT/boot-ofox.img" "$MAT/boot_a.img" "$LIMIT"
          echo "::endgroup::"

          # 清理中间产物，避免 artifact 里混入不必要的大文件
          rm -f "$OUT/ofox-ramdisk.gz" "$OUT/merged-ramdisk.gz"
          echo "::notice::最终产物 boot-ofox.img 已就绪（可直接 dd 刷进 boot 分区）"

      - name: 写构建信息（手机端脚本会核对）
        run: |
          OUT="$GITHUB_WORKSPACE/out_artifacts"
          META="$OUT/ofox-build-info.txt"
          {
            echo "# OrangeFox 构建信息"
            echo "device=PGGM10"
            echo "device_alt=OP5295"
            echo "soc=holi"
            echo "flash_mode=single-partition-dual-mode"
            echo "flash_target=boot"
            echo "flash_img=boot-ofox.img"
            echo "enter_recovery=adb reboot recovery (或 root 下 reboot recovery)"
            echo "note=/data 是 FBE 加密，橙狐大概率解不开，属预期现象"
            echo "fox_branch=$FOX_BRANCH"
            echo "manifest_source=$MANIFEST_SOURCE"
            echo "kernel_source=$KERNEL_SOURCE"
            echo "build_target=$BUILD_TARGET"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo
            echo "# 产物 sha256"
            cd "$OUT" && sha256sum ./* 2>/dev/null | sed 's|\./||'
          } > "$META"
          cat "$META"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-PGGM10-bootofox-${{ env.FOX_BRANCH }}-${{ github.run_number }}
          path: ${{ github.workspace }}/out_artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: 上传编译日志与诊断信息
        if: always()
        run: |
          # 把散落各处的日志集中到一个目录，避免路径不存在导致产物为空
          mkdir -p /tmp/diag
          for f in /tmp/build.log /tmp/lunch.log /tmp/lunch-choices.log /tmp/envsetup.log /tmp/reposync*.log /tmp/sync-*.log; do
            [ -f "$f" ] && cp "$f" /tmp/diag/ 2>/dev/null
          done
          # 源码树/分支信息
          [ -f "$GITHUB_WORKSPACE/.usedbranch" ] && cp "$GITHUB_WORKSPACE/.usedbranch" /tmp/diag/ 2>/dev/null
          [ -f "$GITHUB_WORKSPACE/.srcroot" ] && cp "$GITHUB_WORKSPACE/.srcroot" /tmp/diag/ 2>/dev/null
          # 产物清单
          {
            echo "=== run ${{ github.run_number }} ==="
            echo "FOX_BRANCH(input) = $FOX_BRANCH"
            echo "MANIFEST_SOURCE   = $MANIFEST_SOURCE"
            echo "BUILD_TARGET      = $BUILD_TARGET"
            echo "usedbranch        = $(cat "$GITHUB_WORKSPACE/.usedbranch" 2>/dev/null || echo 未知)"
            echo "srcroot           = $(cat "$GITHUB_WORKSPACE/.srcroot" 2>/dev/null || echo 未知)"
            echo ""
            echo "=== out_artifacts 清单 ==="
            ls -la "$GITHUB_WORKSPACE/out_artifacts" 2>/dev/null || echo "（无）"
            echo ""
            echo "=== 设备树 prebuilt 清单 ==="
            ls -la "${{ steps.srcroot.outputs.root }}/device/oppo/PGGM10/prebuilt" 2>/dev/null || echo "（无）"
            echo ""
            echo "=== materials 清单 ==="
            ls -la "$GITHUB_WORKSPACE/materials" 2>/dev/null || echo "（无）"
          } > /tmp/diag/INVENTORY.txt 2>&1
          ls -la /tmp/diag

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-PGGM10-${{ github.run_number }}
          path: /tmp/diag/*
          if-no-files-found: warn
          retention-days: 7

      - name: 失败诊断汇总
        if: failure()
        run: |
          ROOT="$(cat "$GITHUB_WORKSPACE/.srcroot" 2>/dev/null || echo 未知)"
          USED="$(cat "$GITHUB_WORKSPACE/.usedbranch" 2>/dev/null || echo 未知)"
          echo "::error::════════ 构建失败诊断 ════════"
          echo "::error::TARGET_DEVICE  = ${TARGET_DEVICE:-未设置}"
          echo "::error::TARGET_PRODUCT = ${TARGET_PRODUCT:-未设置}"
          echo "::error::BUILD_TARGET   = ${BUILD_TARGET:-未设置}"
          echo "::error::源码根         = $ROOT"
          echo "::error::使用分支       = $USED"
          echo "::error::请求分支       = ${FOX_BRANCH:-未设置}"
          echo "::error::MANIFEST_SOURCE= ${MANIFEST_SOURCE:-未设置}"
          echo "::error::────────────────────────────"

          # 把编译日志里的真实报错再打一遍注解（防止只在 build 步骤里出现过）
          if [ -f /tmp/build.log ]; then
            echo "::error::build.log 共 $(wc -l < /tmp/build.log) 行，下面重放关键报错："
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              echo "::error::build | $line"
            done < <(grep -n -i -E 'error:|FAILED:|ninja: build stopped|No rule to make|fatal error|undefined reference|Nothing to do|cannot find|No such file' /tmp/build.log 2>/dev/null | tail -20)
            echo "::error::build.log 结尾："
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              echo "::error::build(尾) | $line"
            done < <(tail -10 /tmp/build.log)
          else
            echo "::error::没有 /tmp/build.log —— 说明失败发生在 make 之前（多半是同步或 lunch）"
          fi

          if [ -f /tmp/lunch.log ]; then
            echo "::error::lunch.log 结尾 10 行："
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              echo "::error::lunch(尾) | $line"
            done < <(tail -10 /tmp/lunch.log)
          fi

          echo "::error::────────────────────────────"
          echo "::error::按下面顺序排查："
          echo "::error::  1) 源码同步是否完整（看「同步」步骤的注解）"
          echo "::error::  2) device/oppo/PGGM10 是否真进了源码树"
          echo "::error::  3) prebuilt/Image 是否存在且大小合理"
          echo "::error::  4) lunch 是否成功、TARGET_DEVICE 是否为 PGGM10"
          echo "::error::  5) make 的具体报错（看上面的 build 注解）"
          echo "::error::────────────────────────────"
          echo "::error::常见原因速查："
          echo "::error::  - GitLab 不可达 → 改用 manifest_source=twrp_minimal + fox_branch=twrp-14.1"
          echo "::error::  - BOARD_PREBUILT_DTBIMAGE_DIR 与 BOARD_INCLUDE_DTB_IN_BOOTIMG 冲突 → 只能设前者当后者为 true"
          echo "::error::  - TARGET_DEVICE 不是 PGGM10 → AndroidProducts.mk 的 PRODUCT_MAKEFILES/COMMON_LUNCH_CHOICES 不对"
          echo "::error::  - vendor/fox 与 vendor/twrp 的 common.mk 都不存在 → fox_PGGM10.mk 会走内置兜底"
          echo "::error::  - 内存被 kill（OOM）→ 把 make_jobs 从 4 降到 2"
          echo "::error::  - 缺 avbtool → 装 android-sdk-libsparse-utils"
          echo "::error::  - 产物校验 FAIL → 看哪一项没过；kernel 区不一致说明 splice 用错了模板"
