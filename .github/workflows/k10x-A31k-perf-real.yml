name: "[A31k] OPPO K10x — A31e + perf 真生效（BBR 与 -O3 都实测落地）"



on:
  workflow_dispatch:
    inputs:
      enable_ksu:
        description: '是否集成 SukiSU Ultra（builtin 分支：自带 susfs v2.3.0 协议层 + KPM）。默认 true。注意：FolkPatch/APatch 也是内核级 root，与 KSU 同开会冲突，用它们取 root 读日志时请设 false'
        type: boolean
        default: true
      module_sig:
        description: '模块签名校验。off=彻底关掉（MODULE_SIG=n，module_sig_check 直接 return 0，推荐）；keep=保留校验代码但不强制（MODULE_SIG=y + FORCE=n，已验证能开机）'
        type: choice
        options:
          - 'off'
          - keep
        default: 'off'
      kernel_release_suffix:
        description: '钉死内核版本串后缀（从手机「设置→关于手机→内核版本」抄，形如 -qgki-g1a2b3c4d；留空则不钉）'
        type: string
        default: '-qgki-g6818c821e42d'
      extra_cmdline:
        description: '追加到内核命令行的参数（用 CONFIG_CMDLINE_EXTEND）。默认 loglevel=0 quiet：只留最关键的 printk，开机更快（loglevel 越大越慢；要抓完整启动日志时临时改回 loglevel=8）'
        required: false
        default: 'loglevel=0 quiet'
      config_source:
        description: '配置来源。dump = 用手机 dump 出的 k10x_defconfig（已验证可编过）；official = 源码树官方三件套 + force_builtin 覆盖（实验性）'
        required: false
        type: choice
        default: 'dump'
        options:
          - 'dump'
          - 'official'
      defconfig_source:
        description: '用哪份 defconfig：rance=优先用 Rancemxn 的 sm6375_defconfig（含 O3/BBR/FQ，校验通过就用它，这是历来的默认行为）；dump=★强制用手机 dump 的 k10x_defconfig（原厂等价配置，不含 Rancemxn 的改动）★ —— 切换它能验证「传感器起不来是不是 Rancemxn 配置里 MSM_ADSP_LOADER=m / QTI_POLICY_ENGINE_SENSOR=m 这些差异造成的」'
        type: choice
        options:
          - rance
          - dump
        default: rance
      build_dtbs:
        description: '是否编译 DTB（建议开，用于和 stock DTB 比对）'
        type: boolean
        default: false

      perf:
        description: '性能优化：off=不动；bbr=BBR + FQ/FQ_CODEL（不开 O3、不开 fast，最稳）；★bbr+fast=BBR + fast（= 你现在这版 + BBR 真正生效，不开 O3，养老推荐）★；bbr+o3=再加整内核 -O3（靠本工作流的 init/Kconfig 补丁才生效）；bbr+o3+fast=全开（O3 首次真正运行，风险自负）'
        type: choice
        options:
          - 'off'
          - bbr
          - bbr+fast
          - bbr+o3
          - bbr+o3+fast
        default: bbr+o3+fast
      keep_selinux_hide:
        description: '★必须保持 true★ 保留我们移植的「隐藏 SELinux 修改」（A9~A15 五步：backup_policydb / backup_sidtab / ksu_get_uid_t / setprocattr 整层透传等）。这是我们隐藏能力的来源，默认且必须开启；设成 false 只是为了做对比实验，正常不要动'
        type: boolean
        default: true
      ksu_manager_package:
        description: '面具包名。留空=内核自动扫描认领（推荐）。SukiSU Ultra 的 spoofed 版包名随机，要填得先用 adb 查真实包名'
        type: string
        default: ''
      ksu_version_override:
        description: '★通常留空★ 强制内核上报的 KernelSU 版本号。留空 = 跟随上游（推荐，永远用最新）。只有管理器 KPM 页选文件没反应/ANR 时才填 —— 那是内核版本号与管理器 versionCode 失配，填管理器的 versionCode 即修。查法：dumpsys package com.sukisu.ultra | grep versionCode'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build OPPO K10x Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      NTSYNC_C_B64: ""
      NTSYNC_H_B64: ""
      KERNEL_REPO: https://github.com/oppo-source/android_kernel_oppo_sm6375.git
      DRIVER_REPO: https://github.com/oppo-source/android_kernel_modules_and_devicetree_oppo_sm6375.git
      CLANG_CANDIDATES: |
        android-11.0.0_r48:clang-r383902
        android-12.0.0_r1:clang-r383902
        android-11.0.0_r40:clang-r383902
        android-11.0.0_r1:clang-r383902
        android-12.0.0_r2:clang-r383902

      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: '1'
      RANCE_DEFCONFIG_URL: https://raw.githubusercontent.com/Rancemxn/android_kernel_oppo_sm6375/main/arch/arm64/configs/sm6375_defconfig
      RANCE_DEFCONFIG_MIRROR: "https://api.github.com/repos/Rancemxn/android_kernel_oppo_sm6375/contents/arch/arm64/configs/sm6375_defconfig?ref=main"
      RANCE_DEFCONFIG_SHA256: "540f7b240a998f47"
      RANCE_DEFCONFIG_SIZE: "190483"
      SUSFS_PATCH_URL: https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/Patch/susfs_patch_to_5.4.patch
      SUSFS_PATCH_MIRROR: https://cdn.jsdelivr.net/gh/JackA1ltman/NonGKI_Kernel_Build_2nd@mainline/Patches/Patch/susfs_patch_to_5.4.patch
      SUSFS_PATCH_SHA256: 1c7aa8fcd81f2f7b
      SUSFS_PATCH_SIZE: "143563"

      INLINE_HOOKS_B64: ""

      SUKISUFIX_B64: ""

      NSFIX_B64: ""

      A3HOOKFIX_B64: ""

      KABI_B64: ""
      FSYNCFIX_B64: ""
      O3FIX_B64: ""

    steps:
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Resolve Build Inputs
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_BRANCH=oppo/sm6375_u_14.0.0_k10x_5g" >> "$GITHUB_ENV"
          DT_BRANCH="oppo/sm6375_u_14.0.0_k10x_5g"
          [ -n "$DT_BRANCH" ] || DT_BRANCH="oppo/sm6375_u_14.0.0_k10x_5g"
          echo "DT_BRANCH=$DT_BRANCH" >> "$GITHUB_ENV"
          echo "PHONE_KERNEL_RELEASE=5.4.254-qgki-g6818c821e42d" >> "$GITHUB_ENV"
          echo "内核源码分支 : oppo/sm6375_u_14.0.0_k10x_5g"
          echo "手机内核版本 : 5.4.254-qgki-g6818c821e42d"

      - name: Install Dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git gnupg gperf \
            libncurses-dev libssl-dev libxml2-utils lzop rsync schedtool \
            squashfs-tools xsltproc zip unzip zlib1g-dev python3 \
            python-is-python3 cpio device-tree-compiler libelf-dev dwarves

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ github.run_id }}
          restore-keys: |
            ccache-


      - name: Clone Official Kernel Source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 --single-branch --branch "$SOURCE_BRANCH" "$KERNEL_REPO" kernel
          if [ -n "" ]; then
            git -C kernel fetch --depth=1 origin "" \
              || git -C kernel fetch origin "$SOURCE_BRANCH"
            git -C kernel checkout --detach ""
          fi
          test -f kernel/Makefile
          echo "--- 官方原样 ---"; grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL)[[:space:]]*=' kernel/Makefile
          SRC="$(grep -E '^VERSION[[:space:]]*=' kernel/Makefile|tr -dc 0-9).$(grep -E '^PATCHLEVEL[[:space:]]*=' kernel/Makefile|tr -dc 0-9).$(grep -E '^SUBLEVEL[[:space:]]*=' kernel/Makefile|tr -dc 0-9)"
          echo "::notice title=源码版本::源码 $SRC （官方 k10x_5g 原样，未做任何 SUBLEVEL 修改）"
          [ "$SRC" = "5.4.233" ] || { echo "::error::源码不是 5.4.233（实际 $SRC），A4 的前提不成立"; exit 1; }
          git -C kernel log -1 --format='%H %s'
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL)[[:space:]]*=' kernel/Makefile

      - name: Verify Source Version Matches Phone Firmware
        shell: bash
        run: |
          set -euo pipefail
          get() { grep -E "^$1[[:space:]]*=" kernel/Makefile | head -1 | tr -dc '0-9'; }
          SRC_VER="$(get VERSION).$(get PATCHLEVEL).$(get SUBLEVEL)"
          echo "源码内核版本: $SRC_VER"

          if [ -z "${PHONE_KERNEL_RELEASE:-}" ]; then
            echo "::warning::没填 phone_kernel_release，跳过一致性检查。强烈建议填手机上的完整 uname -r"
            exit 0
          fi

          PHONE_VER=$(echo "$PHONE_KERNEL_RELEASE" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' || true)
          echo "手机内核版本: $PHONE_VER"

          if [ "$SRC_VER" != "$PHONE_VER" ]; then
            echo "::warning::源码 $SRC_VER != 手机固件 $PHONE_VER，版本不一致。"
                                                echo "  ★ A4 说明：OPPO 给 K10x 的官方分支就是 5.4.233（最后提交 2024-01-15，"
                        echo "    写着 PGGM10_14.0.0.200），而手机固件 14.0.0.920 跑的是 5.4.254。"
                        echo "    中间 21 个补丁级 OPPO 没推开源分支。"
                        echo "    A/A2/A3 的做法是把 SUBLEVEL 补成 254 去迁就 /vendor 的模块；"
                        echo "    A4 的做法是【不改源码】，改用内建 ADSP 命脉驱动的路子，"
                        echo "    所以这个 warning 在 A4 下是预期内的，不是错误。"
          else
            echo "版本一致"
          fi

      - name: Clone Official Modules and Devicetree
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 --single-branch --branch "$DT_BRANCH" "$DRIVER_REPO" devicetree
          if [ -n "" ]; then
            git -C devicetree fetch --depth=1 origin "" \
              || git -C devicetree fetch origin "$DT_BRANCH"
            git -C devicetree checkout --detach ""
          fi
          git -C devicetree log -1 --format='%H %s'
          test -d devicetree/kernel/msm-5.4/techpack
          test -d devicetree/vendor/oplus/kernel
          test -d devicetree/vendor/qcom/proprietary/devicetree

      - name: Assemble Kernel Tree
        shell: bash
        run: |
          set -euxo pipefail

          KERNEL_DIR="$GITHUB_WORKSPACE/kernel"
          DRIVER_DIR="$GITHUB_WORKSPACE/devicetree"
          BUILD_DIR="$DRIVER_DIR/kernel/msm-5.4"

          test -d "$BUILD_DIR"

          rsync -a --exclude='.git' "$KERNEL_DIR/" "$BUILD_DIR/"

          for d in qcacld-3.0 qca-wifi-host-cmn fw-api utils; do
            ln -sfn "$DRIVER_DIR/vendor/qcom/opensource/wlan/$d" "$BUILD_DIR/drivers/staging/$d"
          done
          grep -q "qcacld-3.0/Kconfig" "$BUILD_DIR/drivers/staging/Kconfig" || \
            echo "source \"drivers/staging/qcacld-3.0/Kconfig\"" >> "$BUILD_DIR/drivers/staging/Kconfig"
          grep -q "qcacld-3.0/" "$BUILD_DIR/drivers/staging/Makefile" || \
            echo "obj-$(CONFIG_QCA_CLD_WLAN) += qcacld-3.0/" >> "$BUILD_DIR/drivers/staging/Makefile"
          sed -i 's|^WLAN_ROOT := drivers/staging/qcacld-3.0|WLAN_ROOT := $(srctree)/$(src)|' \
            "$DRIVER_DIR/vendor/qcom/opensource/wlan/qcacld-3.0/Kbuild"

          sed -i 's/-Werror=/-Wno-error=/g' "$BUILD_DIR/Makefile"
          GW="$BUILD_DIR/scripts/gcc-wrapper.py"
          if [ -f "$GW" ]; then
            cp -f "$GW" "$GW.orig"
            printf '%s\n' '#!/usr/bin/env python3' 'import sys, subprocess' 'sys.exit(subprocess.call(sys.argv[1:]))' > "$GW"
            chmod +x "$GW"
            echo "gcc-wrapper.py 已换成透传（原文件存为 gcc-wrapper.py.orig）"
          else
            echo "没有 scripts/gcc-wrapper.py，跳过"
          fi
          echo "顶层 Makefile 剩余 -Werror= 行数: $(grep -c -e -Werror= "$BUILD_DIR/Makefile" || true)"

          python3 - "$BUILD_DIR/kernel/sched_assist/sched_assist_slide.c" <<'PYEOF'
          import re, sys, os
          p = sys.argv[1]
          if os.path.exists(p):
              s = open(p, encoding="utf-8", errors="replace").read()
              s2 = re.sub(r'(?m)^([A-Za-z_][A-Za-z0-9_ \t\*]*[ \t\*])([A-Za-z_][A-Za-z0-9_]*)\(\)([ \t]*)\{',
                          r'\1\2(void)\3{', s)
              if s2 != s:
                  open(p, "w", encoding="utf-8").write(s2)
                  print("已补原型:", p)
              else:
                  print("没找到旧式定义:", p)
          else:
              print("文件不存在:", p)
          PYEOF



          rm -rf "${DRIVER_DIR:?}/.git"

          for d in audio camera dataipa display video; do
            test -d "$BUILD_DIR/techpack/$d" || { echo "::error::techpack/$d 缺失"; exit 1; }
          done

          broken=0
          for l in \
            arch/arm64/boot/dts/vendor \
            drivers/power/oplus \
            drivers/soc/oplus/system \
            drivers/soc/oplus/device_info \
            drivers/soc/oplus/thermal \
            drivers/input/touchscreen/oplus_touchscreen_v2 \
            drivers/misc/oplus_rf_cable_monitor.c \
            net/oplus_modules \
            mm/healthinfo \
            mm/mm_osvelte \
            kernel/sched_assist ; do
            if [ ! -e "$BUILD_DIR/$l" ]; then
              echo "::error::软链接解析失败: $l -> $(readlink "$BUILD_DIR/$l" 2>/dev/null)"
              broken=1
            fi
          done
          [ "$broken" -eq 0 ]

          test -f "$BUILD_DIR/Makefile"
          test -f "$BUILD_DIR/scripts/config"

          # ============================================================
          # ★第 17 轮：编译前源文件完整性校验★
          # ------------------------------------------------------------
          # 背景（run #9 实测）：同一个 silead_fp_platform.c，
          #   run #7 (11:45) 编过，run #9 (12:54) 报
          #   "fatal error: 'silead_fp_comm.h' file not found"。
          #   两次的 perf 参数完全相同（bbr+o3+fast），工作流代码也没
          #   碰过 silead。唯一变量是上游两个仓库：
          #     KERNEL_REPO = oppo-source/android_kernel_oppo_sm6375
          #   都是 git clone --depth=1 --single-branch ⇒ 拿的永远是
          #   【分支最新 commit】。上游一改，这里就变。
          #
          #   ⇒ 与其等编译到一半炸（要重跑 25 分钟），不如在组装完
          #     立刻检查。缺文件就明确报出来是哪个仓库哪个 commit。
          # ============================================================
          echo "===== 源文件完整性校验 ====="
          MISSING=0
          check_file() {
            f="$1"
            if [ -f "$BUILD_DIR/$f" ]; then
              echo "  [OK] $f"
            else
              echo "  [!!] 缺失: $f"
              MISSING=$((MISSING+1))
            fi
          }
          # silead 指纹驱动（run #9 就是它炸的）
          check_file drivers/input/oplus_fp_drivers/silead/silead_fp.h
          check_file drivers/input/oplus_fp_drivers/silead/silead_fp_comm.h
          check_file drivers/input/oplus_fp_drivers/silead/silead_fp_platform.c
          echo
          echo "  --- silead 目录实际内容 ---"
          ls -la "$BUILD_DIR/drivers/input/oplus_fp_drivers/silead/" 2>/dev/null || \
            echo "  (目录不存在)"
          echo
          echo "  --- oplus_fp_drivers 下所有 .h ---"
          find "$BUILD_DIR/drivers/input/oplus_fp_drivers" -name '*.h' 2>/dev/null | \
            sed "s|$BUILD_DIR/||" | sort | head -40
          echo
          # ------------------------------------------------------------
          # ★silead_fp_comm.h 缺失 = 上游老毛病，用平台宏绕过★
          # ------------------------------------------------------------
          # silead_fp.h 第 203-240 行的平台分支：
          #   #ifdef  BSP_SIL_PLAT_MTK          -> silead_fp_mtk.h
          #   #elif defined(BSP_SIL_PLAT_SPRD)  -> silead_fp_sprd.h
          #   #else                             -> silead_fp_comm.h   <- 文件不存在
          #
          # silead/Makefile 用 make 的 ifdef 算 -DBSP_SIL_PLAT_QCOM：
          #   ifdef CONFIG_ARCH_MSM
          #       ccflags-y += -DBSP_SIL_PLAT_QCOM
          #   ifdef CONFIG_ARCH_QCOM
          #       ccflags-y += -DBSP_SIL_PLAT_QCOM
          # 但 make 的 ifdef 看的是【make 变量】，.config 里的 CONFIG_* 要等
          # include/config/auto.conf 才成为 make 变量。drivers/input/... 解析
          # 早，ifdef 常取不到 => 宏没定义 => 落 #else => 炸。
          #
          # 修法：直接往 Makefile 显式加 -DBSP_SIL_PLAT_QCOM，绕过 ifdef。
          # K10x 是 SM6375（高通），本来就该走 QCOM 分支，这个宏是正确的。
          # ------------------------------------------------------------
          SIL_DIR="$BUILD_DIR/drivers/input/oplus_fp_drivers/silead"
          SIL_MK="$SIL_DIR/Makefile"
          if [ -f "$SIL_MK" ]; then
            if grep -q 'FORCE_PLAT_QCOM_A31K' "$SIL_MK"; then
              echo "  [--] silead/Makefile 已注入过，跳过"
            else
              SIL_TMP="$SIL_MK.a31k.tmp"
              {
                printf '%s\n' '# FORCE_PLAT_QCOM_A31K: 强制平台宏（见工作流第 17 轮）'
                printf '%s\n' 'ccflags-y += -DBSP_SIL_PLAT_QCOM'
                printf '%s\n' 'ccflags-y += -DBSP_SIL_POWER_SUPPLY_REGULATOR'
                printf '%s\n' 'subdir-ccflags-y += -DBSP_SIL_PLAT_QCOM'
                cat "$SIL_MK"
              } > "$SIL_TMP"
              mv -f "$SIL_TMP" "$SIL_MK"
              echo "  已注入 -DBSP_SIL_PLAT_QCOM"
            fi
            echo "  --- silead/Makefile 前 8 行 ---"
            head -8 "$SIL_MK" | sed 's/^/    /'
            grep -q 'BSP_SIL_PLAT_QCOM' "$SIL_MK" \
              || { echo "::error title=指纹驱动::silead/Makefile 里没有 BSP_SIL_PLAT_QCOM"; exit 1; }
            echo "  [OK] silead 平台宏已强制"
          else
            echo "  [--] 没有 $SIL_MK（这个 defconfig 可能不含 silead）"
          fi
          echo

          if [ "$MISSING" -gt 0 ]; then
            echo "::warning title=源码提示::$MISSING 个文件缺失（silead_fp_comm.h 已用平台宏绕过）"
          fi
          echo "  ✓ 关键源文件检查完成"
          echo

          # ============================================================
          # ★第 19 轮：上游兼容补丁（一次性修 3 处）★
          # ------------------------------------------------------------
          # 现象：同一批源文件 run#7 能编，run#11 编不过。原因不是工作流，
          #       而是 KERNEL_REPO/DRIVER_REPO 都用 --depth=1，拿的永远是
          #       分支最新 commit，上游一改就变（run#7 与 run#11 相隔 1h43m）。
          #
          # 补丁 1：drivers/input/.../silead/Makefile —— 已在上面注入
          #         -DBSP_SIL_PLAT_QCOM（让 silead_fp.h 走 QCOM 分支）
          #
          # 补丁 2：FB_EARLY_EVENT_BLANK —— v5.4 的 include/linux/fb.h 只有
          #         FB_EVENT_BLANK=0x09，没有 FB_EARLY_EVENT_BLANK。
          #         上游 Android 内核加了 0x10/0x11。black_screen_check.c
          #         第 308 行用到它。补上定义即可（值跟 Android 一致）。
          #
          # 补丁 3：SCMI memlat —— drivers/soc/qcom/memlat_scmi.c 和
          #         rimps_memlat.c 用到 struct scmi_handle.memlat_ops 和
          #         SCMI_PROTOCOL_MEMLAT，本仓库的 scmi_protocol.h 没有这些。
          #         这两处属于「新 SCMI 框架」，本内核没同步，直接跳过编译。
          # ============================================================
          echo "===== 上游兼容补丁 ====="

          FBH="$BUILD_DIR/include/linux/fb.h"
          if [ -f "$FBH" ]; then
            if grep -q 'FB_EARLY_EVENT_BLANK' "$FBH"; then
              echo "  [--] fb.h 已有 FB_EARLY_EVENT_BLANK"
            else
              FBH_TMP="$FBH.a31k.tmp"
              {
                printf '%s\n' ''
                printf '%s\n' '/* A31k: Android 补的 FB 事件号，v5.4 主线没有 */'
                printf '%s\n' '#ifndef FB_EARLY_EVENT_BLANK'
                printf '%s\n' '#define FB_EARLY_EVENT_BLANK    0x10'
                printf '%s\n' '#endif'
                printf '%s\n' '#ifndef FB_R_EARLY_EVENT_BLANK'
                printf '%s\n' '#define FB_R_EARLY_EVENT_BLANK  0x11'
                printf '%s\n' '#endif'
                cat "$FBH"
              } > "$FBH_TMP"
              mv -f "$FBH_TMP" "$FBH"
              echo "  [OK] fb.h 已补 FB_EARLY_EVENT_BLANK=0x10"
            fi
            grep -q 'FB_EARLY_EVENT_BLANK' "$FBH" \
              || { echo "::error title=兼容补丁::fb.h 补丁失败"; exit 1; }
          else
            echo "  [--] 没有 $FBH"
          fi

          # ------------------------------------------------------------
          # memlat：本内核 include/linux/scmi_protocol.h 没有
          #   struct scmi_handle.memlat_ops / struct scmi_memlat_vendor_ops
          #   / SCMI_PROTOCOL_MEMLAT
          # 但 memlat_scmi.c 和 rimps_memlat.c 用到它们 => 编译必炸。
          #
          # ★第 20 轮修正★ 上次 sed 只匹配一行，漏了：
          #   obj-$(CONFIG_QTI_HW_MEMLAT) += rimps_memlat.o
          # 这次用 awk 通用处理：这批 Makefile 里任何引用这两个 .o 的行
          # 只要不是注释，就整行注释掉。并做硬校验。
          # ------------------------------------------------------------
          for mf in \
              "$BUILD_DIR/drivers/soc/qcom/Makefile" \
              "$BUILD_DIR/drivers/soc/qcom/scmi/Makefile" ; do
            [ -f "$mf" ] || continue
            if grep -qE '(memlat_scmi|rimps_memlat)\.o' "$mf"; then
              [ -f "$mf.a31k.orig" ] || cp -f "$mf" "$mf.a31k.orig"
              awk '
                /(memlat_scmi|rimps_memlat)\.o/ && $0 !~ /^[[:space:]]*#/ {
                  print "# A31k skip (no new SCMI framework): " $0; next
                }
                { print }
              ' "$mf" > "$mf.a31k.tmp"
              mv -f "$mf.a31k.tmp" "$mf"
              echo "  [OK] 已处理 $mf"
              echo "  --- 该文件里所有 memlat 行 ---"
              grep -n 'memlat' "$mf" | sed 's/^/    /'
            fi
          done

          # 硬校验：不能有【生效的】memlat .o 引用
          ML_LEFT=0
          for mf in "$BUILD_DIR/drivers/soc/qcom/Makefile" "$BUILD_DIR/drivers/soc/qcom/scmi/Makefile"; do
            [ -f "$mf" ] || continue
            # 注意：set -e 下 grep 无匹配返回 1，会【反向】把「已修好」判成失败
            # （run#13 正是这么挂的：n=0 之后立刻 exit 1）。必须 || true 兜住。
            n=$( { grep -E '(memlat_scmi|rimps_memlat)\.o' "$mf" || true; } | { grep -vc '^[[:space:]]*#' || true; } )
            [ -n "$n" ] || n=0
            ML_LEFT=$((ML_LEFT+n))
          done
          if [ "$ML_LEFT" -gt 0 ]; then
            echo "::error title=兼容补丁::还有 $ML_LEFT 行 memlat .o 没注释掉"
            for mf in "$BUILD_DIR/drivers/soc/qcom/Makefile" "$BUILD_DIR/drivers/soc/qcom/scmi/Makefile"; do
              [ -f "$mf" ] && grep -nE '(memlat_scmi|rimps_memlat)\.o' "$mf" | sed 's/^/    /'
            done
            exit 1
          fi
          echo "  [OK] 校验通过：没有生效的 memlat .o 引用了"
          echo "  ✓ 上游兼容补丁完成"
          echo

          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"
          echo "===== 组装完成 ====="
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL)[[:space:]]*=' "$BUILD_DIR/Makefile"

      - name: 驱动基线：20 个 OPPO 驱动全部内建（A26/A27 行为）
        if: ${{ inputs.enable_ksu }}
        shell: bash
        run: |
          set -euxo pipefail
          cd "$BUILD_DIR"


          echo "===== ① techpack 全部保持 =m（一个字都不改）====="
          TOT=0
          for f in techpack/audio/config/*.conf techpack/camera/config/*.conf \
                   techpack/dataipa/config/*.conf techpack/display/config/*.conf \
                   techpack/video/config/*.conf ; do
            [ -f "$f" ] || continue
            M=$(grep -cE '^[[:space:]]*export CONFIG_[A-Z0-9_]+=m[[:space:]]*$' "$f" || true)
            TOT=$((TOT+M))
          done
          echo "  techpack 全树 $TOT 个 export CONFIG_x=m —— 全部保持模块化，不内建"
          [ "$TOT" -gt 100 ] || { echo "::error::techpack 的 =m 只有 $TOT 个，conf 路径不对"; exit 1; }

          echo "===== ② 关键命脉抽查（必须是 =m，才轮得到原厂 .ko）====="
          for s in MSM_ADSP_LOADER MSM_QDSP6V2_CODECS MSM_QDSP6_APRV2_RPMSG MSM_QDSP6_SSR \
                   MSM_QDSP6_PDR MSM_QDSP6_NOTIFIER SND_SOC_MSM_QDSP6V2_INTF SND_SOC_QDSP6V2 \
                   SND_EVENT SOUNDWIRE SND_SOC_HOLI SND_SOC_BOLERO SND_SOC_WCD937X SND_SOC_MSM_STUB; do
            if grep -qE "^[[:space:]]*export CONFIG_${s}=m[[:space:]]*$" techpack/audio/config/holiauto.conf; then
              echo "  OK $s =m"
            else
              echo "  ::warning::$s 不是 =m"
            fi
          done

          echo "===== ③ 源码树检查 ====="
          test -d techpack/audio/dsp || { echo "::error::techpack/audio/dsp 不存在"; exit 1; }
          test -d techpack/audio/soc || { echo "::error::techpack/audio/soc 不存在"; exit 1; }
          test -d techpack/audio/ipc || { echo "::error::techpack/audio/ipc 不存在"; exit 1; }
          echo "  OK techpack/audio dsp/soc/ipc 都在"
          echo "::notice title=原厂模块路线(A6e)::techpack 全部保持 =m（不内建）；靠 kernel/module.c 的 same_magic 补丁让原厂 5.4.254 的 .ko 能加载"
      - name: 修复内建驱动的符号冲突（wcd938x 与 wcd937x 重名）
        if: ${{ inputs.enable_ksu }}
        shell: bash
        run: |
          set -euxo pipefail
          cd "$BUILD_DIR"


          F=techpack/audio/asoc/codecs/wcd938x/wcd938x.c
          test -f "$F" || { echo "::error::找不到 $F"; exit 1; }
          PAT='^const (char \* const|struct soc_enum|u8) (tx_master_ch_text|tx_master_ch_enum|die_crk_det_en_text|det_en|die_crk_det_int1_text|det_int1|die_crk_det_out_text)'
          SPAT='^static const (char \* const|struct soc_enum|u8) (tx_master_ch_text|tx_master_ch_enum|die_crk_det_en_text|det_en|die_crk_det_int1_text|det_int1|die_crk_det_out_text)'

          echo "===== 改之前 ====="
          grep -nE "$PAT" "$F" | sed 's/^/  /' || true

          sed -i -E "s/$PAT/static const \1 \2/" "$F"

          echo "===== 改之后 ====="
          grep -nE "$SPAT" "$F" | sed 's/^/  /' || true
          N=$(grep -cE "$SPAT" "$F" || true)
          [ "$N" -eq 7 ] || { echo "::error::期望 7 个符号变 static，实际 $N 个"; exit 1; }

          G=$(grep -cE "$PAT" techpack/audio/asoc/codecs/wcd937x/wcd937x.c || true)
          [ "$G" -eq 7 ] || { echo "::error::wcd937x.c 应保持 7 个全局定义，实际 $G 个（被误改了？）"; exit 1; }
          echo "  OK wcd937x.c 保持 7 个全局定义（作兜底），wcd938x.c 7 个已 static"

          echo "::notice title=内建符号冲突修复::wcd938x.c 的 7 个重名全局变量已加 static；wcd937x.c 保持原样作兜底"

      - name: Clone Clang r383902 (11.0.2)
        shell: bash
        run: |
          set -euxo pipefail
          TOOLCHAIN_DIR="$GITHUB_WORKSPACE/toolchains"
          mkdir -p "$TOOLCHAIN_DIR"
          CLANG_DIR=""
          while IFS=: read -r BR DIR; do
            [ -z "$BR" ] && continue
            echo "----- 尝试 $BR / $DIR -----"
            rm -rf "$TOOLCHAIN_DIR/clang-repo"
            if git clone --depth=1 --filter=blob:none --sparse \
                 --branch "$BR" \
                 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86.git \
                 "$TOOLCHAIN_DIR/clang-repo" 2>&1 | tail -3; then
              if git -C "$TOOLCHAIN_DIR/clang-repo" sparse-checkout set "$DIR" 2>&1 \
                 && [ -x "$TOOLCHAIN_DIR/clang-repo/$DIR/bin/clang" ]; then
                CLANG_DIR="$TOOLCHAIN_DIR/clang-repo/$DIR"
                echo "✓ 用上了 $BR / $DIR"
                break
              fi
            fi
            echo "✗ $BR 里没有 $DIR，换下一个"
          done <<< "$CLANG_CANDIDATES"

          test -n "$CLANG_DIR" || { echo "::error::所有候选 clang 分支都没有 clang-r383902"; exit 1; }
          test -x "$CLANG_DIR/bin/clang"
          test -x "$CLANG_DIR/bin/ld.lld"
          "$CLANG_DIR/bin/clang" --version
          CLANGVER="$("$CLANG_DIR/bin/clang" --version 2>&1 | head -4)"
          echo "::notice title=clang 真实版本::$CLANGVER"
          echo "$CLANGVER" | grep -qE 'clang version 11\.0\.2' \
            && echo "::notice title=clang 版本检查::✓ 就是 11.0.2" \
            || echo "::warning title=clang 版本检查::✗ 不是 11.0.2（见上一条注解）"
          echo "CLANG_DIR=$CLANG_DIR" >> "$GITHUB_ENV"
          echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"

      - name: Clone GCC 9.3 (aarch64) + GCC 4.9 (arm32)
        shell: bash
        run: |
          set -euxo pipefail
          T="$GITHUB_WORKSPACE/toolchains"
          mkdir -p "$T"
          git clone --depth=1 --single-branch \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-9.3.git \
            "$T/gcc93"
          git clone --depth=1 --single-branch --branch android-8.1.0_r68 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git \
            "$T/gcc32"
          test -x "$T/gcc93/bin/aarch64-buildroot-linux-gnu-gcc"
          test -x "$T/gcc32/bin/arm-linux-androideabi-gcc"

      - name: Integrate SukiSU Ultra (builtin)
        shell: bash
        if: ${{ inputs.enable_ksu }}
        run: |
          set -euxo pipefail
          cd "$BUILD_DIR"

          rm -rf KernelSU
          git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
          cd KernelSU
          git checkout builtin
          echo "===== SukiSU Ultra ====="
          echo "HEAD     = $(git rev-parse HEAD)"
          echo "分支     = $(git rev-parse --abbrev-ref HEAD)"
          echo "提交数   = $(git rev-list --count HEAD)"
          echo "最近提交 = $(git log -1 --format='%ci %s')"

          git rev-parse --verify --quiet main >/dev/null \
            || { echo "::error::本地没有 main 分支，KSU_VERSION 会退化成 13000，面具会拒绝"; exit 1; }
          MAINCNT="$(git rev-list --count main)"
          echo "main 分支提交数 = $MAINCNT（版本号兜底 = $((40000 + MAINCNT - 2815))）"
          [ "$MAINCNT" -gt 1000 ] || { echo "::error::main 分支提交数只有 $MAINCNT，不像完整克隆"; exit 1; }

          test -d kernel/kpm || { echo "::error::builtin 分支里没有 kernel/kpm，KPM 会丢"; exit 1; }
          grep -q '^config KPM' kernel/Kconfig || { echo "::error::Kconfig 里没有 config KPM"; exit 1; }
          echo "KPM 源码: $(ls kernel/kpm/ | tr '\n' ' ')"

          N=$(grep -c 'SUSFS' kernel/supercall/dispatch.c || true)
          [ "$N" -ge 20 ] || { echo "::error::dispatch.c 里 susfs 只有 $N 处，这不是 builtin 分支"; exit 1; }
          grep -q 'SUSFS_MAGIC' kernel/supercall/dispatch.c || { echo "::error::dispatch.c 里没有 SUSFS_MAGIC"; exit 1; }
          echo "dispatch.c 的 susfs 协议: $N 处"

          for sym in ksu_handle_faccessat ksu_handle_stat; do
            grep -qE "int ${sym}\(int \*dfd, struct filename \*\*" kernel/feature/sucompat.h || {
              echo "::error::${sym} 不是 v2.3.0 的 struct filename ** 签名，和 susfs v2.3.0 对不上"
              grep -n "$sym" kernel/feature/sucompat.h || true
              exit 1
            }
          done
          grep -qE 'int ksu_handle_sys_reboot\(int magic1, int magic2, unsigned int cmd, void __user \*\*arg\)' \
            kernel/supercall/supercall.c || { echo "::error::ksu_handle_sys_reboot 签名不对"; exit 1; }
          grep -qE 'int ksu_handle_sys_read\(unsigned int fd, char __user \*\*buf_ptr, size_t \*count_ptr\)' \
            kernel/runtime/ksud.c || { echo "::error::ksu_handle_sys_read 签名不对"; exit 1; }
          echo "✓ ksu_handle_* 签名与 susfs v2.3.0 一致"

          for k in KSU_SUSFS KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT KSU_SUSFS_SUS_KSTAT \
                   KSU_SUSFS_SUS_MAP KSU_SUSFS_OPEN_REDIRECT KSU_SUSFS_SPOOF_UNAME \
                   KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
                   KSU_SUSFS_ENABLE_LOG; do
            grep -q "^config ${k}$" kernel/Kconfig || { echo "::error::Kconfig 里没有 config ${k}"; exit 1; }
          done
          echo "✓ susfs 的 10 个开关都在 Kconfig 里"
          if grep -q 'THREAD_INFO_IN_TASK' kernel/Kconfig; then
            echo "· KSU_SUSFS 依赖 THREAD_INFO_IN_TASK，第 19 步会显式打开"
          fi

          # ★★★ K10x：把 UAPI 版本对齐到面具的 5（这条是消掉「需要更新内核」的关键）★★★
          #   面具是 main 分支编的：Natives.managerUAPIVersion = 5
          #   我们内核是 builtin 分支：KERNEL_SU_UAPI_VERSION = 2
          #   于是 HomeViewModel.kt:75
          #   里 5 > 2 恒成立 → 首页那张「需要更新内核」警告卡一直在，
          #   换任何面具版本、任何签名、改任何 KSU_VERSION 都没用。
          #   而且 Natives.kt:155 isFullFeatured() 要求两个 UAPI 相等，
          #   不相等时 BottomBarMaterial 里 `if (!fullFeatured) return` → 底栏导航直接不画。
          #
          #   为什么改这一行是安全的：我把两个分支的 include/uapi/supercall.h 逐行比过，
          #   除了 ①版本号 ②KSU_GET_INFO_FLAG_BUNDLED 标志位 ③104/105 两个新 ioctl
          #   （KSU_IOCTL_SET_SPOOF_VERSION / SET_SPOOF_CPU，"伪装内核版本/CPU"用），
          #   其余所有 ioctl 编号与结构体完全一致。我们缺的只有那 2 个新 ioctl，
          #   面具真去点"伪装内核版本"时会返回 -ENOTTY，别的不受影响。
          UAPI_H=kernel/include/uapi/supercall.h
          test -f "$UAPI_H" || { echo "::error::找不到 $UAPI_H"; exit 1; }
          grep -q 'NEW_GET_ALLOW_LIST' "$UAPI_H" || { echo "::error::$UAPI_H 不像预期"; exit 1; }
          echo "  UAPI 改前: $(grep -n 'KERNEL_SU_UAPI_VERSION' "$UAPI_H" | head -1)"
          sed -i 's/KERNEL_SU_UAPI_VERSION, 2)/KERNEL_SU_UAPI_VERSION, 5)/' "$UAPI_H"
          if ! grep -q 'KERNEL_SU_UAPI_VERSION, 5)' "$UAPI_H"; then
            echo "::error::UAPI 版本没改成 5，实际是："
            grep -n 'KERNEL_SU_UAPI_VERSION' "$UAPI_H" || true
            exit 1
          fi
          CNUM=$(grep -cE 'KERNEL_SU_UAPI_VERSION, [0-9]+\);' "$UAPI_H" || true)
          if [ "$CNUM" != "1" ]; then
            echo "::error::supercall.h 里 KERNEL_SU_UAPI_VERSION 的定义有 $CNUM 处（应为 1）"
            grep -n 'KERNEL_SU_UAPI_VERSION' "$UAPI_H" || true
            exit 1
          fi
          grep -qE 'KERNEL_SU_UAPI_VERSION, 5\);' "$UAPI_H" \
            || { echo "::error::UAPI 版本不是 5"; grep -n 'KERNEL_SU_UAPI_VERSION' "$UAPI_H"; exit 1; }
          echo "  UAPI 改后: $(grep -n 'KERNEL_SU_UAPI_VERSION' "$UAPI_H" | head -1)"
          echo "  ✓ UAPI 已对齐为 5（面具侧的期望值）"

          # ================================================================
          # ★上游兼容补丁★ TRACK_THRONE_FORCE_SYNCHRONOUS
          # ----------------------------------------------------------------
          # 症状（A31k #5 run 38550611497 实测）：
          #   ../drivers/kernelsu/manager/pkg_observer.c:22:18:
          # 原因：上游 commit c89592068e 把 track_throne(false) 换成延迟执行，
          #   新函数里写了 track_throne(TRACK_THRONE_FORCE_SYNCHRONOUS)，
          #   但该宏是别的分支才有的，builtin 分支没定义它 ⇒ 上游自己编挂了。
          # 修法：在 include 行后插入兜底定义（旧版传的就是 false，语义一致）。
          #
          # ★路径注意★ 内核树里 drivers/kernelsu 是软链 ->
          #   $BUILD_DIR/KernelSU/kernel （由后面的步骤建立）。
          #   所以真身是 $BUILD_DIR/KernelSU/kernel/manager/pkg_observer.c。
          #   两个路径都试，谁存在用谁；顺便把软链提前建好以免后面依赖顺序。
          # ================================================================
          POB=""
          for cand in \
            "$BUILD_DIR/KernelSU/kernel/manager/pkg_observer.c" \
            "$BUILD_DIR/drivers/kernelsu/manager/pkg_observer.c" \
            "$BUILD_DIR/KernelSU/kernel/manager/pkg_observer.c" ; do
            if [ -f "$cand" ]; then POB="$cand"; break; fi
          done
          if [ -z "$POB" ]; then
            POB="$(find "$BUILD_DIR" -path '*kernelsu*' -name 'pkg_observer.c' 2>/dev/null | head -1)"
          fi
          if [ -z "$POB" ] || [ ! -f "$POB" ]; then
            echo "::error::找不到 pkg_observer.c"
            find "$BUILD_DIR" -name 'pkg_observer*' 2>/dev/null | head
            ls -la "$BUILD_DIR/KernelSU" 2>/dev/null | head
            exit 1
          fi
          echo "  pkg_observer.c = $POB"
          if grep -q 'define *TRACK_THRONE_FORCE_SYNCHRONOUS' "$POB"; then
            echo "  (上游已自己定义，无需补丁)"
          elif ! grep -q 'TRACK_THRONE_FORCE_SYNCHRONOUS' "$POB"; then
            echo "  (上游没用这个宏，无需补丁)"
          else
            echo "  ★上游用了 TRACK_THRONE_FORCE_SYNCHRONOUS 但没定义 ⇒ 打兜底补丁★"
            MARK='#include "pkg_observer_compat.h"'
            LN=$(grep -n -F "$MARK" "$POB" | head -1 | cut -d: -f1)
            [ -n "$LN" ] || LN=1
            echo "    锚点在第 $LN 行"
            {
              head -n "$LN" "$POB"
              printf '\n'
              printf '// LOCAL FALLBACK: upstream c89592068e uses this macro; builtin lacks it.\n'
              printf '// Old code was track_throne(false); identical semantics.\n'
              printf '#ifndef TRACK_THRONE_FORCE_SYNCHRONOUS\n'
              printf '#define TRACK_THRONE_FORCE_SYNCHRONOUS false\n'
              printf '#endif\n'
              tail -n +$((LN + 1)) "$POB"
            } > "$POB.tmp"
            mv -f "$POB.tmp" "$POB"
            echo "    --- 插入结果 ---"
            grep -n -B2 -A6 'define TRACK_THRONE_FORCE_SYNCHRONOUS' "$POB" | head -14
          fi
          grep -q 'define *TRACK_THRONE_FORCE_SYNCHRONOUS' "$POB" \
            || { echo "::error::兜底宏最终不存在，编译仍会失败"; grep -n 'TRACK_THRONE' "$POB" | head; exit 1; }
          echo "  ✓ TRACK_THRONE_FORCE_SYNCHRONOUS 兜底已就绪"

          # KSU_VERSION 本身不动（保持上游 VERSION_BASE=40000，现在算出来 40971）。
          if [ -f kernel/Makefile ]; then
            grep -q '^VERSION_BASE' kernel/Makefile || { echo "::error::找不到 VERSION_BASE"; exit 1; }
            echo "  VERSION_BASE 保持上游原值: $(grep -n '^VERSION_BASE' kernel/Makefile | head -1)"
          else
            echo "::error::找不到 KernelSU/kernel/Makefile"; exit 1
          fi

          echo "$SUKISUFIX_B64" | base64 -d > /tmp/sukisu_ultra_fixed.patch

          cd kernel
          patch -p1 -f < /tmp/sukisu_ultra_fixed.patch || true

          OTHERS=$(find . -name '*.rej' | grep -v '^\./runtime/ksud\.c\.rej$' || true)
          if [ -n "$OTHERS" ]; then
            echo "::error::sukisu_ultra_fixed.patch 出现了预期之外的 reject："
            echo "$OTHERS"
            for f in $OTHERS; do echo "--- $f ---"; head -40 "$f"; done
            exit 1
          fi
          if [ -f runtime/ksud.c.rej ]; then
            grep -q 'ksu_selinux_hide_handle_post_fs_data' runtime/ksud.c.rej \
              || { echo "::error::runtime/ksud.c.rej 内容不是预期的那一行，请人工检查"; cat runtime/ksud.c.rej; exit 1; }
            echo "  · runtime/ksud.c.rej 正是预期的那一行，改用 sed 确定性删除"
          fi

          sed -i '/^[[:space:]]*ksu_selinux_hide_handle_post_fs_data();[[:space:]]*$/d' runtime/ksud.c
          sed -i '/^[[:space:]]*ksu_selinux_hide_handle_second_stage();[[:space:]]*$/d' runtime/ksud.c
          find . -name '*.rej' -delete
          find . -name '*.orig' -delete || true

          if grep -q 'ksu_selinux_hide_handle_post_fs_data\|ksu_selinux_hide_handle_second_stage' runtime/ksud.c; then
            echo "::error::runtime/ksud.c 里仍有 selinux_hide 手工钩子调用，会与 susfs 的 selinux 处理打架"
            grep -n 'ksu_selinux_hide_handle' runtime/ksud.c
            exit 1
          fi
          [ -z "$(find . -name '*.rej')" ] || { echo "::error::仍有 .rej 残留"; find . -name '*.rej'; exit 1; }

          # ★ K10x: builtin 分支的 ksu_hooks[] 在本配置下是空的 ——
          #   而我们恰好开了 CONFIG_KSU_SUSFS=y。空 hook 表 -> ksu_install_fd() 永不被调用
          #   -> 管理器连不上内核 -> SukiSU Ultra 显示「不支持」。
          #   把它强制编进去：它自己就能调 ksu_install_fd()，不依赖 susfs_zygote_sid。
          LH="hook/lsm_hook.c"
          test -f "$LH" || { echo "::error::找不到 $LH"; exit 1; }
          echo "  改前 ksu_hooks 条目："
          grep -n -B2 -A8 'static struct security_hook_list ksu_hooks' "$LH" || true
          # 两处都要改：
          #   #ifdef CONFIG_KSU_SUSFS  (第19行) 把 ksu_task_fix_setuid 也编出来
          #   #ifndef CONFIG_KSU_SUSFS (第183行) 把它注册进 ksu_hooks[]
          # 只改一处会引用到不存在的函数 -> 编译失败。
          # 结构是这样的（202 行）：
          #   176: #endif
          #   185: #endif
          #
          # ★ 关键：不能只把 19 行改成 #if 1 —— 那样 149 行的 #else 分支就不编译了，
          #   第 184 行的注册语句会引用到不存在的 ksu_task_fix_setuid（已实测编译失败）。
          #   正确做法是三处：让 #ifdef 段和 #else 段都编译。
          python3 - "$LH" <<'PYFIX'
          import io,re,sys
          p=sys.argv[1]
          lines=io.open(p,encoding="utf-8",errors="surrogateescape").read().split("\n")

          # ① 19 行附近那个 #ifdef CONFIG_KSU_SUSFS -> #if 1
          n1=0
          for i,l in enumerate(lines):
              if l.strip()=="#ifdef CONFIG_KSU_SUSFS":
                  lines[i]="#if 1 /* K10x: susfs 这一大段照常编译 */"
                  n1+=1
          # ② 把「#else 后面紧跟 ksu_task_fix_setuid 定义」的那个 #else 换成 #endif + #if 1
          n2=0
          for i,l in enumerate(lines):
              if l.strip()!="#else":
                  continue
              # 往后 6 行内找 ksu_task_fix_setuid
              nxt="\n".join(lines[i+1:i+7])
              if "ksu_task_fix_setuid" in nxt:
                  lines[i]="#endif /* K10x: 结束 susfs 段 */\n#if 1 /* K10x: 单独把 task_fix_setuid 也编出来 */"
                  n2+=1
          # ③ 183 行那个 #ifndef CONFIG_KSU_SUSFS -> #if 1
          n3=0
          for i,l in enumerate(lines):
              if l.strip()=="#ifndef CONFIG_KSU_SUSFS":
                  lines[i]="#if 1 /* K10x: 让 task_fix_setuid 注册进 ksu_hooks，避免空表 -> 管理器显示不支持 */"
                  n3+=1
          if (n1,n2,n3)!=(1,1,1):
              print(f"::error::lsm_hook.c 三处补丁命中数不对: ifdef={n1} else={n2} ifndef={n3}（都应为 1）")
              sys.exit(1)
          io.open(p,"w",encoding="utf-8",errors="surrogateescape").write("\n".join(lines))
          print(f"  OK lsm_hook.c 三处已改: ifdef={n1} else={n2} ifndef={n3}")
          PYFIX

          grep -q '^#ifdef CONFIG_KSU_SUSFS$' "$LH" && { echo "::error::#ifdef CONFIG_KSU_SUSFS 还在"; exit 1; }
          grep -q '^#ifndef CONFIG_KSU_SUSFS$' "$LH" && { echo "::error::#ifndef CONFIG_KSU_SUSFS 还在"; exit 1; }
          # ★ 编译可行性自检：这两样必须同时存在
          grep -qE '^static int ksu_task_fix_setuid' "$LH" || { echo "::error::ksu_task_fix_setuid 定义不在"; exit 1; }
          grep -q 'LSM_HOOK_INIT(task_fix_setuid, ksu_task_fix_setuid)' "$LH" || { echo "::error::注册语句不在"; exit 1; }
          # 数一遍 ksu_hooks[] 里有几条 LSM_HOOK_INIT（必须 >=1，不能是空表）
          NH=$(awk '/static struct security_hook_list ksu_hooks/,/^};/' "$LH" | grep -c 'LSM_HOOK_INIT' || true)
          echo "  ksu_hooks[] 里的钩子数: $NH（必须 >=1）"
          [ "$NH" -ge 1 ] || { echo "::error::ksu_hooks[] 还是空表"; exit 1; }
          echo "  OK lsm_hook.c 三处补丁齐全，ksu_hooks[] 非空"
          echo "  改后 ksu_hooks 条目："
          grep -n -A8 'static struct security_hook_list ksu_hooks' "$LH" || true
          echo "  OK task_fix_setuid 钩子已强制编入（ksu_hooks 不再为空）"
          grep -q '__maybe_static' feature/selinux_hide.c \
            || { echo "::error::feature/selinux_hide.c 的 __maybe_static 没打上"; exit 1; }
          grep -q '__has_attribute' infra/kernel_compat.h \
            || { echo "::error::infra/kernel_compat.h 的 fallthrough 兜底没打上"; exit 1; }
          grep -q 'kernel_compat.h' policy/allowlist.c \
            || { echo "::error::policy/allowlist.c 没补 include"; exit 1; }
          grep -q 'ksu_strncpy_from_user_nofault' sulog/event.c \
            || { echo "::error::sulog/event.c 的 nofault 改名没打上"; exit 1; }
          echo "✓ 旧编译器兼容补丁已应用，5 项意图全部落实，0 个 reject"

          cd "$BUILD_DIR"
          rm -rf drivers/kernelsu
          ln -sfn ../KernelSU/kernel drivers/kernelsu
          test -d drivers/kernelsu || { echo "::error::drivers/kernelsu 软链没建好"; exit 1; }
          grep -q 'kernelsu' drivers/Makefile || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || \
            sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          echo "drivers/kernelsu -> $(readlink drivers/kernelsu)"
          grep -n 'kernelsu' drivers/Makefile || true
          grep -n 'kernelsu' drivers/Kconfig || true
          echo "::notice title=面具::SukiSU Ultra (builtin) $(git -C KernelSU rev-parse --short HEAD) 已就位，自带 susfs 协议层 + KPM"

      - name: SELinux hide 移植（搬 ReSukiSU 的非 GKI 实现，第 1 轮）
        if: ${{ inputs.enable_ksu && inputs.keep_selinux_hide }}
        continue-on-error: true
        run: |
          set -euxo pipefail

          # ================= 为什么搬 ReSukiSU =================
          # SukiSU builtin 的 feature/selinux_hide.c 只有 24KB，整套机制被
          #   #if LINUX_VERSION_CODE >= KERNEL_VERSION(5,10,0) 挡住；它依赖的
          #   在 5.4 里都不存在（5.4 是 selinux_state.ss->policydb / sidtab）。
          # upstream KernelSU 的 40KB 版本同样只用 5.10+ 结构（它整个 kernel/ 里
          #   KERNEL_VERSION(5,10,0) 出现 0 次，说明早已只服务 GKI 2.0）。
          # 只有 ReSukiSU(BakaSU) 的 65KB 版本写了完整 <5.10 分支：24 处版本分支、
          #   12 处用 selinux_state.ss、status_lock 用运行时解析的 ksu_selinux_status_lock
          #   指针顶替，还自带 tools/kernel_compat.mk 自动探测。
          # 所以这里做的是「把那份实现和它的基建搬进来」，不是从零写。
          RS_SHA=f6cb7e70c10ebde149f3121ae68b945514fd0801
          RS_RAW="https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/$RS_SHA/kernel"

          KROOT="$BUILD_DIR/KernelSU/kernel"
          test -d "$KROOT" || { echo "::error title=SELinux hide::找不到 $KROOT"; exit 1; }
          cd "$KROOT"
          mkdir -p compat infra hook/arm64 tools

          fetch() {
            curl -fsSL --retry 3 -o "$1" "$RS_RAW/$2" || { echo "::error title=下载失败::$2"; exit 1; }
            test -s "$1" || { echo "::error title=下载为空::$2"; exit 1; }
            grep -q "$3" "$1" || { echo "::error title=文件内容不对($2)::没找到关键字 $3"; head -5 "$1"; exit 1; }
            echo "  OK $2 ($(wc -c <"$1") 字节)"
          }
          fetch feature/selinux_hide.c    feature/selinux_hide.c    selinux_hide
          fetch feature/selinux_hide.h    feature/selinux_hide.h    selinux_hide
          fetch compat/kernel_compat.h    compat/kernel_compat.h    KSU_COMPAT
          # 定义了同名全局函数（path_mount / path_umount / ksu_strncpy_from_user_nofault），
          # 一起编进 vmlinux 会 LTO 报 duplicate symbol。
          # 它独有的 7 个函数，我们保留的 selinux_hide.c / symbol_resolver.c / patch_memory.c
          # 一个都没调用，所以只留它的头文件（那份头被 include guard 挡着，本来就是空的），不编它的 .c。
          fetch include/arch.h            include/arch.h            KSU
          fetch infra/symbol_resolver.h   infra/symbol_resolver.h   symbol
          fetch infra/symbol_resolver.c   infra/symbol_resolver.c   symbol
          fetch hook/patch_memory.h       hook/patch_memory.h       ksu_patch_text
          fetch hook/arm64/patch_memory.c hook/arm64/patch_memory.c patch_memory
          fetch tools/kernel_compat.mk    tools/kernel_compat.mk    KSU_COMPAT

          # ================= 放开 builtin 的 4 处守卫 =================
          python3 - <<'PYEOF'
          import io, re, sys
          p = "include/uapi/feature.h"
          s = io.open(p, encoding="utf-8").read()
          m = re.search(r"#if LINUX_VERSION_CODE >= KERNEL_VERSION\(5, 10, 0\)\n(\s*KSU_FEATURE_SELINUX_HIDE = 4,\n)#endif\n", s)
          if not m:
              print("::error title=feature.h 结构不是预期::找不到被 #if >=5.10 包住的 KSU_FEATURE_SELINUX_HIDE")
              sys.exit(1)
          s = s.replace(m.group(0), m.group(1))
          io.open(p, "w", encoding="utf-8").write(s)
          s2 = io.open(p, encoding="utf-8").read()
          if "KSU_FEATURE_SELINUX_HIDE = 4," not in s2:
              print("::error title=feature.h::SELINUX_HIDE 没写进去"); sys.exit(1)
          if re.search(r"#if[^\n]*5, 10, 0[^\n]*\n\s*KSU_FEATURE_SELINUX_HIDE", s2):
              print("::error title=feature.h::守卫还在"); sys.exit(1)
          if s2.index("KSU_FEATURE_SELINUX_HIDE") > s2.index("KSU_FEATURE_MAX"):
              print("::error title=feature.h::SELINUX_HIDE 必须在 KSU_FEATURE_MAX 之前"); sys.exit(1)
          print("  OK feature.h：KSU_FEATURE_SELINUX_HIDE 已无条件定义、且在 KSU_FEATURE_MAX 之前")

          p = "ksu.c"
          lines = io.open(p, encoding="utf-8").read().split("\n")
          hits = 0
          for i, l in enumerate(lines):
              if l.strip() == "#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 10, 0)":
                  if "selinux_hide" in "\n".join(lines[i + 1:i + 3]):
                      lines[i] = "#if 1"
                      hits += 1
          if hits != 3:
              print("::error title=ksu.c 守卫数不对::期望 3 处，实际 %d 处" % hits)
              for i, l in enumerate(lines):
                  if "selinux_hide" in l:
                      print("    line %d: %s" % (i + 1, l.strip()))
              sys.exit(1)
          io.open(p, "w", encoding="utf-8").write("\n".join(lines))
          s = io.open(p, encoding="utf-8").read()
          if s.count('#include "feature/selinux_hide.c"') != 1 or s.count("ksu_selinux_hide_init();") != 1:
              print("::error title=ksu.c 自检失败::include 或 init 数量不对"); sys.exit(1)
          print("  OK ksu.c：3 处守卫已改成 #if 1（.h include / .c include / init 调用）")
          PYEOF

          # ================= 把探测宏接进 Makefile，并编上新文件 =================
          MK=kernel/Makefile
          [ -f "$MK" ] || MK=Makefile
          test -f "$MK" || { echo "::error title=SELinux hide::找不到 kernel/Makefile"; exit 1; }
          if grep -q 'tools/kernel_compat.mk' "$MK"; then
            echo "::error::Makefile 里已经 include 过 kernel_compat.mk"; exit 1
          fi
          printf '\n\n# ==== K10x/A9: ReSukiSU 兼容性自动探测（SELinux hide 在 5.4 上靠它走对分支）====\ninclude $(src)/tools/kernel_compat.mk\nobj-$(CONFIG_KSU) += infra/symbol_resolver.o\nobj-$(CONFIG_KSU) += hook/arm64/patch_memory.o\n' >> "$MK"
          tail -10 "$MK"

          # ================= 落盘自检 =================
          grep -q 'KSU_FEATURE_SELINUX_HIDE = 4,' include/uapi/feature.h
          grep -q 'include $(src)/tools/kernel_compat.mk' "$MK"
          echo "  selinux_hide.c = $(wc -c <feature/selinux_hide.c) 字节"
          echo "  它的 5.10 版本分支数 = $( { grep -c 'KERNEL_VERSION(5, 10, 0)' feature/selinux_hide.c || true; } )"
          echo "  它用 selinux_state.ss 的次数 = $( { grep -c 'selinux_state.ss' feature/selinux_hide.c || true; } )"
          echo "::notice title=SELinux hide 移植（第 1 轮）::ReSukiSU @ $RS_SHA 的实现 + compat.mk 已就位，4 处 >=5.10 守卫已放开。这一轮先看能不能编过，报错我会按注解逐条修。"
      - name: SELinux hide 补齐 backup_policydb / backup_sidtab（第 2 轮）
        if: ${{ inputs.enable_ksu && inputs.keep_selinux_hide }}
        env:
          A10FIX_B64: ""
        run: |
          set -euxo pipefail

          # 第 1 轮（上一步）已经把 ReSukiSU 的 selinux_hide.c 搬进来了，但它 <5.10 的
          # 假策略要用 backup_policydb / backup_sidtab 这两个全局 —— 它们定义在
          # ReSukiSU 的 selinux/rules.c 里，而那部分没搬，所以编译报
          # 这一步把缺口补上：两个全局 + 备份逻辑 + ksu_dup_policydb/ksu_destroy_policydb。
          # 原则：>=5.10 的代码一个字不动，只加 <5.10 分支。
          KROOT="$BUILD_DIR/KernelSU/kernel"
          test -d "$KROOT" || { echo "::error title=A10::找不到 $KROOT"; exit 1; }
          echo "$A10FIX_B64" | base64 -d > /tmp/a10_fix.py
          test -s /tmp/a10_fix.py || { echo "::error title=A10::补丁脚本解出来是空的"; exit 1; }
          echo "  补丁脚本 $(wc -c </tmp/a10_fix.py) 字节"
          cd "$KROOT"
          python3 /tmp/a10_fix.py
          grep -q 'extern struct policydb \*backup_policydb;' include/ksu.h
          grep -q 'ksu_dup_policydb(get_policydb(), backup_policydb)' selinux/rules.c
          grep -q 'int ksu_dup_policydb(' selinux/sepolicy.c
          echo "::notice title=A10（第 2 轮）::backup_policydb / backup_sidtab、ksu_dup_policydb / ksu_destroy_policydb 已补齐；>=5.10 分支未改动。"

      - name: SELinux hide 补齐 ksu_get_uid_t / ksu_late_loaded / ksu_policy_rwlock_ptr（第 3 轮）
        if: ${{ inputs.enable_ksu && inputs.keep_selinux_hide }}
        env:
          A11FIX_B64: ""
        run: |
          set -euxo pipefail

          # 第 2 轮把 backup 补齐后，编译器把整个 selinux_hide.c 解析到 1036 行，只剩两类问题：
          #              —— 这个后面会变成链接期 undefined symbol，必须一起修
          #   用了同一个 include guard __KSU_H_KERNEL_COMPAT，前者先被 include，
          #   于是 ReSukiSU 那份整个被跳过，ksu_get_uid_t 就没了。
          # ③ ksu_policy_rwlock_ptr：<5.10 查上下文时 read_lock 它；builtin 的
          # 我已经把这份 selinux_hide.c 里所有 ksu_*/susfs_* 符号全量扫过一遍：
          #   补完这三个之后，缺失数为 0；而且它一个 susfs_* 都没用到，和 susfs 2.3 无链接牵扯。
          KROOT="$BUILD_DIR/KernelSU/kernel"
          test -d "$KROOT" || { echo "::error title=A11::找不到 $KROOT"; exit 1; }
          echo "$A11FIX_B64" | base64 -d > /tmp/a11_fix.py
          test -s /tmp/a11_fix.py || { echo "::error title=A11::补丁脚本解出来是空的"; exit 1; }
          echo "  补丁脚本 $(wc -c </tmp/a11_fix.py) 字节"
          cd "$KROOT"
          python3 /tmp/a11_fix.py
          grep -q '#define ksu_get_uid_t(x) (x.val)' feature/selinux_hide.c
          grep -q 'bool ksu_late_loaded' feature/selinux_hide.c
          grep -q 'rwlock_t \*ksu_policy_rwlock_ptr = NULL;' feature/selinux_hide.c
          grep -q 'ksu_policy_rwlock_ptr = &selinux_state.ss->policy_rwlock;' selinux/rules.c
          echo "::notice title=A11（第 3 轮）::ksu_get_uid_t / ksu_late_loaded / ksu_policy_rwlock_ptr 已补齐；全量符号扫描后缺失=0。"

      - name: SELinux hide 修崩溃隐患 + 面具豁免（第 6 轮）
        if: ${{ inputs.enable_ksu && inputs.keep_selinux_hide }}
        env:
          A14FIX_B64: ""
        run: |
          set -euxo pipefail

          # 实测：开关打开后能隐藏（生效），但面具一划掉就打不开、新终端拿不到 root
          #（面具闪退 -> 没人批准新的 root 请求；已授权的照旧）。
          # 读代码找到两个真空指针隐患，恰好是"5.4 + LTO 构建"最容易踩的：
          #   ① ksu_selinux_status_lock 靠 kallsyms 按名字解析（5.4 上它是 static 符号，
          #      LTO 会给它加 .llvm.<hash> 后缀）-> 解析失败 = NULL -> mutex_lock(NULL) 崩内核
          #   ② selinux_status_page 同样是解析后**直接解引用**，没有任何 NULL 检查 -> 崩内核
          # 另外面具自己的域只存在于"当前策略"，用备份策略解析必然失败，会让它 setcon 失败。
          # 所以这一步打五道修复（全部只动 feature/selinux_hide.c，其余一行不改）：
          #   ① 自备兜底锁，解析不到也不置 NULL
          #   ② 锁解析成功才覆盖兜底锁
          #   ③ status page 解析不到就跳过伪装（goto out），绝不崩
          #   ④ setprocattr：面具自己直接走原生路径
          #   ⑤ setprocattr：备份策略解析失败 -> 回落原生，而不是返错
          #   ⑥ status 页：面具自己不换快照页
          KROOT="$BUILD_DIR/KernelSU/kernel"
          test -d "$KROOT" || { echo "::error title=A14::找不到 $KROOT"; exit 1; }
          echo "$A14FIX_B64" | base64 -d > /tmp/a14_fix.py
          test -s /tmp/a14_fix.py || { echo "::error title=A14::补丁脚本解出来是空的"; exit 1; }
          cd "$KROOT"
          python3 /tmp/a14_fix.py
          grep -q 'ksu_selinux_status_lock = &ksu_selinux_hide_fallback_lock;' feature/selinux_hide.c
          grep -q 'if (!sp_sym) {' feature/selinux_hide.c
          grep -q 'if (is_manager()) {' feature/selinux_hide.c
          grep -q 'if (error2 || error)' feature/selinux_hide.c
          ! grep -q 'return error2 ?: error;' feature/selinux_hide.c
          echo "::notice title=A14（第 6 轮）::兜底锁 + status page NULL 保护 + 面具豁免 + 解析失败回落，五处全部就位。"

      - name: SELinux hide · setprocattr 整层透传（第 7 轮）
        if: ${{ inputs.enable_ksu && inputs.keep_selinux_hide }}
        env:
          A15FIX_B64: ""
        run: |
          set -euxo pipefail

          # A14 之后面具正常了，但 MT 终端等【已授权】的应用仍拿不到 root。
          # 读代码：hook 在解析上下文【之前】先做 PROCESS__SETCURRENT 权限检查：
          #     if (error) return error;          <-- A14 只改了后面那处解析失败
          # 而 su 起动时（ksud 会往 /proc/thread-self/attr/current 写 u:r:su:s0，
          # 见 userspace/ksud/src/su.rs:74/353）那个进程通常没有该权限
          # -> 直接返错 -> 切域失败 -> 拿不到 root。
          # 这一步把这一层整层透传（handler 一进来就 goto call_orig），
          # 交给原生 selinux_setprocattr() 用【当前策略】处理。
          # 代价：只失去 /proc/self/attr 这一条伪装；
          #       其余隐藏全保留（status 页伪装、策略查询备份、写入口接管、susfs 的 AVC 日志伪装）。
          KROOT="$BUILD_DIR/KernelSU/kernel"
          test -d "$KROOT" || { echo "::error title=A15::找不到 $KROOT"; exit 1; }
          echo "$A15FIX_B64" | base64 -d > /tmp/a15_fix.py
          test -s /tmp/a15_fix.py || { echo "::error title=A15::补丁脚本解出来是空的"; exit 1; }
          cd "$KROOT"
          python3 /tmp/a15_fix.py
          grep -q 'K10x/A15' feature/selinux_hide.c
          grep -q '^    goto call_orig;' feature/selinux_hide.c
          echo "::notice title=A15（第 7 轮）::setprocattr 层已整层透传；su 切域改由原生实现按当前策略处理。"

      - name: Apply susfs v2.3.0 内核补丁 (5.4 NON-GKI)
        shell: bash
        if: ${{ inputs.enable_ksu }}
        run: |
          set -euxo pipefail
          cd "$BUILD_DIR"

          rm -f /tmp/susfs_v230.patch
          curl -LSsf -o /tmp/susfs_v230.patch "$SUSFS_PATCH_URL" \
            || curl -LSsf -o /tmp/susfs_v230.patch "$SUSFS_PATCH_MIRROR" \
            || { echo "::error::susfs v2.3.0 补丁下载失败（主源和镜像都不通）"; exit 1; }

          SZ=$(wc -c < /tmp/susfs_v230.patch | tr -d ' ')
          echo "补丁大小: $SZ 字节（期望 $SUSFS_PATCH_SIZE）"
          [ "$SZ" = "$SUSFS_PATCH_SIZE" ] || { echo "::error::补丁大小不对，可能下到了错误内容"; exit 1; }

          SH=$(sha256sum /tmp/susfs_v230.patch | cut -c1-16)
          echo "补丁 sha256前16: $SH（期望 $SUSFS_PATCH_SHA256）"
          [ "$SH" = "$SUSFS_PATCH_SHA256" ] || { echo "::error::补丁哈希不对，内容不是预期的 v2.3.0"; exit 1; }

          grep -q '#define SUSFS_VERSION "v2.3.0"' /tmp/susfs_v230.patch \
            || { echo "::error::这不是 susfs v2.3.0"; exit 1; }
          grep -q '#define SUSFS_VARIANT "NON-GKI"' /tmp/susfs_v230.patch \
            || { echo "::error::这不是 NON-GKI 变体"; exit 1; }
          echo "✓ 确认是 susfs v2.3.0 / NON-GKI / 5.4"

          find . -name '*.rej' -delete || true

          patch -p1 --dry-run < /tmp/susfs_v230.patch > /tmp/susfs_dry.txt 2>&1 || true
          echo "===== dry-run 摘要 ====="
          grep -E 'FAILED|checking file' /tmp/susfs_dry.txt | tail -30 || true

          awk '/^checking file /{f=$3} /^Hunk #[0-9]+ FAILED/{print f}' /tmp/susfs_dry.txt \
            | sort -u > /tmp/susfs_failed_files.txt
          echo "  失败 hunk 所属文件: $(tr '\n' ' ' < /tmp/susfs_failed_files.txt)"
          BADF=$(grep -v '^fs/namespace\.c$' /tmp/susfs_failed_files.txt || true)
          if [ -n "$BADF" ]; then
            echo "::error::出现了预期之外的 hunk 失败，nsfix 的手工修逻辑可能不再适用："
            echo "$BADF"
            cat /tmp/susfs_dry.txt
            exit 1
          fi
          TOTF=$(grep -cE '^Hunk #[0-9]+ FAILED' /tmp/susfs_dry.txt || true)
          [ "$TOTF" = "1" ] || {
            echo "::error::失败 hunk 数是 $TOTF，预期恰好 1 个（fs/namespace.c 的 include 块）"
            cat /tmp/susfs_dry.txt
            exit 1
          }
          echo "✓ dry-run 通过：唯一失败的是 fs/namespace.c 的 include 块（已知，稍后由 nsfix 补）"

          patch -p1 < /tmp/susfs_v230.patch || true

          echo "$NSFIX_B64" | base64 -d > /tmp/nsfix.py
          python3 /tmp/nsfix.py "$BUILD_DIR"

          ALLREJ=$(find . -name '*.rej')
          OTHERS=$(echo "$ALLREJ" | grep -v '^\./fs/namespace\.c\.rej$' | grep -v '^$' || true)
          if [ -n "$OTHERS" ]; then
            echo "::error::出现了预期之外的 .rej："
            echo "$OTHERS"
            for f in $OTHERS; do echo "--- $f ---"; head -40 "$f"; done
            exit 1
          fi
          if [ -f fs/namespace.c.rej ]; then
            grep -q 'susfs_is_sdcard_android_data_not_decrypted' fs/namespace.c.rej \
              || { echo "::error::fs/namespace.c.rej 内容不是预期的 include 块，树可能变了，请人工检查"; cat fs/namespace.c.rej; exit 1; }
            grep -q 'CL_COPY_MNT_NS BIT(25)' fs/namespace.c.rej \
              || { echo "::error::fs/namespace.c.rej 内容不是预期的 include 块，树可能变了，请人工检查"; cat fs/namespace.c.rej; exit 1; }
            echo "  ✓ 唯一的 reject 内容正是预期的那块，已由 nsfix 补上，删除 .rej"
            rm -f fs/namespace.c.rej
          fi
          if [ -n "$(find . -name '*.rej')" ]; then
            echo "::error::仍有 .rej 残留"; find . -name '*.rej'; exit 1
          fi
          find . -name '*.orig' -delete || true

          test -f fs/susfs.c || { echo "::error::fs/susfs.c 没生成"; exit 1; }
          grep -q 'SUSFS_VERSION "v2.3.0"' include/linux/susfs.h \
            || { echo "::error::include/linux/susfs.h 版本不对"; exit 1; }
          grep -q 'CONFIG_KSU_SUSFS_SUS_MOUNT' fs/namespace.c \
            || { echo "::error::fs/namespace.c 没有 susfs 改动"; exit 1; }
          grep -q 'susfs_is_sdcard_android_data_not_decrypted' fs/namespace.c \
            || { echo "::error::fs/namespace.c 缺 susfs_is_sdcard_android_data_not_decrypted"; exit 1; }
          grep -q 'CL_COPY_MNT_NS BIT(25)' fs/namespace.c \
            || { echo "::error::fs/namespace.c 缺 CL_COPY_MNT_NS 定义"; exit 1; }
          echo "  fs/susfs.c = $(wc -l < fs/susfs.c) 行"
          echo "  include/linux/susfs.h = $(wc -l < include/linux/susfs.h) 行"
          echo "::notice title=susfs 内核补丁::v2.3.0 NON-GKI 已干净应用，0 个 reject"

      - name: Apply susfs hook 调用点 (v2.3.0 新 API)
        shell: bash
        if: ${{ inputs.enable_ksu }}
        run: |
          set -euxo pipefail
          cd "$BUILD_DIR"

          echo "$INLINE_HOOKS_B64" | base64 -d > /tmp/susfs_inline_hooks.sh
          SZ=$(wc -c < /tmp/susfs_inline_hooks.sh | tr -d ' ')
          echo "hook 脚本: $SZ 字节"
          bash /tmp/susfs_inline_hooks.sh

          echo "$A3HOOKFIX_B64" | base64 -d > /tmp/a3hookfix.py
          python3 /tmp/a3hookfix.py "$BUILD_DIR"

          grep -qE 'ksu_handle_faccessat\(int \*dfd, struct filename \*\*filename' fs/open.c \
            || { echo "::error::fs/open.c 没拿到 v2.3.0 新签名"; grep -n 'ksu_handle_faccessat' fs/open.c; exit 1; }
          grep -qE 'ksu_handle_stat\(int \*dfd, struct filename \*\*filename' fs/stat.c \
            || { echo "::error::fs/stat.c 没拿到 v2.3.0 新签名"; grep -n 'ksu_handle_stat' fs/stat.c; exit 1; }
          grep -qE 'ksu_handle_sys_reboot\(int magic1' kernel/reboot.c \
            || { echo "::error::kernel/reboot.c 没拿到调用点"; exit 1; }
          grep -qE 'ksu_handle_execveat\(int \*fd, struct filename \*\*filename_ptr' fs/exec.c \
            || { echo "::error::fs/exec.c 没拿到调用点"; exit 1; }
          grep -qE 'ksu_handle_input_handle_event' drivers/input/input.c \
            || { echo "::error::drivers/input/input.c 没拿到调用点"; exit 1; }

          for f in fs/open.c fs/stat.c; do
            if grep -qE 'ksu_handle_(faccessat|stat)\(int \*dfd, const char __user \*\*' "$f"; then
              echo "::error::$f 里还是旧式 const char __user ** 签名，和 builtin 面具对不上"
              grep -n 'ksu_handle_' "$f" | head -20
              exit 1
            fi
          done

          for f in fs/exec.c fs/open.c fs/stat.c; do
            grep -q 'extern bool ksu_su_compat_enabled;' "$f" \
              || { echo "::error::$f 的 ksu_su_compat_enabled 没改回 bool"; grep -n 'ksu_su_compat_enabled' "$f"; exit 1; }
            if grep -q 'static_branch_likely(&ksu_su_compat_enabled)' "$f"; then
              echo "::error::$f 还在把 bool 当 static_key 用"; exit 1
            fi
            grep -q 'if (ksu_su_compat_enabled) {' "$f" \
              || { echo "::error::$f 的 ksu_su_compat_enabled 用法没改"; exit 1; }
          done
          grep -q 'ksu_handle_sys_read(unsigned int fd, char __user \*\*buf_ptr, size_t \*count_ptr)' fs/read_write.c \
            || { echo "::error::fs/read_write.c 的 ksu_handle_sys_read 声明还是 1 参数"; grep -n 'ksu_handle_sys_read' fs/read_write.c; exit 1; }
          grep -q 'ksu_handle_sys_read(fd, &buf, &count);' fs/read_write.c \
            || { echo "::error::fs/read_write.c 的 ksu_handle_sys_read 调用没补实参"; grep -n 'ksu_handle_sys_read' fs/read_write.c; exit 1; }
          echo "  OK 8 处类型对齐生效（3 个 su_compat 声明+用法，sys_read 声明+调用）"
          echo "::notice title=susfs hook 调用点::已按 v2.3.0 新 API 写入 fs/exec.c fs/open.c fs/read_write.c fs/stat.c drivers/input/input.c security/selinux/hooks.c kernel/reboot.c"

      - name: Set Up Swap (LTO 链接很吃内存)
        shell: bash
        run: |
          set -euxo pipefail
          sudo swapoff -a || true
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Apply Droidspaces kABI Patches (5.4 GKI safe)
        shell: bash
        run: |
          set -e
          echo "$KABI_B64" | base64 -d > /tmp/kabi_patch.py
          python3 /tmp/kabi_patch.py "$BUILD_DIR"
          echo
          echo "===== 补丁后 sched.h 关键片段 ====="
          grep -n -B1 -A4 'ANDROID_KABI_USE(6' "$BUILD_DIR/include/linux/sched.h" || true
          echo
          echo "===== 补丁后 user.h 关键片段 ====="
          grep -n -B1 -A4 'ANDROID_KABI_USE(1' "$BUILD_DIR/include/linux/sched/user.h" || true
          echo
          if ! grep -q 'ANDROID_KABI_USE(6, struct sysv_sem sysvsem)' "$BUILD_DIR/include/linux/sched.h"; then
            echo "::error::sched.h 的 ABI padding 没打上"; exit 1
          fi
          if ! grep -q 'ANDROID_KABI_USE(1, unsigned long mq_bytes)' "$BUILD_DIR/include/linux/sched/user.h"; then
            echo "::error::user.h 的 ABI padding 没打上"; exit 1
          fi
          echo "::notice title=Droidspaces kABI 补丁::已应用（SYSVIPC + POSIX_MQUEUE 走 ABI padding，task_struct 布局不变）"

      - name: Integrate NoMount (KernelSU metamodule, built-in)
        shell: bash
        run: |
          set -euxo pipefail
          cd "$BUILD_DIR"
          curl -LSsf https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh | bash -s dev
          echo
          echo "===== NoMount 集成结果 ====="
          ls -la fs/nomount
          test -f fs/nomount/nomount.c || { echo '::error::fs/nomount/nomount.c 不存在'; exit 1; }
          grep -n 'nomount' fs/Makefile || { echo '::error::fs/Makefile 没改'; exit 1; }
          grep -n 'fs/nomount/Kconfig' fs/Kconfig || { echo '::error::fs/Kconfig 没改'; exit 1; }
          echo
          git -C NoMount log -1 --format='%H %s' || true
          echo "::notice title=NoMount::已集成（fs/nomount -> NoMount/kernel/src，CONFIG_NOMOUNT 见配置阶段）"

      - name: Patch vermagic.h (keep the modversions word)
        shell: bash
        run: |
          set -e
          F="$BUILD_DIR/include/linux/vermagic.h"
          test -f "$F" || { echo "::error::找不到 $F"; exit 1; }
          cp "$F" "$F.orig"
          N=$(grep -c '^#ifdef CONFIG_MODVERSIONS$' "$F" || true)
          echo "vermagic.h 里 #ifdef CONFIG_MODVERSIONS 出现 $N 次"
          if [ "$N" != "1" ]; then
            echo "::error::预期恰好 1 处，实际 $N 处，不敢乱改"; exit 1
          fi
          sed -i 's|^#ifdef CONFIG_MODVERSIONS$|#if 1 /* K10x: MODVERSIONS 已关，但 vermagic 必须保留 modversions 一词 */|' "$F"
          if grep -q '^#ifdef CONFIG_MODVERSIONS' "$F"; then
            echo "::error::sed 没生效"; exit 1
          fi
          echo "===== 改后的 vermagic.h ====="
          sed -n '1,45p' "$F"
          echo
          grep -n 'MODULE_VERMAGIC_MODVERSIONS' "$F"
          echo "::notice title=vermagic 补丁::MODVERSIONS=n 但 vermagic 仍含 modversions 一词，与原厂逐字一致"
      - name: Patch same_magic (both copies) so stock 5.4.254 modules load
        shell: bash
        run: |
          set -euxo pipefail
          cd "$BUILD_DIR"
          F="kernel/module.c"
          test -f "$F" || { echo "::error::找不到 $F"; exit 1; }
          echo "===== 改前：module.c 里 same_magic 的出现情况 ====="
          grep -n 'same_magic' "$F" || true
          echo "  注意：module.c 里有两个 same_magic —— #ifdef CONFIG_MODVERSIONS 一份，#else 一份"
          echo "  本内核 MODVERSIONS=n，真正参与编译的是 #else 那份，所以两份都要改"

          python3 - "$F" <<'PY'
          import io,sys
          p=sys.argv[1]
          s=io.open(p,encoding="utf-8",errors="surrogateescape").read()

          body_old_a = '{\n\tif (has_crcs) {\n\t\tamagic += strcspn(amagic, " ");\n\t\tbmagic += strcspn(bmagic, " ");\n\t}\n\treturn strcmp(amagic, bmagic) == 0;\n}'
          body_old_b = '{\n\treturn strcmp(amagic, bmagic) == 0;\n}'
          body_new = (
            '{\n'
            '\t/*\n'
            '\t * K10x A6e: 原厂 /vendor/lib/modules/*.ko 是 5.4.254 编的，本内核是 5.4.233，\n'
            '\t * 整串 strcmp 会 -ENOEXEC -> 原厂 .ko 全加载失败 -> ADSP 起不来 ->\n'
            '\t * 接近传感器/指南针/自动亮度失效 + 亮屏后触控阻塞 3~4 秒。\n'
            '\t *\n'
            '\t * 跳过第一段（内核版本串），只比后面的\n'
            '\t * "SMP preempt mod_unload <extra> <arch>"。\n'
            '\t * 版本串不同照样放行；arch / 关键配置不符的模块仍然被拒。\n'
            '\t * uname -r 与 VERMAGIC_STRING 一个字都没改。\n'
            '\t */\n'
            '\tconst char *as = strchr(amagic, \' \');\n'
            '\tconst char *bs = strchr(bmagic, \' \');\n'
            '\t(void)has_crcs;\n'
            '\tif (!as || !bs)\n'
            '\t\treturn 0;\n'
            '\treturn strcmp(as + 1, bs + 1) == 0;\n'
            '}'
          )
          n1 = s.count(body_old_a)
          n2 = s.count(body_old_b)
          if n1 != 1 or n2 != 1:
              print(f"::error::same_magic 体命中数不对：#ifdef={n1} #else={n2}（都应为 1）"); sys.exit(1)
          s = s.replace(body_old_a, body_new, 1)
          s = s.replace(body_old_b, body_new, 1)
          io.open(p,"w",encoding="utf-8",errors="surrogateescape").write(s)
          print("  OK 两份 same_magic 都已改：跳过内核版本串，只比其余部分")
          PY

          echo "===== 改后 ====="
          grep -n 'K10x A6e' "$F" || true
          CNT=$(grep -c 'K10x A6e' "$F" || true)
          echo "  打上补丁的 same_magic 份数: $CNT（应为 2）"
          [ "$CNT" -eq 2 ] || { echo "::error::只改了 $CNT 份 same_magic，应为 2 份"; exit 1; }
          if grep -q 'return strcmp(amagic, bmagic) == 0;' "$F"; then
            echo "::error::原整串比对还在，没改干净"; exit 1
          fi
          echo "  OK 原整串 strcmp 已不存在（两份都清干净了）"
          echo "::notice title=same_magic 补丁::两份都已跳过内核版本串比对 —— 原厂 5.4.254 的 .ko 能加载，uname -r 不变"

      - name: 下载并校验 Rancemxn 的 sm6375_defconfig（性能优化来源）
        shell: bash
        run: |
          set -euxo pipefail


          RANCE_CFG="$RUNNER_TEMP/sm6375_defconfig"
          DEFCONFIG="$GITHUB_WORKSPACE/k10x_defconfig"

          if [ "${{ inputs.defconfig_source }}" = "dump" ]; then
            # ★按输入强制用手机 dump 的 k10x_defconfig（原厂等价，跳过 Rancemxn 的改动）★
            # 用途：验证传感器起不来是否为 Rancemxn 配置差异所致
            echo "::notice title=配置来源::按输入强制使用 dump 的 k10x_defconfig（不用 Rancemxn 的配置）"
            echo "  行数=$(wc -l < "$DEFCONFIG")  =m 个数=$(grep -cE '^CONFIG_[A-Z0-9_]+=m$' "$DEFCONFIG" || true)"
            grep -E '^CONFIG_(MSM_ADSP_LOADER|QTI_POLICY_ENGINE_SENSOR|SENSORS_SSC)' "$DEFCONFIG" || echo "  （这几个符号在 dump 配置里没有 =y/=m 行）"
          elif curl -LSsf -o "$RANCE_CFG" "$RANCE_DEFCONFIG_URL" || \
             curl -LSsf -H "Accept: application/vnd.github.raw" -o "$RANCE_CFG" "$RANCE_DEFCONFIG_MIRROR"; then
            SZ=$(wc -c < "$RANCE_CFG")
            SH=$(sha256sum "$RANCE_CFG" | cut -c1-16)
            echo "  大小 $SZ（期望 $RANCE_DEFCONFIG_SIZE）  sha256前16 $SH（期望 $RANCE_DEFCONFIG_SHA256）"
            if [ "$SZ" = "$RANCE_DEFCONFIG_SIZE" ] && [ "$SH" = "$RANCE_DEFCONFIG_SHA256" ]; then
              DEFCONFIG="$RANCE_CFG"
              echo "::notice title=配置来源::Rancemxn sm6375_defconfig（含 O3/BBR/FQ 性能优化）校验通过"
            else
              echo "::warning::Rancemxn defconfig 校验不过，回退到手机 dump 的 k10x_defconfig"
            fi
          else
            echo "::warning::Rancemxn defconfig 下载失败，回退到手机 dump 的 k10x_defconfig"
          fi

          test -f "$DEFCONFIG" || { echo "::error::没有可用的 defconfig"; exit 1; }
          echo "  最终 DEFCONFIG=$DEFCONFIG"
          echo "  行数=$(wc -l < "$DEFCONFIG")  =m 个数=$(grep -cE '^CONFIG_[A-Z0-9_]+=m$' "$DEFCONFIG" || true)"
          echo "DEFCONFIG_USED=$DEFCONFIG" >> "$GITHUB_ENV"

      - name: 允许 arm64 开启 -O3（Kconfig 一行补丁，第 14 轮）
        shell: bash
        run: |
          set -euxo pipefail
          echo "$O3FIX_B64" | base64 -d > /tmp/o3_fix.py
          test -s /tmp/o3_fix.py || { echo "::error title=O3::补丁脚本是空的"; exit 1; }
          python3 /tmp/o3_fix.py "$BUILD_DIR"
          if grep -q 'depends on ARC || ARM64' "$BUILD_DIR/init/Kconfig"; then
            echo "  OK init/Kconfig 已放开 -O3（arm64）"
          else
            echo "::warning title=O3::init/Kconfig 没被改到（不影响编译，只是 O3 不会生效）"
          fi
          #       （整行以 # 开头 → Kconfig 当注释，无害）。真正会让 `make olddefconfig` exit 2 的，
          #       是把 /* 写到 depends/bool 这种【解析行】上 —— 本步骤的补丁只用 # 注释，已避开。
          if grep -nE '^[[:space:]]*(depends on|bool|tristate|default)[^#]*/\*' "$BUILD_DIR/init/Kconfig"; then
            echo "::warning title=O3::解析行上出现了 /* —— Kconfig 会报错，请检查上面这几行"
          else
            echo "  解析行上没有 /* —— 安全"
          fi
          echo "::notice title=O3::init/Kconfig 的 -O3 依赖已放开（ARC || ARM64）—— perf 选 bbr+o3 时才会真正生效"
      - name: Configure Kernel — 生成 .config
        shell: bash
        run: |
          set -euxo pipefail
          cd "$BUILD_DIR"
          exec > >(tee "$RUNNER_TEMP/config.log") 2>&1

          DEFCONFIG="${DEFCONFIG_USED:-$GITHUB_WORKSPACE/k10x_defconfig}"
          test -f "$DEFCONFIG"
          echo "  用 $DEFCONFIG  行数=$(wc -l < "$DEFCONFIG")  =m 个数=$(grep -cE '^CONFIG_[A-Z0-9_]+=m$' "$DEFCONFIG" || true)"

          mkdir -p out
          VENDOR_CFG="$BUILD_DIR/arch/arm64/configs/vendor"
          if [ "${{ inputs.config_source }}" = "official" ]; then
            echo "===== 配置来源：源码树官方三件套 ====="
            for f in holi_QGKI.config holi_GKI.config holi_debug.config; do
              test -f "$VENDOR_CFG/$f" || { echo "::error::缺少 $VENDOR_CFG/$f"; exit 1; }
            done
            GKI_CFG="$BUILD_DIR/arch/arm64/configs/gki_defconfig"
            test -f "$GKI_CFG" || { echo "::error::缺少 $GKI_CFG"; exit 1; }
            rm -f out/.config out/.config.old
            ARCH=arm64 scripts/kconfig/merge_config.sh -O out -m \
              "$GKI_CFG" \
              "$VENDOR_CFG/holi_QGKI.config" \
              "$VENDOR_CFG/holi_GKI.config" \
              "$VENDOR_CFG/holi_debug.config"
            test -s out/.config || { echo "::error::合并后 out/.config 是空的"; exit 1; }
            echo "合并后 out/.config 行数: $(wc -l < out/.config)"
            for s in CONFIG_ANDROID_BINDER_IPC CONFIG_ANDROID_BINDERFS CONFIG_ASHMEM CONFIG_ARCH_QCOM CONFIG_MSM_ADSPRPC CONFIG_QCOM_SCM; do
              grep -q "^$s=" out/.config && echo "  ✓ $s" || echo "  ✗ $s 缺失（合并有问题）"
            done
            if [ "true" = "true" ]; then
              echo "===== 强制 vendor 驱动 =y ====="
              for s in MSM_ADSPRPC QCOM_SCM QCOM_SMEM QCOM_SMP2P QCOM_SMP2P_SLEEPSTATE \
                       QCOM_GLINK QCOM_GLINK_PKT MSM_GLINK_SSR MSM_SUBSYSTEM_RESTART \
                       MSM_PIL_SSR_GENERIC MSM_SERVICE_LOCATOR MSM_SERVICE_NOTIFIER \
                       MSM_CDSP_LOADER MSM_PIL QCOM_QMI_HELPERS ION_MSM_HEAPS \
                       RPMSG_QCOM_GLINK_NATIVE RPMSG_QCOM_GLINK_RPM \
                       RPMSG_QCOM_GLINK_SMEM RPMSG_QCOM_GLINK_SPSS RPMSG_CHAR \
                       ARM_SMMU COMMON_CLK_QCOM CRYPTO_DEV_QCOM_MSM_QCE \
                       FW_LOADER_USER_HELPER FW_LOADER_USER_HELPER_FALLBACK; do
                scripts/config --file out/.config --enable "$s"
              done
              echo "  已强制 $(scripts/config --file out/.config --state MSM_ADSPRPC) MSM_ADSPRPC / $(scripts/config --file out/.config --state QCOM_SCM) QCOM_SCM"
            fi
          else
            echo "===== 配置来源：$DEFCONFIG ====="

            # 第 29 轮：OPPO 的 Kconfig 是 CRLF 行尾，会让 Kconfig 反复 Restart config。
            # -> CFI_CLANG 连锁失效 -> scs.o/cfi.o 不编 -> vendor 模块加载失败 -> 卡二屏。
            # 去掉 \r 即可从源头掐掉 Restart（run#7 只 Restart 1 次所以侥幸没事）。
            echo "===== 第 29 轮：清理 Kconfig 的 CRLF 行尾（掐掉 Restart config）====="
            CRLF_FIXED=0
            while IFS= read -r kf; do
              if grep -qU $'\r' "$kf" 2>/dev/null; then
                sed -i 's/\r$//' "$kf"
                echo "  去 CR: ${kf#$BUILD_DIR/}"
                CRLF_FIXED=$((CRLF_FIXED+1))
              fi
            done < <(find . -name 'Kconfig*' -type f -not -path './out/*' 2>/dev/null)
            echo "  共修 $CRLF_FIXED 个 Kconfig 文件的 CRLF"
            echo "  剩余含 CR 的 Kconfig：$( { find . -name 'Kconfig*' -type f -not -path './out/*' -exec grep -lU $'\r' {} + 2>/dev/null || true; } | wc -l )"

            cp "$DEFCONFIG" out/.config
            # 第 23~27 轮：拷完 defconfig 立刻 olddefconfig，让 .config 与当前
            # Kconfig 树自洽。必须带全 ARCH + Clang 环境，否则会退化成 x86/GCC。
            # CC=clang 必须给，否则探测成 GCC -> LTO/CFI 失效 -> unmet -> Restart。
            export PATH="$CLANG_DIR/bin:$PATH"
            export ARCH=arm64 SUBARCH=arm64
            export CC=clang LD=ld.lld LLVM=1
            export CLANG_TRIPLE=aarch64-linux-gnu-
            export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchains/gcc93/bin/aarch64-buildroot-linux-gnu-"
            export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/toolchains/gcc32/bin/arm-linux-androideabi-"
            echo "  CLANG_DIR=$CLANG_DIR"
            echo "  which clang: $(command -v clang || echo '★找不到 clang★')"
            echo "===== 强开之前先 olddefconfig（保证 .config 与 Kconfig 自洽）====="
            echo "  ARCH=$ARCH SUBARCH=$SUBARCH（必须都是 arm64，否则会变成 x86 内核）"
            echo "  拷入后行数=$(wc -l < out/.config)  ARCH_QCOM(拷入时)=$( { grep -E '^CONFIG_ARCH_QCOM=' out/.config || echo '★本来就没有★'; } )"
            # ★不要吞输出★ run#16 就是因为 >/dev/null 2>&1 把 Kconfig 的
            #   "Restart config / Error in reading / unmet dependencies"
            #   全吞了，导致查不出 ARCH_QCOM 为什么消失。这次全打出来。
            set +e
            ARCH=arm64 make -j"$(nproc)" O=out olddefconfig > "$RUNNER_TEMP/preolddef.log" 2>&1
            PRE_RC=$?
            set -e
            echo "  olddefconfig 返回码=$PRE_RC"
            echo "  ---- Kconfig 关键告警（若有）----"
            grep -nE 'Restart config|Error in reading|unmet direct dep|warning:.*Kconfig|unsupported character|new symbol' \
              "$RUNNER_TEMP/preolddef.log" 2>/dev/null | head -25 || true
            echo "  ---- 有没有问 ARCH_QCOM（NEW）----"
            grep -n 'ARCH_QCOM' "$RUNNER_TEMP/preolddef.log" 2>/dev/null | head -5 || true
            echo "  ---- 日志里有几个 (NEW) ----"
            grep -c '(NEW)' "$RUNNER_TEMP/preolddef.log" 2>/dev/null || true
            echo "  ---- source 链检查：Kconfig 是否认到 Kconfig.platforms ----"
            echo "    arch/arm64/Kconfig 里 source Kconfig.platforms 的行："
            grep -n 'Kconfig.platforms' arch/arm64/Kconfig 2>/dev/null || echo "      ★没有这一行★"
            echo "    arch/arm64/Kconfig.platforms 是否存在："
            ls -la arch/arm64/Kconfig.platforms 2>/dev/null || echo "      ★文件不存在★"
            echo "    Kconfig.platforms 里 config ARCH_QCOM 的行："
            grep -n 'config ARCH_QCOM' arch/arm64/Kconfig.platforms 2>/dev/null || echo "      ★没有★"
            echo "  ---- 用 kconfiglib 直接问 Kconfig 认不认 ARCH_QCOM ----"
            if [ -f scripts/kconfig/merge_config.sh ]; then
              echo "    (scripts/kconfig 存在)"
            fi
            if [ "$PRE_RC" -ne 0 ]; then
              echo "::error title=配置::预 olddefconfig 失败 rc=$PRE_RC"
              tail -40 "$RUNNER_TEMP/preolddef.log" || true
              exit 1
            fi
            echo "  行数=$(wc -l < out/.config)  ARCH_QCOM=$( { grep -E '^CONFIG_ARCH_QCOM=' out/.config || echo '★缺失★'; } )"

            # 第 25 轮：打印 olddefconfig 前后差异，便于定位
            if [ ! -f "$RUNNER_TEMP/defconfig_before.txt" ]; then :; fi
            cp -f "$DEFCONFIG" "$RUNNER_TEMP/cfg_before.txt" 2>/dev/null || true
            echo "  ---- olddefconfig 删掉/改动的行（最多 60 条）----"
            diff "$RUNNER_TEMP/cfg_before.txt" out/.config 2>/dev/null \
              | grep -E '^[<>]' | head -60 || true
            echo "  ---- 删除行总数 ----"
            { diff "$RUNNER_TEMP/cfg_before.txt" out/.config 2>/dev/null || true; } \
              | { grep -c '^<' || true; } || true
            echo "  ---- 被删掉的 ARCH_* 符号 ----"
            { diff "$RUNNER_TEMP/cfg_before.txt" out/.config 2>/dev/null || true; } \
              | grep -E '^< CONFIG_(ARCH_[A-Z0-9_]+|ARM64[A-Z0-9_]*)=' | head -40 || true
            echo "  ---- 保留的 ARCH_* 符号（看还剩什么）----"
            grep -E '^CONFIG_(ARCH_[A-Z0-9_]+|ARM64[A-Z0-9_]*)=y' out/.config | head -20 || true
            echo "  ---- 关键：Kconfig 认不认这些符号（用 conf --listnewconfig）----"
            set +e
            ARCH=arm64 make O=out listnewconfig > "$RUNNER_TEMP/newcfg.log" 2>&1
            echo "    listnewconfig 返回码=$?"
            head -20 "$RUNNER_TEMP/newcfg.log" 2>/dev/null || true
            set -e
            echo "  ---- out/ 目录结构（确认没有残留缓存）----"
            ls -la out/ 2>/dev/null | head -20 || true
            echo "    out/include/config 存在吗："
            ls -d out/include/config 2>/dev/null && echo "      ★存在 —— 可能有旧缓存★" || echo "      不存在（干净）"
            echo "  ---- 内核源码版本（确认 BUILD_DIR 是哪个树）----"
            head -4 Makefile 2>/dev/null || true
            echo "    arch/arm64/Kconfig.platforms 的 sha256："
            sha256sum arch/arm64/Kconfig.platforms 2>/dev/null || true
            echo "  ---- ★必须是 arm64，不能是 x86★ ----"
            grep -E '^# Linux/(arm64|x86)' out/.config | head -2 || true
            grep -qE '^# Linux/arm64' out/.config \
              || { echo "::error title=配置::out/.config 不是 arm64 内核配置（ARCH 丢了会变成 x86）"; head -2 out/.config; exit 1; }
            grep -qE '^CONFIG_ARM64=y' out/.config \
              || { echo "::error title=配置::CONFIG_ARM64 不是 y —— make 用了宿主机架构"; exit 1; }
            echo "  OK 仍是 Linux/arm64 + CONFIG_ARM64=y"
            echo "  ---- 直接问 Kconfig：ARCH_QCOM 的定义能不能被解析出来 ----"
            if [ -x scripts/kconfig/conf ]; then
              echo "    (scripts/kconfig/conf 已存在)"
            else
              echo "    (scripts/kconfig/conf 还没有，qconf 会在 olddefconfig 时生成)"
            fi
            grep -n 'config ARCH_QCOM' arch/arm64/Kconfig.platforms 2>/dev/null || true
            sed -n '180,190p' arch/arm64/Kconfig.platforms 2>/dev/null | cat -A | head -12 || true
            # ★硬断言：平台符号必须在强开之前就立住★
            for s in ARCH_QCOM ARM64 QCOM_SCM QCOM_QMI_HELPERS NET; do
              if ! grep -qE "^CONFIG_${s}=y" out/.config; then
                echo "::error title=配置::$s 在预 olddefconfig 之后不是 y —— 继续下去会编出残废内核"
                echo "  当前: $( { grep -E "^CONFIG_${s}=" out/.config || echo '(无这一行)'; } )"
                exit 1
              fi
            done
            echo "  OK ARCH_QCOM / ARM64 / QCOM_SCM / QCOM_QMI_HELPERS / NET 均为 y"
          fi

          LV_IN="${{ inputs.kernel_release_suffix }}"
          if [ -n "$LV_IN" ]; then
            scripts/config --file out/.config --set-str LOCALVERSION "$LV_IN"
            echo "  LOCALVERSION 设为 '$LV_IN'"
          fi

          echo "===== 性能优化项核对（Rancemxn 的优化）====="
          for s in CC_OPTIMIZE_FOR_PERFORMANCE_O3 TCP_CONG_BBR NET_SCH_FQ NET_SCH_FQ_CODEL DEBUG_INFO_REDUCED DEBUG_INFO; do
            echo "  CONFIG_$s = $(scripts/config --file out/.config --state "$s" 2>/dev/null || echo '?')"
          done
          echo "  CONFIG_DEFAULT_TCP_CONG = $(grep -E '^CONFIG_DEFAULT_TCP_CONG=' out/.config | cut -d= -f2)"
          echo "::notice title=性能优化::O3=$(scripts/config --file out/.config --state CC_OPTIMIZE_FOR_PERFORMANCE_O3) BBR=$(scripts/config --file out/.config --state TCP_CONG_BBR) FQ=$(scripts/config --file out/.config --state NET_SCH_FQ) FQ_CODEL=$(scripts/config --file out/.config --state NET_SCH_FQ_CODEL) DEBUG_INFO=$(scripts/config --file out/.config --state DEBUG_INFO)"

          DRV_KCONFIG="QCA_CLD_WLAN UFF_FINGERPRINT QTI_POLICY_ENGINE_SENSOR HORAE_THERMAL_SHELL OPLUS_FEATURE_CDT BTFM_SLIM MSM_BT_POWER MSM_RDBG OPLUS_FEATURE_MIDAS_GKI OPLUS_FEATURE_WIFI_SMARTANTENNA OPLUS_SENSOR_CONSUMER_IR_CORE OPLUS_SENSOR_CONSUMER_IR_QC OPLUS_KERNEL_SECURE_FEATURE OPLUS_KERNEL_SECURE_GUARD OPLUS_KERNEL_SECURE_KEVENTUPLOAD OPLUS_SECURE OPLUS_SECURE_COMMON OPLUS_SECURE_QCOM OPLUS_FEATURE_MM_FEEDBACK OPLUS_FEATURE_SELINUX_CONTROL_LOG"
          echo "===== 基线：20 个 OPPO 驱动内建（A26/A27 行为，wifi/蓝牙/红外都内建） ====="
          echo "  原则：原厂值 =m 的一律交回 /vendor/lib/modules/5.4-gki 的 .ko；原厂根本没编的关掉。"
          echo "        自己再内建一份 = 同名驱动注册两次，而且比原厂 .ko 更早 probe（会先抢 GPIO/i2c/pinctrl）。"
          echo "        实测：内建后 oplus_bsp_ir_core / kookong_ir_spi / btpower / bt_fm_slim / rdbg 这些原厂 .ko 就没起来。"
          DRV_OK=0
          for s in $DRV_KCONFIG; do
            if scripts/config --file out/.config --enable "$s" 2>/dev/null; then
              echo "  ✓ $s -> y"
              DRV_OK=$((DRV_OK+1))
            else
              echo "  ⚠ $s 不在这个 Kconfig 树里，跳过"
            fi
          done
          echo "  已处理 $DRV_OK / 11 个（只有原厂本来就 =y 的）"
          echo "::notice title=驱动基线::20 个驱动全部 --enable 内建（保 get_secureType 等链接期符号）；QCOM_APR/SOUNDWIRE 仍为 n；techpack 保持 =m"

          if [ "${{ inputs.enable_ksu }}" = "true" ]; then
            if [ ! -d "$BUILD_DIR/drivers/kernelsu" ]; then
              echo "::error::enable_ksu=true 但 drivers/kernelsu 不存在（Integrate SukiSU Ultra 被跳过或失败）"
              exit 1
            fi
            scripts/config --file out/.config --enable KSU

            scripts/config --file out/.config \
              --enable KSU_SUSFS \
              --enable KSU_SUSFS_SUS_PATH \
              --enable KSU_SUSFS_SUS_MOUNT \
              --enable KSU_SUSFS_SUS_KSTAT \
              --enable KSU_SUSFS_SUS_MAP \
              --enable KSU_SUSFS_OPEN_REDIRECT \
              --enable KSU_SUSFS_SPOOF_UNAME \
              --enable KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
              --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
              --enable KSU_SUSFS_ENABLE_LOG

            scripts/config --file out/.config --enable THREAD_INFO_IN_TASK

            scripts/config --file out/.config \
              --enable  KALLSYMS \
              --enable  KALLSYMS_ALL \
              --enable  KPM

            scripts/config --file out/.config \
              --enable FTRACE \
              --enable TRACEPOINTS \
              --enable FTRACE_SYSCALLS

            echo "  OK KSU + susfs v2.3.0 全特性(10 项) + KPM + KALLSYMS_ALL 已显式打开"
            echo "  OK 钩子路线 = SUSFS_INLINE_HOOK（由 CONFIG_KSU_SUSFS=y 决定）"
          fi

          scripts/config --file out/.config --disable MODVERSIONS
          scripts/config --file out/.config --disable MODULE_SIG_FORCE
          if [ "${{ inputs.module_sig }}" = "off" ]; then
            scripts/config --file out/.config --disable MODULE_SIG
            echo "  → MODULE_SIG=n（module_sig_check 直接返回 0，签名路径完全不存在）"
          else
            echo "  → MODULE_SIG 保持 =y 但不强制（FORCE=n）"
          fi

          scripts/config --file out/.config --disable MODULE_SIG_ALL
          scripts/config --file out/.config --set-str MODULE_SIG_KEY ""
          scripts/config --file out/.config --disable KEXEC_SIG            || true
          scripts/config --file out/.config --disable KEXEC_SIG_FORCE      || true
          scripts/config --file out/.config --disable SYSTEM_BLACKLIST_KEYRING || true
          {
            echo "===== ION / DMA-BUF / ADSP 实际配置 ====="
            grep -E '^CONFIG_(ION|MSM_ION|DMABUF|DMA_SHARED_BUFFER|DMA_BUF|QCOM_ION|ADSP|RPMSG|MSM_ADSPRPC|SLIMBUS|QCOM_SCM)' out/.config | sort
            echo
            echo "===== /dev/ion 与 dmabuf 相关节点驱动 ====="
            grep -E '^CONFIG_(SYNTHETIC|DMABUF_HEAPS|DMABUF_HEAPS_SYSTEM|ION_SYSTEM_HEAP|ION_CARVEOUT_HEAP|ION_CHUNK_HEAP|ION_CMA_HEAP|ION_MSM_HEAP)' out/.config | sort
          } > "$RUNNER_TEMP/ion.txt" 2>&1 || true
          echo "=========== ION 配置 ==========="
          cat "$RUNNER_TEMP/ion.txt"
          IONMSG=$(head -c 6000 "$RUNNER_TEMP/ion.txt" | tr '\n' ' ' | sed 's/%/%25/g')
          echo "::notice title=ION与DMA配置::${IONMSG}" || true

          if [ -n "${{ inputs.kernel_release_suffix }}" ]; then
            scripts/config --file out/.config \
              --disable LOCALVERSION_AUTO \
              --set-str LOCALVERSION "${{ inputs.kernel_release_suffix }}"
          fi

          if [ -n "${{ inputs.extra_cmdline }}" ]; then
            OLD_CMDLINE="$(scripts/config --file out/.config --state CMDLINE 2>/dev/null || true)"
            case "$OLD_CMDLINE" in
              *"${{ inputs.extra_cmdline }}"*) NEW_CMDLINE="$OLD_CMDLINE" ;;
              "")  NEW_CMDLINE="${{ inputs.extra_cmdline }}" ;;
              *)   NEW_CMDLINE="$OLD_CMDLINE ${{ inputs.extra_cmdline }}" ;;
            esac
            scripts/config --file out/.config --set-str CMDLINE "$NEW_CMDLINE"
            scripts/config --file out/.config --enable CMDLINE_EXTEND
            scripts/config --file out/.config --disable CMDLINE_FORCE
          fi   # ← extra_cmdline 只管上面这段；下面的自检/断言必须无条件执行

          scripts/config --file out/.config --disable CFS_BANDWIDTH
          scripts/config --file out/.config --disable CGROUP_PIDS
          scripts/config --file out/.config --enable SYSVIPC
          scripts/config --file out/.config --enable POSIX_MQUEUE
          scripts/config --file out/.config --enable IPC_NS
          scripts/config --file out/.config --enable PID_NS
          scripts/config --file out/.config --enable DEVTMPFS
          scripts/config --file out/.config --enable CGROUP_DEVICE
          scripts/config --file out/.config --enable NETFILTER_XT_MATCH_ADDRTYPE
          scripts/config --file out/.config --enable USER_NS
          scripts/config --file out/.config --enable IP6_NF_NAT
          scripts/config --file out/.config --enable IP6_NF_TARGET_MASQUERADE
          scripts/config --file out/.config --enable TMPFS_POSIX_ACL
          scripts/config --file out/.config --enable TMPFS_XATTR
          scripts/config --file out/.config --enable NOMOUNT

      - name: NTsync 驱动 backport（5.4 ← 6.15，Winlator/Wine 用）
        env:
          NTSYNCPORT_B64: ""
        run: |
          set -euxo pipefail

          # 需求：Winlator/Wine 的 ntsync 需要内核驱动 + /dev/ntsync 节点。
          # 主线 6.10/6.12 里那个只是 249 行初版；完整实现是 6.15+ 的 1218 行版本。
          # 我们把它 backport 到 5.4：
          #   · 驱动只用常规 API（miscdevice / anon_inodes / hrtimer / mutex / slab），
          #     没有 cleanup.h / guard() / xarray 这些 6.x 专属东西
          #   · misc 设备自带 .mode = 0666 -> 应用不用 root 就能打开 /dev/ntsync
          #   · 唯一要防的是 compat_ptr_ioctl()（5.6 才进内核）：脚本会在编译机上
          #     逐文件探测声明/定义，缺了就自动换成等价的本地方案。
          # 这一步插在 .config 生成之后、olddefconfig 之前，好让符号被正式认到。
          cd "$BUILD_DIR"
          echo "$NTSYNC_H_B64" | base64 -d > include/uapi/linux/ntsync.h
          echo "$NTSYNC_C_B64" | base64 -d > drivers/misc/ntsync.c
          C_SIZE=$(wc -c < drivers/misc/ntsync.c)
          H_SIZE=$(wc -c < include/uapi/linux/ntsync.h)
          test "$C_SIZE" -gt 20000 || { echo "::error title=A16::ntsync.c 只有 $C_SIZE 字节，解包不完整"; exit 1; }
          test "$H_SIZE" -gt 500   || { echo "::error title=A16::ntsync.h 只有 $H_SIZE 字节，解包不完整"; exit 1; }
          echo "  ntsync.c=$C_SIZE 字节  ntsync.h=$H_SIZE 字节"
          echo "$NTSYNCPORT_B64" | base64 -d > /tmp/ntsync_port.py
          KROOT="$BUILD_DIR" python3 /tmp/ntsync_port.py
          # 打开 CONFIG_NTSYNC（此时 out/.config 已由上一步生成）
          ./scripts/config --file out/.config --enable NTSYNC
          grep -q '^CONFIG_NTSYNC=y' out/.config || { echo "::error title=A16::out/.config 里没有 CONFIG_NTSYNC=y"; exit 1; }
          grep -A2 '^config NTSYNC' drivers/misc/Kconfig
          grep -n 'ntsync.o' drivers/misc/Makefile
          echo "::notice title=A16（NTsync）::驱动已装好并 CONFIG_NTSYNC=y；/dev/ntsync 将对应用可读写（mode 0666）。"

      - name: 性能优化（BBR / FQ / 可选 O3）
        run: |
          set -euxo pipefail
          cd "$BUILD_DIR"
          test -f out/.config || { echo "::error title=性能::out/.config 还没生成"; exit 1; }

          # ★默认优化：关掉纯调试/统计开销（这些在原厂工程配置里是开着的，日常用不到）★
          echo "===== 关闭调试/统计开销 ====="
          # 注意：KSU_SUSFS_ENABLE_LOG 保持开启 —— 工作流有多处校验要求它为 y，
          #       关掉会让「Configure Kernel 校验」直接失败（A24 就栽在这里）。
          # 只关 SCHEDSTATS：它对每个任务/每个 CPU 一直在累加统计，关掉有真实收益。
          #   关掉后 debug.o 不编译，/proc/sys/kernel/sched_* 那些调参项会整段消失（内核管理器就调不了了），
          #   而它本身对性能几乎没影响，得不偿失。
          # DEBUG_LIST 也保持开启：它是链表自检，收益极小、留着更稳。
          ./scripts/config --file out/.config --disable SCHEDSTATS 2>/dev/null || true
          for k in SCHEDSTATS SCHED_DEBUG DEBUG_LIST; do
            printf "  %-22s = %s\n" "$k" "$(./scripts/config --file out/.config --state "$k" 2>/dev/null || echo '-')"
          done
          echo "::notice title=优化::只关了 SCHEDSTATS（SCHED_DEBUG/DEBUG_LIST/KSU_SUSFS_ENABLE_LOG 都保持开启）；loglevel=${{ inputs.extra_cmdline }}"

          case "${{ inputs.perf }}" in bbr|bbr+fast|bbr+o3|bbr+o3+fast) PERF_ON=1;; *) PERF_ON=0;; esac
          if [ "$PERF_ON" = "1" ]; then
            echo "===== 开启 BBR + FQ/FQ_CODEL ====="
            ./scripts/config --file out/.config --enable NET_SCH_FQ
            ./scripts/config --file out/.config --enable NET_SCH_FQ_CODEL
            ./scripts/config --file out/.config --enable TCP_CONG_BBR
            ./scripts/config --file out/.config --set-str DEFAULT_TCP_CONG bbr
            # 顺便把几个常被忽略的队列/拥塞项也打开（没定义就跳过）
            for s in NET_SCH_FQ_PIE NET_SCH_CAKE NET_SCH_HTB TCP_CONG_BBR; do
              ./scripts/config --file out/.config --enable "$s" 2>/dev/null || true
            done
            for k in NET_SCH_FQ NET_SCH_FQ_CODEL TCP_CONG_BBR DEFAULT_TCP_CONG; do
              printf "  %-24s = %s\n" "$k" "$(./scripts/config --file out/.config --state "$k" 2>/dev/null || grep -E "^(CONFIG_)?${k}" out/.config | head -1)"
            done
            grep -q '^CONFIG_TCP_CONG_BBR=y' out/.config || echo "::warning title=性能::BBR 这一步没写进去（olddefconfig 之后还有“性能修正”会重开，不阻塞编译）"
            grep -q '^CONFIG_DEFAULT_TCP_CONG="bbr"' out/.config || echo "::warning title=性能::默认拥塞控制这一步没设成 bbr（后面还会再设一次，不阻塞编译）"
          else
            echo "  性能优化已关闭（perf=off）"
          fi

          case "${{ inputs.perf }}" in bbr+o3|bbr+o3+fast) O3_ON=1;; *) O3_ON=0;; esac
          if [ "$O3_ON" = "1" ]; then
            echo "===== 启用 -O3 ====="
            ./scripts/config --file out/.config --enable CC_OPTIMIZE_FOR_PERFORMANCE_O3
            ./scripts/config --file out/.config --disable CC_OPTIMIZE_FOR_PERFORMANCE
            grep -E '^CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE' out/.config || true
          else
            echo "  O3 未启用"
          fi
          case "${{ inputs.perf }}" in bbr+fast|bbr+o3+fast) FAST_ON=1;; *) FAST_ON=0;; esac
          if [ "$FAST_ON" = "1" ]; then
            echo "===== 开机提速：关掉 init_on_alloc / init_stack_all_zero（用一点安全换速度）====="
            ./scripts/config --file out/.config --disable INIT_ON_ALLOC_DEFAULT_ON 2>/dev/null || true
            ./scripts/config --file out/.config --disable INIT_STACK_ALL_ZERO 2>/dev/null || true
            ./scripts/config --file out/.config --enable INIT_STACK_NONE 2>/dev/null || true
            for k in INIT_ON_ALLOC_DEFAULT_ON INIT_ON_FREE_DEFAULT_ON INIT_STACK_ALL_ZERO INIT_STACK_NONE; do
              printf "  %-28s = %s\n" "$k" "$(./scripts/config --file out/.config --state "$k" 2>/dev/null || echo '-')"
            done
            grep -q '^# CONFIG_INIT_ON_ALLOC_DEFAULT_ON is not set' out/.config \
              || echo "::warning title=开机提速::INIT_ON_ALLOC_DEFAULT_ON 没关掉（被别的符号依赖拉回），以 olddefconfig 后的值为准"
            echo "::notice title=开机提速::INIT_ON_ALLOC / INIT_STACK_ALL_ZERO 已按 fast 模式关闭"
          else
            echo "  开机提速未启用（perf=${{ inputs.perf }}）"
          fi
          echo "::notice title=性能::perf=${{ inputs.perf }} / keep_selinux_hide=${{ inputs.keep_selinux_hide }}｜本版=驱动基线（20 个全内建）+ fsync 补丁（无驱动按原厂、无 fast）"

      - name: 容器加速 · Droidspaces/UFW/Fail2ban 网络项（原厂缺的那些）
        shell: bash
        run: |
          set -euxo pipefail
          cd "$BUILD_DIR"
          test -f out/.config || { echo "::error title=容器::out/.config 还没生成"; exit 1; }
          # Droidspaces 官方 GKI 清单里「可选但建议」的那些 + UFW/Fail2ban 需要的 netfilter/ipset。
          # 全部 =y（内建）：我们不装自己的 .ko，写成 m 就等于没有。
          # ★注意：CFS_BANDWIDTH / CGROUP_PIDS 故意不在这里 —— Droidspaces 官方明确说
          #   这两项会改 cgroup/调度器结构体大小、破坏 kABI，原厂 .ko 会拒绝加载 → 无限重启。
          for x in NETFILTER_XT_MATCH_ADDRTYPE NETFILTER_XT_TARGET_REJECT IP_NF_TARGET_REJECT \
                   NETFILTER_XT_TARGET_LOG NETFILTER_XT_TARGET_NFLOG NETFILTER_NETLINK_LOG \
                   NETFILTER_XT_MATCH_RECENT NETFILTER_XT_MATCH_LIMIT NETFILTER_XT_MATCH_HASHLIMIT \
                   NETFILTER_XT_MATCH_COMMENT NETFILTER_XT_MATCH_STATE NETFILTER_XT_MATCH_CONNTRACK \
                   NETFILTER_XT_MATCH_MULTIPORT NETFILTER_XT_MATCH_OWNER NETFILTER_XT_MATCH_MARK \
                   NETFILTER_XT_TARGET_MARK NETFILTER_XT_MATCH_PKTTYPE NETFILTER_XT_MATCH_HL \
                   IP_SET IP_SET_HASH_IP IP_SET_HASH_NET IP_SET_HASH_NETIFACE NETFILTER_XT_SET \
                   NETFILTER_NETLINK_QUEUE BRIDGE_NETFILTER IP6_NF_NAT IP6_NF_TARGET_MASQUERADE; do
            if ./scripts/config --file out/.config --enable "$x" 2>/dev/null; then
              echo "  ON  $x"
            else
              echo "  --  $x（这棵树里没有，跳过）"
            fi
          done
          echo "===== 处理后（olddefconfig 之后还会以最终值核对）====="
          for x in NETFILTER_XT_TARGET_REJECT IP_SET NETFILTER_XT_SET BRIDGE_NETFILTER IP6_NF_NAT; do
            printf "  %-30s = %s\n" "$x" "$(./scripts/config --file out/.config --state "$x" 2>/dev/null || echo '-')"
          done
          echo "::notice title=容器::Droidspaces 必需项（SYSVIPC/POSIX_MQUEUE/IPC_NS/PID_NS/USER_NS/DEVTMPFS/CGROUP_DEVICE/OVERLAY_FS/SECCOMP/VETH/BRIDGE）+ UFW/Fail2ban 网络项已打开；CFS_BANDWIDTH 和 CGROUP_PIDS 按官方警告保持关闭（会破坏 kABI）"
      - name: 关闭签名校验（只关真正的签名项；X509/PKCS7/信任密钥环保持基线）
        shell: bash
        run: |
          set -euxo pipefail
          cd "$BUILD_DIR"
          test -f out/.config || { echo "::error title=签名::out/.config 还没生成"; exit 1; }

          echo "===== A：签名/校验类，本来就该是 n ====="
          for x in MODULE_SIG MODULE_SIG_ALL MODULE_SIG_FORCE MODVERSIONS ASM_MODVERSIONS \
                   KEXEC_SIG KEXEC_SIG_FORCE SYSTEM_BLACKLIST_KEYRING SECONDARY_TRUSTED_KEYRING \
                   INTEGRITY_SIGNATURE IMA EVM SECURITY_LOCKDOWN_LSM \
                   DM_VERITY_VERIFY_ROOTHASH_SIG SIGNED_PE_FILE_VERIFICATION PKCS8_PRIVATE_KEY_PARSER; do
            ./scripts/config --file out/.config --disable "$x" 2>/dev/null || true
          done
          ./scripts/config --file out/.config --set-str MODULE_SIG_KEY "" 2>/dev/null || true

          # ★A31b：B 组（X509 / PKCS7 / 非对称密钥 / 系统信任密钥环 / 数据验证）**不再关闭** ——
          #   它们是导出符号，真机上关掉后有卡屏重启的先例；留着只是几 KB，安全性与原厂一致。
          echo "===== B：验证框架保持基线值（不再关闭）====="

          echo "===== C：这些【绝不能关】（关了会挂分区/掉功能），只做检查 ====="
          for x in DM_VERITY DM_VERITY_FEC FS_VERITY FS_ENCRYPTION SECURITYFS KEYS CRYPTO_RSA CRYPTO_SHA256; do
            printf "  %-28s = %s（必须保持 y）\n" "$x" "$(./scripts/config --file out/.config --state "$x" 2>/dev/null || echo '-')"
          done

          echo "===== 处理后（olddefconfig 之后还会再核对最终值）====="
          for x in MODULE_SIG MODVERSIONS KEXEC_SIG INTEGRITY_SIGNATURE IMA EVM SYSTEM_TRUSTED_KEYRING \
                   SYSTEM_DATA_VERIFICATION X509_CERTIFICATE_PARSER PKCS7_MESSAGE_PARSER \
                   ASYMMETRIC_KEY_TYPE ASYMMETRIC_PUBLIC_KEY_SUBTYPE; do
            printf "  %-30s = %s\n" "$x" "$(./scripts/config --file out/.config --state "$x" 2>/dev/null || echo '-')"
          done
          echo "::notice title=签名::已关 MODULE_SIG/MODVERSIONS/KEXEC_SIG/IMA/EVM/INTEGRITY_SIGNATURE（真正的签名校验）；X509/PKCS7/非对称密钥/信任密钥环保持基线值；DM_VERITY/FS_VERITY/FS_ENCRYPTION/KEYS 保持不动"

      - name: Configure Kernel — 校验 + olddefconfig
        shell: bash
        run: |
          set -Eeuxo pipefail
          # ★ ERR trap：set -e 杀脚本时把「哪一行、什么命令、什么返回码」打出来，
          #   否则只会得到一个 exit code 1，完全看不出死在哪（这次就吃了这个亏）。
          trap 'rc=$?; echo "::error title=步骤内失败::第 $LINENO 行返回 $rc —— 命令：$BASH_COMMAND"' ERR
          # ★ EXIT trap：不管哪种方式退出（exit / unbound variable / 被 kill），
          #   都把「失败前最后 20 行」当注解发出来 —— 这是唯一能远程看到真相的办法。
          trap 'rc=$?; if [ "$rc" != "0" ]; then
                  echo "::error title=退出码 $rc · 失败前最后 20 行::$(tail -20 "$RUNNER_TEMP/config.log" 2>/dev/null | tr "\n" " | " | tail -c 6000)"
                fi' EXIT
          cd "$BUILD_DIR"
          exec >> >(tee -a "$RUNNER_TEMP/config.log") 2>&1
          DEFCONFIG="${DEFCONFIG_USED:-$GITHUB_WORKSPACE/k10x_defconfig}"
          test -f "$DEFCONFIG"
          echo "  本次用的 defconfig: $DEFCONFIG"
          echo "===== 关键配置最终状态（编译前最后一次核对）====="
          for k in MODVERSIONS MODULE_SIG MODULE_SIG_FORCE MODULE_SIG_ALL MODULE_SIG_KEY \
                   LOCALVERSION LOCALVERSION_AUTO KEXEC_SIG KEXEC_SIG_FORCE \
                   CMDLINE CMDLINE_EXTEND CMDLINE_FORCE CMDLINE_FROM_BOOTLOADER \
                   SYSVIPC POSIX_MQUEUE IPC_NS PID_NS DEVTMPFS CGROUP_DEVICE NETFILTER_XT_MATCH_ADDRTYPE \
                   USER_NS IP6_NF_NAT IP6_NF_TARGET_MASQUERADE TMPFS_POSIX_ACL TMPFS_XATTR \
                   NOMOUNT CFS_BANDWIDTH CGROUP_PIDS FAIR_GROUP_SCHED; do
            grep -E "^(# )?CONFIG_${k}[= ]" out/.config || echo "  CONFIG_${k}: 不存在"
          done
          echo
          echo "===== 硬性断言：不成立就直接失败，避免白刷一次机 ====="
          if grep -q '^CONFIG_MODVERSIONS=y' out/.config; then
            echo "::error::CONFIG_MODVERSIONS 还是 y！原厂 .ko 会全部报 module_layout CRC 不符"; exit 1
          fi
          echo "  OK CONFIG_MODVERSIONS=n（CRC 校验已整体跳过）"
          if grep -q '^#ifdef CONFIG_MODVERSIONS' "$BUILD_DIR/include/linux/vermagic.h"; then
            echo "::error::vermagic.h 补丁没生效！vermagic 会少 modversions 一词 -> bad vermagic"; exit 1
          fi
          echo "  OK vermagic.h 已打补丁（vermagic 里仍有 modversions 一词）"
          if grep -q '^CONFIG_MODULE_SIG_FORCE=y' out/.config; then
            echo "::error::CONFIG_MODULE_SIG_FORCE 还是 y！原厂 .ko 没有我们的签名"; exit 1
          fi
          echo "  OK CONFIG_MODULE_SIG_FORCE 已关闭"
          if [ "${{ inputs.module_sig }}" = "off" ]; then
            if grep -q '^CONFIG_MODULE_SIG=y' out/.config; then
              echo "::error::module_sig=off 但 CONFIG_MODULE_SIG 还是 y！签名路径没关掉"; exit 1
            fi
            echo "  OK CONFIG_MODULE_SIG=n（module_sig_check 整体变成 return 0）"
          fi

          echo "===== 签名项最终核对（olddefconfig 之后）====="
          for x in MODULE_SIG MODVERSIONS KEXEC_SIG IMA EVM INTEGRITY_SIGNATURE SYSTEM_TRUSTED_KEYRING SYSTEM_DATA_VERIFICATION; do
            printf "  %-30s = %s\n" "$x" "$(scripts/config --file out/.config --state "$x" 2>/dev/null || echo '-')"
          done
          grep -qE '^CONFIG_MODVERSIONS=y' out/.config && { echo "::error title=签名::MODVERSIONS 还是 y"; exit 1; } || true
          if grep -q '^CONFIG_LOCALVERSION_AUTO=y' out/.config; then
            echo "::error::LOCALVERSION_AUTO 还是 y，vermagic 会多出 -g<hash>"; exit 1
          fi
          echo "  OK CONFIG_LOCALVERSION_AUTO 已关闭"
          LV="$(scripts/config --file out/.config --state LOCALVERSION 2>/dev/null || true)"
          echo "  LOCALVERSION = $LV"
          if [ "$LV" != "${{ inputs.kernel_release_suffix }}" ]; then
            echo "::error::LOCALVERSION 不等于 ${{ inputs.kernel_release_suffix }}，vermagic 对不上"; exit 1
          fi
          echo "  OK vermagic 已对齐"
          for k in SYSVIPC POSIX_MQUEUE IPC_NS PID_NS DEVTMPFS CGROUP_DEVICE NETFILTER_XT_MATCH_ADDRTYPE; do
            if ! grep -q "^CONFIG_${k}=y" out/.config; then
              echo "::error::CONFIG_${k} 不是 y！Droidspaces 跑不起来"; exit 1
            fi
          done
          echo "  OK Droidspaces 必需项全为 y"
          if ! grep -q 'ANDROID_KABI_USE(6, struct sysv_sem sysvsem)' "$BUILD_DIR/include/linux/sched.h"; then
            echo "::error::sched.h 缺 SYSVIPC 的 ABI padding 补丁"; exit 1
          fi
          if ! grep -q 'ANDROID_KABI_USE(1, unsigned long mq_bytes)' "$BUILD_DIR/include/linux/sched/user.h"; then
            echo "::error::user.h 缺 POSIX_MQUEUE 的 ABI padding 补丁"; exit 1
          fi
          echo "  OK kABI 补丁在位（task_struct / user_struct 布局不变）"
          if ! grep -q "^CONFIG_NOMOUNT=y" out/.config; then
            echo "::error::CONFIG_NOMOUNT 不是 y！NoMount 没编进去"; exit 1
          fi
          echo "  OK CONFIG_NOMOUNT=y"
          if grep -q "^CONFIG_CFS_BANDWIDTH=y" out/.config; then
            echo "::error::CONFIG_CFS_BANDWIDTH=y！Droidspaces 官方警告会破坏 kABI -> 无限重启"; exit 1
          fi
          if grep -q "^CONFIG_CGROUP_PIDS=y" out/.config; then
            echo "::error::CONFIG_CGROUP_PIDS=y！Droidspaces 官方警告会破坏 kABI -> 无限重启"; exit 1
          fi
          echo "  OK CFS_BANDWIDTH / CGROUP_PIDS 保持关闭（官方红线）"
          scripts/config --file out/.config --disable QCOM_APR
          scripts/config --file out/.config --disable SOUNDWIRE
          scripts/config --file out/.config --disable DEBUG_INFO
          echo "  → QCOM_APR=$(scripts/config --file out/.config --state QCOM_APR) SOUNDWIRE=$(scripts/config --file out/.config --state SOUNDWIRE)（必须都是 n）"

          export PATH="$CLANG_DIR/bin:$PATH"
          export ARCH=arm64 SUBARCH=arm64
          export CC=clang LD=ld.lld LLVM=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchains/gcc93/bin/aarch64-buildroot-linux-gnu-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/toolchains/gcc32/bin/arm-linux-androideabi-"

          ARCH=arm64 make O=out olddefconfig
          grep -qE '^CONFIG_ARM64=y' out/.config \
            || { echo "::error title=配置::主 olddefconfig 之后 CONFIG_ARM64 不是 y（变成 x86 了）"; head -2 out/.config; exit 1; }
          echo "  ✓ 主 olddefconfig 之后仍是 arm64"

          # ============================================================
          # ★第 23 轮 · 第二层防线：平台符号残废检测★
          # ------------------------------------------------------------
          # 第一层（拷完 defconfig 立刻 olddefconfig）治根；这一层兜底。
          # run#14 编出来的内核 ARCH_QCOM=n（GPU/SCM/iommu 全丢），但
          # make 完全不报错、LD vmlinux.o 照样成功 —— 只有靠这种硬断言才拦得住。
          # 这里在【编译之前】检查，拦下来只花 1 分钟，不会浪费 20 分钟编译。
          # ============================================================
          echo "===== 平台符号完整性检测（第 23 轮）====="
          PLAT_MISSING=""
          # ★第 28 轮修正★ run#20 实测 12 项里 11 项全中，只有 PINCTRL_QCOM 报"无这一行"。
          # 查证：drivers/pinctrl/qcom/Kconfig:4 是 `config PINCTRL_MSM`，
          #       PINCTRL_QCOM 这个符号【根本不存在】—— 是我断言写错了，不是配置残废。
          for s in ARCH_QCOM ARM64 QCOM_SCM QCOM_QMI_HELPERS QCOM_SMEM \
                   MSM_SUBSYSTEM_RESTART MSM_SERVICE_LOCATOR ARM_SMMU \
                   COMMON_CLK_QCOM PINCTRL_MSM PINCTRL_HOLI QCOM_GLINK ION_MSM_HEAPS; do
            if grep -qE "^CONFIG_${s}=y" out/.config; then
              echo "  ✓ $s"
            else
              echo "  ✗ $s = $( { grep -E "^CONFIG_${s}=" out/.config || echo '(无这一行 —— 被 Kconfig 当成未知符号丢掉了)'; } )"
              PLAT_MISSING="$PLAT_MISSING $s"
            fi
          done
          if [ -n "$PLAT_MISSING" ]; then
            echo "::error title=配置残废::这些平台符号不是 y：$PLAT_MISSING"
            echo "  ⇒ Restart config 重置了配置，编出来会是空壳内核。"
            grep -ac 'Restart config' "$RUNNER_TEMP/config.log" 2>/dev/null || true
            exit 1
          fi
          echo "  OK 12 个平台符号全部 =y（GPU/SCM/iommu/时钟、中断控制器都在）"
          echo "  ★确认：CONFIG_ARCH_QCOM=y ⇒ kgsl/qcom_scm/ARM_SMMU 等 541 个高通 .o 会正常编译★"
          echo

          # 第 29 轮：SCS/CFI/LTO 是卡二屏的直接原因，最容易在 Restart 时被静默重置。
          # 原厂 .ko 按 SCS+CFI 编，内核必须一致。这里编译前强制写回并硬断言。
          echo "===== 第 29 轮：SCS / CFI / LTO 安全插桩（防卡二屏）====="
          # LTO 是个 choice，必须显式选中 LTO_CLANG 而不是 LTO_NONE
          ./scripts/config --file out/.config --enable  LTO
          ./scripts/config --file out/.config --enable  LTO_CLANG
          ./scripts/config --file out/.config --enable  THINLTO
          ./scripts/config --file out/.config --disable LTO_NONE
          ./scripts/config --file out/.config --enable  CFI_CLANG
          ./scripts/config --file out/.config --enable  CFI_CLANG_SHADOW
          ./scripts/config --file out/.config --enable  SHADOW_CALL_STACK
          ./scripts/config --file out/.config --enable  SHADOW_CALL_STACK_VMAP 2>/dev/null || true
          ./scripts/config --file out/.config --enable  KALLSYMS
          # 这几项会破坏 SCS/CFI 的前提，必须保持关闭
          ./scripts/config --file out/.config --disable CFI_PERMISSIVE 2>/dev/null || true
          ./scripts/config --file out/.config --disable GCOV_KERNEL    2>/dev/null || true

          grep -E '^CONFIG_(CC_IS_CLANG|CLANG_VERSION|LTO|LTO_NONE|LTO_CLANG|THINLTO|CFI_CLANG|SHADOW_CALL_STACK|KALLSYMS)=' out/.config | sed 's/^/    /' || true
          SCS_MISSING=""
          for k in CC_IS_CLANG LTO LTO_CLANG CFI_CLANG SHADOW_CALL_STACK KALLSYMS; do
            grep -qE "^CONFIG_${k}=y" out/.config || SCS_MISSING="$SCS_MISSING $k"
          done
          if grep -qE '^CONFIG_LTO_NONE=y' out/.config; then
            SCS_MISSING="$SCS_MISSING LTO_NONE(应为n)"
          fi
          if [ -n "$SCS_MISSING" ]; then
            echo "::error title=卡二屏::这些插桩项不是 y：$SCS_MISSING"
            echo "  ⇒ 原厂 /vendor/lib/modules/*.ko 按 SCS+CFI 编译，内核缺了它们会加载失败 -> 卡二屏。"
            echo "  --- 查日志里 Restart config 的次数 ---"
            grep -c 'Restart config' "$RUNNER_TEMP/config.log" 2>/dev/null || true
            exit 1
          fi
          echo "  OK SCS + CFI + LTO 全部就位（这次不会卡二屏）"
          echo "  ★编译产物里应能看到 arch/arm64/kernel/scs.o 和 kernel/cfi.o★"
          echo

          echo "===== Droidspaces / NoMount 最终生效值（olddefconfig 之后）====="
          grep -E '^CONFIG_(SYSVIPC|POSIX_MQUEUE|IPC_NS|PID_NS|DEVTMPFS|NETFILTER_XT_MATCH_ADDRTYPE|USER_NS|IP6_NF_NAT|IP6_NF_TARGET_MASQUERADE|TMPFS_POSIX_ACL|TMPFS_XATTR|NOMOUNT|CFS_BANDWIDTH|CGROUP_PIDS|FAIR_GROUP_SCHED)=' out/.config || true
          echo
          DS_MISSING=""
          for k in SYSVIPC POSIX_MQUEUE IPC_NS PID_NS DEVTMPFS CGROUP_DEVICE NETFILTER_XT_MATCH_ADDRTYPE \
                   USER_NS IP6_NF_NAT IP6_NF_TARGET_MASQUERADE TMPFS_POSIX_ACL TMPFS_XATTR \
                   NOMOUNT; do
            grep -q "^CONFIG_${k}=y" out/.config || DS_MISSING="$DS_MISSING $k"
          done
          if [ -n "$DS_MISSING" ]; then
            echo "::error::olddefconfig 之后这些必需项没生效：$DS_MISSING（依赖不满足被静默丢掉）"
            exit 1
          fi
          echo "  OK Droidspaces + NoMount 必需项在 olddefconfig 之后仍全部 =y"
          for k in CFS_BANDWIDTH CGROUP_PIDS; do
            if grep -q "^CONFIG_${k}=y" out/.config; then
              echo "::error::olddefconfig 之后 CONFIG_${k}=y！破坏 kABI -> 无限重启"; exit 1
            fi
          done
          echo "  OK CFS_BANDWIDTH / CGROUP_PIDS 在 olddefconfig 之后仍未开启"
          if grep -q '^CONFIG_MODVERSIONS=y' out/.config; then
            echo "::error::olddefconfig 之后 CONFIG_MODVERSIONS 又变回 y！原厂 .ko 会全部 CRC 不符 -> 卡二屏"; exit 1
          fi
          if grep -q '^CONFIG_MODULE_SIG_FORCE=y' out/.config; then
            echo "::error::olddefconfig 之后 CONFIG_MODULE_SIG_FORCE 又变回 y！"; exit 1
          fi
          if grep -q '^CONFIG_LOCALVERSION_AUTO=y' out/.config; then
            echo "::error::olddefconfig 之后 CONFIG_LOCALVERSION_AUTO 又变回 y！vermagic 会多出 -g<hash>"; exit 1
          fi
          if [ "${{ inputs.module_sig }}" = "off" ] && grep -q '^CONFIG_MODULE_SIG=y' out/.config; then
            echo "::error::olddefconfig 之后 CONFIG_MODULE_SIG 又变回 y！"; exit 1
          fi
          echo "  OK MODVERSIONS=n / MODULE_SIG_FORCE=n / MODULE_SIG=n / LOCALVERSION_AUTO=n 在 olddefconfig 之后仍成立"
          if [ "${{ inputs.enable_ksu }}" = "true" ]; then
            if ! grep -q '^CONFIG_KSU=y' out/.config; then
              echo "::error::olddefconfig 之后 CONFIG_KSU 不是 y！面具没编进去"; exit 1
            fi

            KSU_MISSING=""
            for k in KSU_SUSFS KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT KSU_SUSFS_SUS_KSTAT \
                     KSU_SUSFS_SUS_MAP KSU_SUSFS_OPEN_REDIRECT KSU_SUSFS_SPOOF_UNAME \
                     KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
                     KSU_SUSFS_ENABLE_LOG KPM KALLSYMS KALLSYMS_ALL THREAD_INFO_IN_TASK; do
              grep -q "^CONFIG_${k}=y" out/.config || KSU_MISSING="$KSU_MISSING $k"
            done
            if [ -n "$KSU_MISSING" ]; then
              echo "::error::olddefconfig 之后这些开关不是 y：$KSU_MISSING"
              echo "----- 相关配置现状 -----"
              grep -E 'CONFIG_(KSU|KPM|KALLSYMS|THREAD_INFO)' out/.config || true
              exit 1
            fi
            echo "  OK KSU=y + susfs 全特性 10 项 + KPM=y + KALLSYMS_ALL=y + THREAD_INFO_IN_TASK=y"

            if ! grep -q "^CONFIG_KSU_SUSFS=y" out/.config; then
              echo "::error::CONFIG_KSU_SUSFS 不是 y！SukiSU Ultra 就选不到 SUSFS_INLINE_HOOK，面具会显示「未集成」"
              exit 1
            fi
            echo "  OK CONFIG_KSU_SUSFS=y -> kernel/Makefile 会打印 using SUSFS_INLINE_HOOK"
            HOOKMISS=""
            for spec in "fs/exec.c:ksu_handle_execveat" "fs/open.c:ksu_handle_faccessat" \
                        "fs/stat.c:ksu_handle_stat" "fs/read_write.c:ksu_handle_sys_read" \
                        "kernel/reboot.c:ksu_handle_sys_reboot" \
                        "kernel/sys.c:ksu_handle_setresuid" \
                        "drivers/input/input.c:ksu_handle_input_handle_event"; do
              hf="${spec%%:*}"; hs="${spec##*:}"
              grep -q "$hs" "$hf" || HOOKMISS="$HOOKMISS $hf($hs)"
            done
            if [ -n "$HOOKMISS" ]; then
              echo "::error::susfs 内联钩子调用点缺失：$HOOKMISS"; exit 1
            fi
            echo "  OK 内联钩子调用点齐全（execveat/faccessat/stat/sys_read/sys_reboot/input）"

            if ! grep -q "^CONFIG_FTRACE_SYSCALLS=y" out/.config; then
              echo "::error::CONFIG_FTRACE_SYSCALLS 不是 y！sys_enter tracepoint 不存在，KSU 编不过"; exit 1
            fi
            echo "  OK FTRACE_SYSCALLS=y（sys_enter/sys_exit tracepoint 可用）"

            test -f "$BUILD_DIR/fs/susfs.c" || { echo "::error::fs/susfs.c 不见了"; exit 1; }
            grep -q 'susfs_is_sdcard_android_data_not_decrypted' "$BUILD_DIR/fs/namespace.c" \
              || { echo "::error::fs/namespace.c 的 susfs 修补丢了"; exit 1; }
            grep -qE 'ksu_handle_faccessat\(int \*dfd, struct filename \*\*filename' "$BUILD_DIR/fs/open.c" \
              || { echo "::error::fs/open.c 的 v2.3.0 调用点丢了"; exit 1; }
            grep -qE 'ksu_handle_stat\(int \*dfd, struct filename \*\*filename' "$BUILD_DIR/fs/stat.c" \
              || { echo "::error::fs/stat.c 的 v2.3.0 调用点丢了"; exit 1; }
            echo "  OK 内核侧 susfs 实现 + v2.3.0 调用点都在"

            if ! grep -qE 'int ksu_handle_faccessat\(int \*dfd, struct filename \*\*filename' \
                 "$BUILD_DIR/KernelSU/kernel/feature/sucompat.h"; then
              echo "::error::面具侧不是 v2.3.0 的 struct filename ** 签名，链接会 undefined reference"
              grep -n 'ksu_handle_faccessat' "$BUILD_DIR/KernelSU/kernel/feature/sucompat.h" || true
              exit 1
            fi
            test -d "$BUILD_DIR/KernelSU/kernel/kpm" || { echo "::error::面具侧 kernel/kpm 不见了"; exit 1; }
            echo "  OK 面具侧签名与 KPM 源码都在"
          else
            echo "  （enable_ksu=false，跳过 KSU / susfs / KPM 核对）"
          fi
          echo "::notice title=配置最终核对::olddefconfig 之后 Droidspaces 必需项 + NoMount + 卡二屏三项全部符合预期"

          DRV_HARD="UFF_FINGERPRINT QTI_POLICY_ENGINE_SENSOR HORAE_THERMAL_SHELL OPLUS_FEATURE_CDT BTFM_SLIM MSM_BT_POWER MSM_RDBG OPLUS_FEATURE_MIDAS_GKI OPLUS_FEATURE_WIFI_SMARTANTENNA OPLUS_KERNEL_SECURE_FEATURE OPLUS_KERNEL_SECURE_GUARD OPLUS_KERNEL_SECURE_KEVENTUPLOAD OPLUS_SECURE OPLUS_SECURE_COMMON OPLUS_SECURE_QCOM OPLUS_FEATURE_MM_FEEDBACK OPLUS_FEATURE_SELINUX_CONTROL_LOG QCA_CLD_WLAN"
          DRV_SOFT="OPLUS_SENSOR_CONSUMER_IR_CORE OPLUS_SENSOR_CONSUMER_IR_QC"
          # ★ 这 20 个驱动必须为 y：pm_suspend / oplus_get_rpm_stats 这些内建代码
          #   在调 get_secureType（OPPO secureguard 提供）。关掉它 -> 链接期
          #   undefined symbol -> 编不出来（A6f 实测就是这个错）。
          # ★ 变量只用本步上面刚赋过的 DRV_HARD + DRV_SOFT —— DRV_KCONFIG 是
          #   上一步赋的，GitHub 每个 step 独立 shell，用它会被 set -u 杀掉（已实测）。
          DMISS=""
          for k in $DRV_HARD $DRV_SOFT; do
            grep -q "^CONFIG_${k}=y" out/.config || DMISS="$DMISS $k"
          done
          if [ -n "$DMISS" ]; then
            echo "::error::olddefconfig 之后这些驱动没生效：$DMISS（缺了 get_secureType 会 undefined）"
            exit 1
          fi
          echo "  OK 20 个驱动在 olddefconfig 之后仍为 y（get_secureType 等符号链接期存在）"
          for s in QCOM_APR SOUNDWIRE; do
            if grep -qE "^CONFIG_${s}=[ym]$" out/.config; then
              echo "::error::$s 不能启用！techpack/audio 自带同名 bus，重复注册 /bus/soundwire 会让 soundwire_init 的 bus_unregister 空指针 -> 卡一屏"
              exit 1
            fi
          done
          echo "  OK QCOM_APR / SOUNDWIRE 均未启用（避开 techpack 的 apr 重名 + soundwire bus 重名）"
          DSOFT=""
          for k in $DRV_SOFT; do
            grep -q "^CONFIG_${k}=y" out/.config || DSOFT="$DSOFT $k"
          done
          if [ -n "$DSOFT" ]; then
            echo "::warning::这些在 .config 里没写成 y：$DSOFT"
            echo "  （GSI/RNDIS_IPA/IPA_CLIENTS_MANAGER/MSM_VIDC_V4L2/DISPLAY_BUILD 是 techpack 的 export，"
            echo "   步骤 9 已把 conf 改成 =y，不依赖 .config；QCA_CLD_WLAN 依赖 DRIVER_REPO 的 qcacld 软链）"
          else
            echo "  OK 另外 8 个也都在 .config 里"
          fi
          for s in MSM_ADSP_LOADER MSM_QDSP6V2_CODECS MSM_QDSP6_APRV2_RPMSG MSM_QDSP6_SSR MSM_QDSP6_PDR MSM_QDSP6_NOTIFIER SND_SOC_MSM_QDSP6V2_INTF SND_SOC_QDSP6V2 SND_EVENT; do
            grep -qE "^[[:space:]]*export CONFIG_${s}=m[[:space:]]*\$" techpack/audio/config/holiauto.conf \
              || { echo "::error::A6e 要求 $s 保持 =m（交给原厂 .ko），但它不是 =m"; exit 1; }
          done
          echo "  OK 9 个 ADSP 命脉 + SND_EVENT 保持 =m（等原厂 .ko 加载）"
          # A6e 路线：techpack 全部保持 =m，交给原厂 .ko（same_magic 补丁已放行它们）
          MTOT=$( { for f in techpack/audio/config/*.conf techpack/camera/config/*.conf \
                   techpack/video/config/*.conf techpack/display/config/*.conf \
                   techpack/dataipa/config/*.conf ; do
            [ -f "$f" ] || continue
            grep -cE '^[[:space:]]*export CONFIG_[A-Z0-9_]+=m[[:space:]]*$' "$f" || true
          done ; } | awk '{s+=$1} END{print s+0}')
          YTOT=$( { for f in techpack/audio/config/*.conf techpack/camera/config/*.conf \
                   techpack/video/config/*.conf techpack/display/config/*.conf \
                   techpack/dataipa/config/*.conf ; do
            [ -f "$f" ] || continue
            grep -cE '^[[:space:]]*export CONFIG_[A-Z0-9_]+=y[[:space:]]*$' "$f" || true
          done ; } | awk '{s+=$1} END{print s+0}')
          # 注意：源码树里原生就有 $YTOT 个 export CONFIG_x=y（例如 camera 的 SPECTRA_ISP=y），
          # 那是原样、不动它。A6e 只要求「第9步没有去动 conf」——而 A6e 的第9步本来就只统计。
          echo "  techpack 全树: =m $MTOT 个 / =y $YTOT 个（原生值，A6e 一个字都没改）"
          [ "$MTOT" -gt 100 ] || { echo "::error::techpack 的 =m 只有 $MTOT 个，conf 被动过了"; exit 1; }
          [ "$YTOT" -ge 50 ] || { echo "::error::techpack 的 =y 只有 $YTOT 个，conf 被动过了"; exit 1; }
          # 声卡 + ADSP 关键件必须保持 =m，才轮得到原厂 .ko
          for s in SND_SOC_HOLI SND_SOC_BOLERO SND_SOC_WCD937X SND_SOC_MSM_STUB SND_EVENT SOUNDWIRE \
                   MSM_ADSP_LOADER MSM_QDSP6_APRV2_RPMSG MSM_QDSP6_SSR MSM_QDSP6_PDR \
                   MSM_QDSP6_NOTIFIER MSM_QDSP6V2_CODECS SND_SOC_MSM_QDSP6V2_INTF SND_SOC_QDSP6V2; do
            grep -qE "^[[:space:]]*export CONFIG_${s}=m[[:space:]]*\$" techpack/audio/config/holiauto.conf \
              || { echo "::error::$s 不是 =m —— A6e 要求全部保持模块化，交给原厂 .ko 加载"; exit 1; }
          done
          echo "  OK 声卡与 ADSP 关键件（14 个）全部保持 =m"
          echo "::notice title=原厂模块路线(A6e)::techpack 全树 =m 共 $MTOT 个、=y 共 $YTOT 个；声卡/ADSP 关键件全部 =m，交给 same_magic 放行后的原厂 .ko"

      - name: Configure Kernel — 对比 defconfig（诊断，不阻塞）
        shell: bash
        run: |
          set -Eeuxo pipefail
          cd "$BUILD_DIR"
          echo "===== KSU / susfs / KPM 配置 ====="
          grep -E 'CONFIG_(KSU|KSU_SUSFS|KPM|KALLSYMS|THREAD_INFO_IN_TASK|KPROBES|KRETPROBES|FTRACE)=' out/.config || true

          echo "===== 被丢弃的符号（=y/=m 但最终没生效）====="
          python3 - "$DEFCONFIG" out/.config <<'PY'
          import re, sys
          def load(p):
              d = {}
              for line in open(p, errors="replace"):
                  m = re.match(r'(CONFIG_[A-Za-z0-9_]+)=(.*)', line.strip())
                  if m:
                      d[m.group(1)] = m.group(2)
              return d
          src, dst = load(sys.argv[1]), load(sys.argv[2])
          lost = sorted(k for k, v in src.items()
                        if v in ("y", "m") and dst.get(k) not in ("y", "m"))
          print("输入 %d 个 =y/=m，输出 %d 个" % (len(src), sum(1 for v in dst.values() if v in ("y", "m"))))
          print("被丢弃 %d 个：" % len(lost))
          for k in lost:
              print("   ", k)
          print("::notice title=被丢弃的符号::" + (" ".join(lost) if lost else "(无)"))
          PY
          echo
          echo "===== 值被改变的符号 ====="
          python3 - "$DEFCONFIG" out/.config <<'PY'
          import re, sys
          def load(p):
              d = {}
              for line in open(p, errors="replace"):
                  line = line.strip()
                  m = re.match(r'(CONFIG_[A-Za-z0-9_]+)=(.*)', line)
                  if m: d[m.group(1)] = m.group(2)
                  m2 = re.match(r'# (CONFIG_[A-Za-z0-9_]+) is not set', line)
                  if m2: d[m2.group(1)] = "n"
              return d
          a, b = load(sys.argv[1]), load(sys.argv[2])
          chg = [(k, a[k], b[k]) for k in a if k in b and a[k] != b[k]]
          print("值变了 %d 个：" % len(chg))
          for k, x, y in chg[:60]:
              print("   %s: %s -> %s" % (k, x, y))
          if len(chg) > 60: print("   ...（还有 %d 个）" % (len(chg) - 60))
          new = [k for k in b if k not in a]
          print("out/.config 里新增 %d 个：" % len(new))
          for k in new[:60]:
              print("   %s=%s" % (k, b[k]))
          if len(new) > 60: print("   ...（还有 %d 个）" % (len(new) - 60))
          PY
          echo
          echo "===== ADSP / remoteproc / PIL 最终值 ====="
          grep -E '^CONFIG_(MSM_PIL|MSM_SUBSYSTEM_RESTART|MSM_PIL_SSR|QCOM_MDT_LOADER|QCOM_SCM|QCOM_SMEM|QCOM_SMP2P|QCOM_GLINK|MSM_GLINK_SSR|MSM_CDSP_LOADER|MSM_ADSPRPC|REMOTEPROC|RPMSG|QCOM_QMI|MSM_SERVICE_|MSM_BOOT_STATS|FW_LOADER)' out/.config | sort || true
          echo
          echo "===== 编译器记录值 ====="
          grep -E '^CONFIG_(CC_IS_CLANG|CLANG_VERSION|GCC_VERSION|LD_IS_LLD|LTO|THINLTO|CFI_CLANG|MODVERSIONS|SHADOW_CALL_STACK)' out/.config | sort || true

          echo "===== 内核版本串 ====="
          ARCH=arm64 make O=out -s kernelrelease || echo "  （kernelrelease 取不到，不阻塞）" 

      - name: 性能修正 · BBR 与 -O3 真正生效（olddefconfig 之后，第 13 轮）
        shell: bash
        run: |
          set -euxo pipefail
          cd "$BUILD_DIR"
          test -f out/.config || { echo "::error title=性能修正::out/.config 不见了"; exit 1; }
          # 修法：在 olddefconfig 之后重新应用一次，并做最终断言。
          case "${{ inputs.perf }}" in
            bbr|bbr+fast|bbr+o3|bbr+o3+fast)
              # ============================================================
              # ★第 15 轮修正★ 为什么之前 BBR 死活不生效：
              #   scripts/config --set-str DEFAULT_TCP_CONG bbr 只是【改文本】。
              #   DEFAULT_TCP_CONG 是 Kconfig 的 choice/string，隐含依赖
              #   TCP_CONG_ADVANCED。改完【必须重跑 olddefconfig】让 Kconfig
              #   重新解析；否则最终生成时会被默认值 "cubic" 覆盖回去。
              #   旧代码改完没重跑 olddefconfig ⇒ 设备上永远是 cubic。
              #
              #   而且旧代码失败只 ::warning 不报错 ⇒ 编译全绿却功能没生效，
              #   从日志里完全看不出来。现在改成【改完重跑 + 硬断言】。
              # ============================================================
              echo "===== 改之前 ====="
              grep -E '^CONFIG_(TCP_CONG_ADVANCED|TCP_CONG_BBR|DEFAULT_TCP_CONG|NET_SCH_FQ|NET_SCH_FQ_CODEL)=' out/.config || true

              # ============================================================
              # ★第 16 轮：真正的修法★
              # ------------------------------------------------------------
              # net/ipv4/Kconfig v5.4 的真实结构（choice，不是 string！）：
              #
              #   choice
              #       prompt "Default TCP congestion control"
              #       default DEFAULT_CUBIC          ← 默认选 Cubic
              #       config DEFAULT_BBR
              #           bool "BBR" if TCP_CONG_BBR=y    ← ★要选这个★
              #       config DEFAULT_CUBIC
              #           bool "Cubic" if TCP_CONG_CUBIC=y
              #   endchoice
              #
              #   ⇒ CONFIG_DEFAULT_TCP_CONG 是 choice 推导出的字符串，
              #     .config 里【没有】这个符号可设！--set-str 是无效的。
              #     必须开 choice 成员：--enable DEFAULT_BBR + --disable DEFAULT_CUBIC
              #
              # run #8 实测证明：只 --set-str + --disable DEFAULT_CUBIC，
              #   olddefconfig 依然把 choice 选回 DEFAULT_CUBIC（有日志：
              #   "CONFIG_DEFAULT_TCP_CONG: bbr -> cubic"）。
              # ============================================================
              ./scripts/config --file out/.config --enable TCP_CONG_ADVANCED
              ./scripts/config --file out/.config --enable TCP_CONG_BBR
              ./scripts/config --file out/.config --enable TCP_CONG_CUBIC
              ./scripts/config --file out/.config --enable NET_SCH_FQ
              ./scripts/config --file out/.config --enable NET_SCH_FQ_CODEL

              # ★核心：开 DEFAULT_BBR，关 DEFAULT_CUBIC（choice 里二选一）★
              ./scripts/config --file out/.config --enable  DEFAULT_BBR
              ./scripts/config --file out/.config --disable DEFAULT_CUBIC

              # 默认 qdisc：也是 choice，成员叫 DEFAULT_FQ
              ./scripts/config --file out/.config --enable  DEFAULT_FQ 2>/dev/null || true
              ./scripts/config --file out/.config --disable DEFAULT_PFIFO_FAST 2>/dev/null || true

              # ------------------------------------------------------------
              # ★第 22 轮：CONFIG_SECTION_MISMATCH_WARN_ONLY★
              # ------------------------------------------------------------
              # run#14 现象：所有 .c 都编过了、vmlinux.o 也链接成功，最后卡在
              #   FATAL: modpost: Section mismatches detected.
              #   Set CONFIG_SECTION_MISMATCH_WARN_ONLY=y to allow them.
              #
              # 报错来自 vmlinux.o 里 update_manifest() / update_telephony_manifest()
              # 引用 .init.data:boot_command_line（就是少了 __initdata 标注），
              # 属于上游新推的 OPPO 代码带来的。这类 section mismatch 不影响运行，
              # 只是 modpost 严格模式把它当致命错。
              #
              # defconfig 现状：
              #   # CONFIG_DEBUG_SECTION_MISMATCH is not set
              #   # CONFIG_SECTION_MISMATCH_WARN_ONLY is not set
              # 设成 y 就降级为警告，内核照常产出。
              # ------------------------------------------------------------
              ./scripts/config --file out/.config --enable SECTION_MISMATCH_WARN_ONLY 2>/dev/null || true

              # ★重跑 olddefconfig 让 Kconfig 解析 choice★
              echo "===== 重跑 olddefconfig（让 Kconfig 接受 DEFAULT_BBR）====="
              ARCH=arm64 make -j"$(nproc)" O=out olddefconfig >/dev/null 2>&1 \
                || { echo "::error title=性能修正::olddefconfig 失败"; exit 1; }

              echo "===== 改之后（olddefconfig 已重跑）====="
              grep -E '^CONFIG_(TCP_CONG_ADVANCED|TCP_CONG_BBR|DEFAULT_BBR|DEFAULT_CUBIC|DEFAULT_TCP_CONG|NET_SCH_FQ|DEFAULT_FQ|DEFAULT_NET_SCH)=' out/.config || true

              # ★硬断言★
              if ! grep -qE '^CONFIG_TCP_CONG_ADVANCED=y' out/.config; then
                echo "::error title=性能修正::TCP_CONG_ADVANCED 没打开"; exit 1
              fi
              if ! grep -qE '^CONFIG_TCP_CONG_BBR=y' out/.config; then
                echo "::error title=性能修正::TCP_CONG_BBR 没编进去"; exit 1
              fi
              if ! grep -qE '^CONFIG_DEFAULT_BBR=y' out/.config; then
                echo "::error title=性能修正::DEFAULT_BBR 没选上（choice 成员没开）"
                grep -n -A14 '^choice' net/ipv4/Kconfig | head -30 || true
                exit 1
              fi
              if grep -qE '^CONFIG_DEFAULT_CUBIC=y' out/.config; then
                echo "::error title=性能修正::DEFAULT_CUBIC 还是 y —— choice 里 Cubic 和 BBR 同时选中了"
                exit 1
              fi
              if ! grep -qE '^CONFIG_DEFAULT_TCP_CONG="bbr"' out/.config; then
                echo "::error title=性能修正::DEFAULT_TCP_CONG 不是 bbr（choice 没生效）"
                echo "  当前值: $( { grep -E '^CONFIG_DEFAULT_TCP_CONG=' out/.config || true; } )"
                echo "  DEFAULT_BBR   = $(./scripts/config --file out/.config --state DEFAULT_BBR)"
                echo "  DEFAULT_CUBIC = $(./scripts/config --file out/.config --state DEFAULT_CUBIC)"
                exit 1
              fi
              echo "  ✓ BBR 四重断言全部通过："
              echo "     TCP_CONG_ADVANCED = $(./scripts/config --file out/.config --state TCP_CONG_ADVANCED)"
              echo "     TCP_CONG_BBR      = $(./scripts/config --file out/.config --state TCP_CONG_BBR)"
              echo "     DEFAULT_BBR       = $(./scripts/config --file out/.config --state DEFAULT_BBR)"
              echo "     DEFAULT_CUBIC     = $(./scripts/config --file out/.config --state DEFAULT_CUBIC)"
              echo "     DEFAULT_TCP_CONG  = $( { grep -E '^CONFIG_DEFAULT_TCP_CONG=' out/.config || true; } | cut -d= -f2)"
              echo "     NET_SCH_FQ        = $(./scripts/config --file out/.config --state NET_SCH_FQ)"
              # ★第 22 轮断言：SECTION_MISMATCH_WARN_ONLY 必须 = y★
              # run#14 就是缺这一项，在 modpost 最后一步挂掉（vmlinux.o 都链接好了）
              SMW="$(./scripts/config --file out/.config --state SECTION_MISMATCH_WARN_ONLY || true)"
              echo "     SECTION_MISMATCH_WARN_ONLY = ${SMW:-未设置}"
              if [ "$SMW" != "y" ]; then
                echo "::error title=开机::SECTION_MISMATCH_WARN_ONLY 不是 y，modpost 会在最后一步 FATAL 退出"
                echo "  当前 state=$SMW"
                echo "  --- defconfig 原值 ---"
                grep -n 'SECTION_MISMATCH' "$BUILD_DIR/arch/arm64/configs/${DEFCONFIG_NAME:-k10x_defconfig}" 2>/dev/null || true
                grep -n 'SECTION_MISMATCH' out/.config || true
                exit 1
              fi
              echo "  ✓ SECTION_MISMATCH_WARN_ONLY=y 已确认（modpost 只警告不致命）"
              case "${{ inputs.perf }}" in
                bbr+o3|bbr+o3+fast)
                  ./scripts/config --file out/.config --enable CC_OPTIMIZE_FOR_PERFORMANCE_O3
                  ./scripts/config --file out/.config --disable CC_OPTIMIZE_FOR_PERFORMANCE
                  grep -q '^CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3=y' out/.config \
                    || echo "::warning title=性能修正::O3 没写进去（编译不受影响，但实际还是 -O2）" 
                  echo "  O3 已确认：$(./scripts/config --file out/.config --state CC_OPTIMIZE_FOR_PERFORMANCE_O3)"
                  ;;
                *) echo "  perf=${{ inputs.perf }}：不开 O3" ;;
              esac
              echo "::notice title=性能修正::TCP_CONG_ADVANCED+BBR 已在 olddefconfig 之后重新打开并断言通过；perf 含 o3 时 -O3 也已确认（设备上 /proc/config.gz 应显示 CONFIG_DEFAULT_TCP_CONG=\"bbr\" 与 CC_OPTIMIZE_FOR_PERFORMANCE_O3=y）"
              ;;
            *)
              echo "  perf=${{ inputs.perf }}，跳过"
              ;;
          esac
      - name: 触摸修复 · ILITEK 首个中断不再丢弃（第 8 轮）
        if: ${{ inputs.enable_ksu }}
        env:
          TPFIX_B64: ""
        run: |
          set -euxo pipefail

          # 现象：亮屏后触摸死 3~4 秒（复现日志已抓到现场）
          #   395.44 speedup_resume end -> ignore_first_irq        <- 第一个中断被丢
          #   （此后 4.3 秒面板一个中断都没有）
          #   399.73 第一个中断来了 -> SPI 读失败 -> 复位 + 重刷固件
          # 真因：ilitek_trigger_reason() 里
          #     if (ilits->ignore_first_irq) { ...; return IRQ_IGNORE; }
          #   直接返回、数据没读 -> 触摸 IC 的 INT 保持高电平；
          #   而该中断是"边沿触发"（/proc/interrupts: msmgpio 22 Edge）-> 之后
          #   再也不产生新中断 -> 触摸一直没反应，直到 ESD 去读才发现 SPI 已错并走恢复。
          # 修法（最小改动）：改成"读一次但不上报"——用 ili_report_handler() 把数据读掉，
          #   让 IC 拉低 INT，数据本身丢弃（不会产生幻触）。
          DRIVER_DIR="$GITHUB_WORKSPACE/devicetree"
          TP="$DRIVER_DIR/vendor/oplus/kernel/touchpanel/oplus_touchscreen_v2/ilitek/ilitek7807s/ili7807s_qcom.c"
          test -f "$TP" || { echo "::error title=A17::找不到触摸驱动 $TP"; exit 1; }
          echo "$TPFIX_B64" | base64 -d > /tmp/tp_fix.py
          test -s /tmp/tp_fix.py || { echo "::error title=A17::补丁脚本是空的"; exit 1; }
          DRIVER_DIR="$DRIVER_DIR" python3 /tmp/tp_fix.py
          grep -q 'K10x/A17' "$TP"
          grep -q '(void)ili_report_handler();' "$TP"
          echo "::notice title=A17（触摸）::ignore_first_irq 已改为读一次再丢弃，亮屏后不再出现 4 秒无中断窗口。"

      - name: 容器/模拟器加速 · fsync（FUTEX_WAIT_MULTIPLE op31，第 12 轮）
        shell: bash
        run: |
          set -euxo pipefail
          echo "$FSYNCFIX_B64" | base64 -d > /tmp/fsync_fix.py
          test -s /tmp/fsync_fix.py || { echo "::error title=fsync::补丁脚本是空的"; exit 1; }
          python3 /tmp/fsync_fix.py "$BUILD_DIR"
          TP="$BUILD_DIR/kernel/futex.c"
          TH="$BUILD_DIR/include/uapi/linux/futex.h"
          grep -q 'FUTEX_WAIT_MULTIPLE' "$TH"      || { echo "::error title=fsync::uapi 没补上"; exit 1; }
          grep -q 'struct futex_wait_block' "$TH"  || { echo "::error title=fsync::uapi 结构体没补上"; exit 1; }
          grep -q 'case FUTEX_WAIT_MULTIPLE' "$TP" || { echo "::error title=fsync::do_futex 分支没补上"; exit 1; }
          grep -q 'do_futex_wait_multiple' "$TP"   || { echo "::error title=fsync::实现没补上"; exit 1; }
          echo "  实现文件 kernel/futex.c 现在 $(wc -l < "$TP") 行"
          echo "::notice title=fsync::FUTEX_WAIT_MULTIPLE(op 31) 已按 kakra 5.4/steam-patches 的版本补进 kernel/futex.c —— Winlator/Wine 的 WINEFSYNC 可用；不调它的程序完全不受影响"
      - name: Build Kernel Image and DTBs
        shell: bash
        run: |
          set -euxo pipefail
          cd "$BUILD_DIR"

          export PATH="$CLANG_DIR/bin:$PATH"
          export ARCH=arm64 SUBARCH=arm64
          export CC=clang LD=ld.lld LLVM=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchains/gcc93/bin/aarch64-buildroot-linux-gnu-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/toolchains/gcc32/bin/arm-linux-androideabi-"

          export KCFLAGS="-Wno-error -Wno-strict-prototypes -Wno-error=strict-prototypes -Wno-error=implicit-function-declaration -Wno-error=implicit-int -Wno-error=return-type -Wno-error=incompatible-pointer-types"
          TARGETS="Image.gz Image"

          # ============================================================
          # ★第 30 轮 · 编译期配置防覆盖（卡二屏最后一道保险）★
          # ------------------------------------------------------------
          # run#21 实测时间线：
          #   15:52:07  .config 核对：SHADOW_CALL_STACK=y  LTO_CLANG=y  CFI_CLANG=y  ✓
          #   15:52:24  make -j4 -k O=out ... Image.gz Image     ← 开始编译
          #   15:52:27  drivers/soc/oplus/system/cmdline_parser/Kconfig:34:warning:
          #             ignoring unsupported character          ← CRLF 又被解析
          #   15:52:28  * Restart config...                     ← ★Kconfig 重跑★
          #             Clang Shadow Call Stack (SHADOW_CALL_STACK) [N/y/?] (NEW)
          #             Error in reading or end of file.       ⇒ N
          #             Link-Time Optimization (LTO) choice[1-2?]:
          #             > 1. None (LTO_NONE)                   ⇒ LTO_NONE
          #   结果：scs.o / cfi.o 一次都没编 ⇒ 原厂 /vendor .ko 加载失败 ⇒ 卡二屏
          #   （run#7 能开机：scs.o 编了 2 次、cfi.o 编了 1 次）
          #
          # 机理：make 发现 .config 比 include/config/auto.conf 新 ⇒ 触发 syncconfig
          #       ⇒ 而 syncconfig 遇到 CRLF 解析异常就走 Restart，stdin=/dev/null
          #       让每个提问取默认值 ⇒ 好配置被覆盖。
          #
          # 两道保险：
          #  ①编译前主动 syncconfig 一次，让 auto.conf 与 .config 时间戳对齐，
          #     make 就不会在编译中途再跑 Kconfig；
          #  ②编译后立刻验 auto.conf / autoconf.h 里的关键项，一旦被改直接失败，
          #     不让一个「静默降级」的内核溜进产物。
          # ============================================================
          echo "===== 第 30 轮：编译前主动 syncconfig（对齐时间戳，防编译中途 Restart）====="
          for kf in $(find . -name 'Kconfig*' -type f -not -path './out/*' 2>/dev/null); do
            grep -qU $'\r' "$kf" 2>/dev/null && sed -i 's/\r$//' "$kf"
          done
          echo "  再次去 CR 完成"
          ARCH=arm64 make O=out syncconfig > "$RUNNER_TEMP/syncconfig.log" 2>&1 || \
            echo "  （syncconfig 返回非 0，看 log：$(grep -c 'Restart config' "$RUNNER_TEMP/syncconfig.log" || true) 次 Restart）"
          echo "  syncconfig 后 .config 关键项："
          grep -E '^CONFIG_(SHADOW_CALL_STACK|LTO_CLANG|CFI_CLANG|KALLSYMS|ARCH_QCOM)=' out/.config | sed 's/^/    /' || true
          echo "  auto.conf 关键项："
          grep -E '^CONFIG_(SHADOW_CALL_STACK|LTO_CLANG|CFI_CLANG|ARCH_QCOM)=' out/include/config/auto.conf 2>/dev/null | sed 's/^/    /' || echo "    （auto.conf 还没有）"
          PRE_SCS_OK=1
          for k in SHADOW_CALL_STACK LTO_CLANG CFI_CLANG KALLSYMS ARCH_QCOM; do
            grep -qE "^CONFIG_${k}=y" out/.config || { echo "::error title=卡二屏::syncconfig 后 $k 不是 y"; PRE_SCS_OK=0; }
          done
          [ "$PRE_SCS_OK" = 1 ] || exit 1

          EXTRA_KSU_VARS=""
          if [ -n "${{ inputs.ksu_manager_package }}" ]; then
            EXTRA_KSU_VARS="$EXTRA_KSU_VARS KSU_MANAGER_PACKAGE=${{ inputs.ksu_manager_package }}"
            echo "::notice title=KernelSU 面具包名::${{ inputs.ksu_manager_package }}（按包名直接认，跳过 /data/app 扫描）"
          else
            echo "::notice title=KernelSU 面具包名::（未指定，走扫描+签名校验；若面具显示未集成就填上）"
          fi
          if [ -n "${{ inputs.ksu_version_override }}" ]; then
            EXTRA_KSU_VARS="$EXTRA_KSU_VARS KSU_VERSION_OVERRIDE=${{ inputs.ksu_version_override }}"
            echo "::notice title=KernelSU 版本号::★强制上报 ${{ inputs.ksu_version_override }}★（覆盖按 git 提交数算的值）"
            echo "  原因：KSU_VERSION = 40000 + MAINCNT - 2815，MAINCNT 是【上游 KernelSU 仓库】的提交数，"
            echo "        上游一更新这个数就漂移 ⇒ 与已装管理器 versionCode 失配 ⇒ KPM 页选文件没反应/ANR。"
            echo "        钉死成管理器的 versionCode 即匹配。"
          else
            echo "::notice title=KernelSU 版本号::（自动，按 git 提交数算）"
            echo "  ⚠ 若管理器 KPM 页选文件没反应或卡死，就是这个数和管理器 versionCode 对不上。"
            echo "     解决：重新 dispatch 并填 ksu_version_override = 管理器的 versionCode"
          fi
          if [ "${{ inputs.build_dtbs }}" = "true" ]; then
            TARGETS="$TARGETS dtbs"
          fi

          ann() {  # $1=标题  $2=文件
            local msg
            msg=$(sed -e 's/%/%25/g' -e 's/\r//g' "$2" | awk 'BEGIN{ORS=""} {print $0 "%0A"}')
            echo "::error title=$1::${msg}"
          }
          mkdir -p "$HOME/ccache-bin"
          for t in clang clang++ gcc g++ cc c++; do
            ln -sfn "$(command -v ccache)" "$HOME/ccache-bin/$t"
          done
          export PATH="$HOME/ccache-bin:$PATH"
          ccache -z || true
          echo "ccache: $(ccache --version | head -1)"
          echo "CCACHE_DIR=$CCACHE_DIR  存在? $([ -d "$CCACHE_DIR" ] && echo yes || echo no)"
          echo "PATH 前两项: $(echo "$PATH" | cut -d: -f1,2)"
          echo "clang 解析到: $(command -v clang)"
          echo "ccache 解析到: $(command -v ccache)"
          # ============================================================
          # ★第 20 轮：编译加 -k（keep going）★
          # ------------------------------------------------------------
          # 之前用 make -j 不带 -k，make 在【第一个】出错的目录就停，
          # 所以每次日志只暴露 1-2 个错误，只能一轮轮打地鼠（run#9/#11/#12）。
          # 加 -k 后 make 会继续编其他不依赖失败目标的目录，一次把【所有】
          # 编译错误都吐出来，一轮就能修完。
          # 代价：失败时多花几分钟把能编的编完，但省下好几轮 25 分钟。
          # ============================================================
          if ! make -j"$(nproc)" -k O=out DISABLE_WRAPPER=1 $EXTRA_KSU_VARS $TARGETS 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            echo "========== 编译失败（-k 模式，已尽量收集全部错误）=========="
          # ★列出【所有】不同的报错文件，而不是只取前 8 行★
          grep -anE 'ld\.lld: error|ld: error|undefined symbol|fatal error:|: error:|forbidden warning' \
            "$RUNNER_TEMP/build.log" > "$RUNNER_TEMP/errs_all.txt" || true
          echo "===== 全部报错文件清单（去重）====="
          grep -oE '[a-zA-Z0-9_/.+-]+\.(c|h|S):[0-9]+' "$RUNNER_TEMP/errs_all.txt" 2>/dev/null \
            | sed 's/:[0-9]*$//' | sort -u | head -60 || true
          echo "===== 报错总数: $(wc -l < "$RUNNER_TEMP/errs_all.txt") 行 ====="
          head -8 "$RUNNER_TEMP/errs_all.txt" > "$RUNNER_TEMP/errs.txt" || true
          if [ -s "$RUNNER_TEMP/errs.txt" ]; then
            cut -d: -f1 "$RUNNER_TEMP/errs.txt" | head -2 | while read -r L; do
              S=$((L-25)); [ "$S" -lt 1 ] && S=1
              echo "===== 第 $L 行上下文 ====="
              sed -n "${S},$((L+5))p" "$RUNNER_TEMP/build.log"
              echo
            done >> "$RUNNER_TEMP/errs.txt" || true
          fi
          if [ ! -s "$RUNNER_TEMP/errs.txt" ]; then
            grep -anE 'Error [0-9]+' "$RUNNER_TEMP/build.log" | grep 'make\[' | head -3 | cut -d: -f1 | \
            while read -r L; do
              S=$((L-60)); [ "$S" -lt 1 ] && S=1
              echo "===== 第 $L 行前 60 行 ====="
              sed -n "${S},${L}p" "$RUNNER_TEMP/build.log"
              echo
            done > "$RUNNER_TEMP/errs.txt" || true
          fi
            ann "编译报错行" "$RUNNER_TEMP/errs.txt"
            tail -c 1800 "$RUNNER_TEMP/build.log" > "$RUNNER_TEMP/tail.txt"
            ann "日志尾部" "$RUNNER_TEMP/tail.txt"
            exit 1
          fi

          # ★第 30 轮 · 编译后硬核对：确保没有「静默降级」★
          echo "===== 第 30 轮：编译后核对 SCS / CFI / LTO 真的生效 ====="
          SCS_OBJS=0
          grep -qE 'CC +arch/arm64/kernel/scs\.o' "$RUNNER_TEMP/build.log" && SCS_OBJS=$((SCS_OBJS+1))
          grep -qE 'CC +kernel/scs\.o'          "$RUNNER_TEMP/build.log" && SCS_OBJS=$((SCS_OBJS+1))
          grep -qE 'CC +kernel/cfi\.o'          "$RUNNER_TEMP/build.log" && SCS_OBJS=$((SCS_OBJS+1))
          echo "  scs.o/cfi.o 编译次数 = $SCS_OBJS（run#7 能开机=3；run#21 卡二屏=0）"
          echo "  --- 编译期有没有再跑 Restart config ---"
          RC_CNT="$(grep -c 'Restart config' "$RUNNER_TEMP/build.log" 2>/dev/null || true)"
          RC_CNT="${RC_CNT:-0}"
          echo "  Restart config 次数 = $RC_CNT（必须 0）"
          echo "  --- auto.conf 现在的值 ---"
          grep -E '^CONFIG_(SHADOW_CALL_STACK|LTO_CLANG|CFI_CLANG|KALLSYMS|ARCH_QCOM)=' out/include/config/auto.conf 2>/dev/null | sed 's/^/    /' || echo "    （读不到 auto.conf）"
          POST_BAD=""
          for k in SHADOW_CALL_STACK LTO_CLANG CFI_CLANG KALLSYMS ARCH_QCOM; do
            grep -qE "^CONFIG_${k}=y" out/.config || POST_BAD="$POST_BAD $k"
          done
          grep -qE '^CONFIG_LTO_NONE=y' out/.config && POST_BAD="$POST_BAD LTO_NONE"
          [ "$SCS_OBJS" -ge 1 ] || POST_BAD="$POST_BAD scs/cfi.o没编"
          if [ -n "$POST_BAD" ]; then
            echo "::error title=卡二屏::编译后核对失败：$POST_BAD"
            echo "  ⇒ 这份 Image 刷进去必然卡二屏（原厂 /vendor/lib/modules/*.ko 是按 SCS+CFI 编的）"
            echo "  ⇒ 证据：编译期 Restart config $RC_CNT 次"
            exit 1
          fi
          echo "  OK SCS + CFI 真的编进了内核（这次刷进去不会卡二屏）"
          echo

          if [ "${{ inputs.enable_ksu }}" = "true" ]; then
            KVLINE="$(grep -aiE 'version[: ]+[0-9]{4,}' "$RUNNER_TEMP/build.log" | grep -aiE 'ksu|sukisu' | tail -3 | tr '\n' ' ' || true)"
            KCNT="$(git -C "$BUILD_DIR/KernelSU" rev-list --count HEAD 2>/dev/null || echo '取不到')"
            KHEAD="$(git -C "$BUILD_DIR/KernelSU" rev-parse --short HEAD 2>/dev/null || echo '取不到')"
            echo "  KernelSU 仓库: HEAD=$KHEAD 提交数=$KCNT"
            echo "  日志里的版本行: ${KVLINE:-（没找到）}"
            if [ "$KCNT" = "取不到" ] || [ "$KCNT" -lt 100 ] 2>/dev/null; then
              echo "::error::KernelSU 不是完整 git 仓库（提交数 $KCNT），版本号会退化，面具必定显示「未集成」"
              exit 1
            fi
            KVNUM="$(echo "$KVLINE" | grep -oE '[0-9]{4,}' | sort -rn | head -1)"
            if [ -z "$KVLINE" ]; then
              echo "::warning title=KSU 版本::编译日志里没有版本行，KSU 可能根本没编进去"
            elif [ -z "$KVNUM" ] || [ "$KVNUM" -lt 32513 ]; then
              echo "::error::KSU 版本号是 $KVNUM，低于面具要求的最低值 32513！面具会拒绝认领内核。多半是 KernelSU 不是完整克隆（缺 main 分支）导致版本号塌成 13000"
              grep -aE 'version:|rev-list|LOCAL_COUNT' "$RUNNER_TEMP/build.log" | head -5 || true
              exit 1
            else
              echo "::notice title=KSU 版本::$KVLINE | main 提交数 $KCNT ($KHEAD) —— 版本号 ≥32513，通过"
            fi
            if grep -qaF -- '-- KPM is enabled' "$RUNNER_TEMP/build.log"; then
              echo "::notice title=KPM::编译日志里出现 '-- KPM is enabled'，KPM 已编入"
            else
              echo "::warning title=KPM::编译日志里没有 '-- KPM is enabled'，请确认 CONFIG_KPM=y"
            fi
            SUSN="$(grep -acE 'fs/susfs\.o|susfs\.c' "$RUNNER_TEMP/build.log" || echo 0)"
            echo "::notice title=susfs 编译证据::日志里 susfs 相关行 $SUSN 条"
          fi
          echo "========== ccache 统计 =========="
          ccache -s || true
          echo "CCACHE_DIR 内容: $(ls -A "$CCACHE_DIR" 2>/dev/null | head -5 || echo '(空)')"

          test -s out/arch/arm64/boot/Image.gz
          ls -lh out/arch/arm64/boot/Image.gz

          echo "===== 编出来的 DTB / DTBO ====="
          find out/arch/arm64/boot/dts/vendor \( -name '*.dtb' -o -name '*.dtbo' \) 2>/dev/null | head -50 || true

      - name: KPM · 给 Image 注入 kpimg（SukiSU KernelPatch，面具才会出现 KPM 界面）
        if: ${{ inputs.enable_ksu }}
        continue-on-error: true
        run: |
          set -euxo pipefail

          # ★★★ 这个工具的真实用法（我把 SukiSU_KernelPatch_patch/patch/main.cpp 读完了）★★★
          #   patch_linux 是个 C++ 壳，它【忽略所有命令行参数】，内部固定执行：
          #       kptools -p -s 123 -i Image -k <壳里内嵌的 kpimg> -o oImage
          #   而且 main() 第一件事就是 check_file_exists("Image")
          #   —— 当前工作目录里必须有一个**正好叫 Image** 的文件，否则直接 exit 1。
          #   产物固定叫 **oImage**（不是 -o 指定的名字），superkey 固定 123。
          #   A7 那次我在 $BUILD_DIR 里跑，那儿没有 Image，所以它 exit 1、什么都没产出 —— 就是这个原因。
          #   所以：cd 进放 Image 的目录 → 不带参数地跑 → 收 oImage。
          #
          #   壳不检查内部 kptools 的退出码（waitpid 后直接 return 0），
          #   所以判断成功只能靠"oImage 是否存在且比 Image 大"。
          KT="$GITHUB_WORKSPACE/kpm-tools"
          mkdir -p "$KT"
          PATCH_SHA=1bd00563e9d8fbbd11a16c0c1c59c5add406e6c5c92557def50f93d6f0aebe2d
          curl -fsSL --retry 3 -o "$KT/patch_linux" \
            "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/main/kpm/patch_linux"
          echo "$PATCH_SHA  $KT/patch_linux" | sha256sum -c -
          chmod +x "$KT/patch_linux"

          KD="$BUILD_DIR/out/arch/arm64/boot"
          cd "$KD"
          test -s Image || { echo "::error title=KPM::找不到 $KD/Image"; exit 1; }
          [ -s Image.gz ] || gzip -9 -c Image > Image.gz
          cp -f Image  Image.nokpm
          cp -f Image.gz Image.gz.nokpm
          echo "原版 Image = $(stat -c%s Image) 字节"
          echo "magic(offset 56) = $(dd if=Image bs=1 skip=56 count=4 2>/dev/null | tr -d '\000' || true)"

          rm -f oImage
          set +e
          "$KT/patch_linux" > "$RUNNER_TEMP/kpm-patch.log" 2>&1
          PRC=$?
          set -e
          echo "壳退出码 = $PRC（这个数本身不可信，壳不看内部结果）"
          echo "==================== kpm-patch.log 全文 ===================="
          cat "$RUNNER_TEMP/kpm-patch.log" || true
          echo "=========================================================="

          KPM_OK=no
          if [ -s oImage ] && [ "$(stat -c%s oImage)" -gt "$(stat -c%s Image)" ]; then
            KPM_OK=yes
          fi

          if [ "$KPM_OK" = "yes" ]; then
            SZ_NEW=$(stat -c%s oImage); SZ_OLD=$(stat -c%s Image)
            mv -f oImage Image
            gzip -9 -c Image > Image.gz
            echo "KPMPATCH=ok"  >> "$GITHUB_ENV"
            echo "::notice title=KPM 打补丁成功::Image 从 $SZ_OLD 涨到 $SZ_NEW 字节，Image.gz=$(stat -c%s Image.gz) 字节。superkey 固定 123（工具内写死）。刷这一版，面具设置里应出现 KPM；未打补丁的原版在同目录 *.nokpm。"
          else
            rm -f oImage
            echo "KPMPATCH=fail" >> "$GITHUB_ENV"
            MSG="$(tail -c 2500 "$RUNNER_TEMP/kpm-patch.log" 2>/dev/null | tr '\n' '|' | tr -d '\r' | sed -e 's/%/%25/g' | tail -c 3000)"
            echo "::error title=KPM 打补丁失败（内核侧）::壳退出码=$PRC；oImage $([ -e oImage ] && echo 存在 || echo 不存在)；日志尾部：${MSG:-（空）}"
            echo "本次产出的是未打补丁的 Image / Image.gz（能正常刷，只是面具里没有 KPM）。"
          fi

          ls -lh "$KD" | head -20
      - name: 诊断 · 列出内建对象的重名符号（仅编译失败时自动跑）
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          cd "$BUILD_DIR" 2>/dev/null || { echo "没有 BUILD_DIR，跳过"; exit 0; }
          for d in "$CLANG_DIR/bin" "$GITHUB_WORKSPACE"/toolchains/clang-repo/*/bin "$GITHUB_WORKSPACE"/toolchains/clang*/bin ; do
            [ -d "$d" ] && export PATH="$d:$PATH"
          done
          NM=$(command -v llvm-nm || command -v nm || echo "")
          if [ -z "$NM" ]; then echo "::warning::找不到 nm，跳过重名符号诊断"; exit 0; fi
          echo "===== 扫描 out 下所有 built-in.a 的全局定义符号 ====="
          LIST="$RUNNER_TEMP/sym.txt"
          : > "$LIST"
          find out -name 'built-in.a' -print0 2>/dev/null | while IFS= read -r -d '' a; do
            "$NM" --defined-only --extern-only --no-demangle "$a" 2>/dev/null \
              | awk -v A="$a" 'NF>=3 && $2 ~ /^[A-Za-z]$/ {print $3"\t"A}'
          done >> "$LIST"
          TOTAL=$(wc -l < "$LIST" | tr -d ' ')
          echo "  共 $TOTAL 条全局定义"
          DUP=$(cut -f1 "$LIST" | sort | uniq -d | grep . || true)
          ND=$(printf '%s\n' "$DUP" | grep -c . || true)
          if [ "${ND:-0}" -eq 0 ]; then
            echo "::notice title=重名符号诊断::没有重名全局符号 —— 说明这次失败不是符号冲突引起的"
            exit 0
          fi
          echo "===== 发现 $ND 个重名全局符号 ====="
          printf '%s\n' "$DUP" | while read -r s; do
            [ -n "$s" ] || continue
            echo "★ $s"
            awk -F'\t' -v S="$s" '$1==S{print "    "$2}' "$LIST"
          done | head -400
          SYMS=$(printf '%s\n' "$DUP" | tr '\n' ' ')
          echo "::error title=重名符号诊断::$ND 个重名全局符号：$SYMS"

      - name: 核对驱动确实保持模块化（不是内建）
        continue-on-error: true
        if: ${{ inputs.enable_ksu }}
        shell: bash
        run: |
          set -uo pipefail
          cd "$BUILD_DIR"
          echo "===== A6e 模块化核对 ====="

          OK=1
          CONF="techpack/audio/config/holiauto.conf"
          test -f "$CONF" || { echo "::error::找不到 $CONF"; exit 1; }
          KEY="SND_SOC_HOLI SND_SOC_BOLERO SND_SOC_WCD937X SND_SOC_MSM_STUB SND_EVENT SOUNDWIRE MSM_ADSP_LOADER MSM_QDSP6_APRV2_RPMSG MSM_QDSP6_SSR MSM_QDSP6_PDR MSM_QDSP6_NOTIFIER MSM_QDSP6V2_CODECS SND_SOC_MSM_QDSP6V2_INTF SND_SOC_QDSP6V2"
          for s in $KEY; do
            if grep -qE "^[[:space:]]*export CONFIG_${s}=m[[:space:]]*$" "$CONF"; then
              echo "  OK $s =m"
            else
              ACT=$(grep -E "CONFIG_${s}=" "$CONF" | head -1 || true)
              echo "  ✗ $s 不是 =m（实际：${ACT:-没这一行}）"
              OK=0
            fi
          done

          echo "===== same_magic 补丁核对 ====="
          CN=$(grep -c 'K10x A6e' kernel/module.c 2>/dev/null || true)
          echo "  module.c 里 K10x A6e 标记: $CN（应为 2）"
          [ "$CN" -eq 2 ] || { echo "  ✗ same_magic 补丁份数不对"; OK=0; }
          if grep -q 'return strcmp(amagic, bmagic) == 0;' kernel/module.c 2>/dev/null; then
            echo "  ✗ 还有整串比对残留"
            OK=0
          fi

          echo "===== 产物 ====="
          YO=$(find out/techpack/audio -name '*.o' 2>/dev/null | wc -l)
          NO=$(find out/techpack/audio -name '*.ko' 2>/dev/null | wc -l)
          echo "  techpack/audio: .o=$YO  .ko=$NO（A6e 只编 Image，不编模块，.ko 应为 0）"
          ls -la out/arch/arm64/boot/Image.gz 2>/dev/null || echo "  ⚠ Image.gz 还没生成"

          if [ "$OK" -eq 1 ]; then
            echo "::notice title=模块化核对::14 个关键件全部 =m（交给原厂 .ko）；same_magic 补丁在位（2 份）"
          else
            echo "::warning title=模块化核对未全过::有项目没对上，但不阻塞出包 —— 内核已编译，Image.gz 已生成。"
          fi

      - name: Clone and Configure AnyKernel3
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          if [ ! -f "$BUILD_DIR/out/arch/arm64/boot/Image.gz" ]; then
            gzip -9 -c "$BUILD_DIR/out/arch/arm64/boot/Image" > "$BUILD_DIR/out/arch/arm64/boot/Image.gz"
            echo "Image.gz 不存在，已现场压缩生成"
          fi
          cp "$BUILD_DIR/out/arch/arm64/boot/Image.gz" AnyKernel3/Image.gz

          sed -i 's/^do\.devicecheck=.*/do.devicecheck=0/'   AnyKernel3/anykernel.sh
          sed -i 's/^do\.modules=.*/do.modules=0/'           AnyKernel3/anykernel.sh
          sed -i 's/^BLOCK=.*/BLOCK=boot/'                   AnyKernel3/anykernel.sh
          sed -i 's/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=auto/' AnyKernel3/anykernel.sh

          echo "===== anykernel.sh 关键项 ====="
          grep -E '^(do\.devicecheck|do\.modules|do\.systemless|do\.cleanup|BLOCK|IS_SLOT_DEVICE|RAMDISK_COMPRESSION)=' AnyKernel3/anykernel.sh


      - name: Package AnyKernel3
        shell: bash
        run: |
          set -euxo pipefail
          cd AnyKernel3
          ZIPNAME="OPPO_K10x_A31_optimized_SukiSU_5.4.254_$( [ "${{ inputs.enable_ksu }}" = "true" ] && echo KSU || echo NoKSU )_NM_DS$( [ "true" = "true" ] && echo _DIAG || echo ).zip"
          echo "ZIPNAME=$ZIPNAME" >> "$GITHUB_ENV"
          echo "::notice title=AK3 包名::$ZIPNAME"
          zip -r9 "$GITHUB_WORKSPACE/$ZIPNAME" . \
            -x '.git/*' -x '.git/**' -x 'README.md' -x 'patch/*'

      - name: Upload Kernel Image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OPPO-K10x-A7-Image-gz
          path: |
            ${{ env.BUILD_DIR }}/out/arch/arm64/boot/Image
            ${{ env.BUILD_DIR }}/out/arch/arm64/boot/Image.gz
            ${{ env.BUILD_DIR }}/out/arch/arm64/boot/Image.nokpm
            ${{ env.BUILD_DIR }}/out/arch/arm64/boot/Image.gz.nokpm
          if-no-files-found: error
          retention-days: 7

      - name: Upload AnyKernel3 Package
        uses: actions/upload-artifact@v4
        with:
          name: OPPO-K10x-A6
          path: ${{ env.ZIPNAME }}
          if-no-files-found: error
          retention-days: 7

      - name: 汇总编译日志（发成注解，外部可直接读）
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/build.log"
          if [ ! -f "$LOG" ]; then echo "::warning title=无编译日志::build.log 不存在"; exit 0; fi
          echo "===== build.log 共 $(wc -l < "$LOG") 行 ====="

          ERR="$(grep -nE ': error:|fatal error:|undefined symbol|forbidden warning|Error [0-9]+$' "$LOG" | head -60 || true)"
          if [ -n "$ERR" ]; then
            echo "::warning title=编译错误或致命警告::$(echo "$ERR" | head -c 55000)"
          else
            echo "::notice title=编译错误::(无)"
          fi

          WC="$(grep -cE 'warning:' "$LOG" || true)"
          WS="$(grep -E 'warning:' "$LOG" | head -30 || true)"
          echo "::notice title=警告共 ${WC} 条（前30）::$WS"

          echo "::notice title=关键驱动编译记录::$(grep -E '^[[:space:]]*CC[[:space:]]+.*[/_](adsprpc|apr|q6v5|glink|smem|smp2p|remoteproc|mdt_loader|cdsp|qcom_scm|msm_pil|subsystem_ramdump|scm)' "$LOG" | head -40 || echo '(无)')"

          CFG="$RUNNER_TEMP/config.log"
          if [ -f "$CFG" ]; then
            echo "::notice title=配置阶段符号自检::$(grep -E '^\s+[✓✗] CONFIG_' "$CFG" | tr -d ' ' | head -20 || echo '(无)')"
            echo "::notice title=配置阶段版本串/来源::$(grep -E '配置来源|合并后 out/.config 行数|源码 5\.4' "$CFG" | head -6 || echo '(无)')"
            echo "::notice title=配置阶段报错::$(grep -nE '::error::|Error [0-9]+|No rule to make' "$CFG" | head -10 || echo '(无)')"
          else
            echo "::warning title=配置日志::config.log 不存在"
          fi

          CFGF="$BUILD_DIR/out/.config"
          if [ -f "$CFGF" ]; then
            echo "::notice title=内核命令行最终值::$(grep -E '^CONFIG_CMDLINE(=|_EXTEND|_FORCE|_FROM_BOOTLOADER)' "$CFGF" | tr '\n' ' | ')"
            VH="$BUILD_DIR/include/linux/vermagic.h"
            VM1="$(grep -c '^#ifdef CONFIG_MODVERSIONS' "$VH" 2>/dev/null || echo '?')"
            VM2="$(grep -m1 'MODULE_VERMAGIC_MODVERSIONS' "$VH" 2>/dev/null | sed 's/^[ \t]*//' || true)"
            VM3="$(grep -E '^#? ?CONFIG_MODVERSIONS' "$CFGF" 2>/dev/null | head -1 || true)"
            VM4="$(grep -E '^CONFIG_LOCALVERSION(=|_AUTO)' "$CFGF" 2>/dev/null | tr '\n' ' ' || true)"
            echo "::notice title=vermagic 三件套::vermagic.h 里 #ifdef CONFIG_MODVERSIONS 出现 $VM1 次（必须 0）| $VM2 | $VM3 | $VM4"
          fi

          KSUVER="$(grep -aiE '(ksu|sukisu).*version[: ]+[0-9]{4,}' "$LOG" 2>/dev/null | tail -2 | tr '\n' ' ' || true)"
          KSUHOOK="$(grep -aiE 'hook mode|hooks?' "$LOG" 2>/dev/null | grep -ai ksu | tail -2 | tr '\n' ' ' || true)"
          KPMINFO="$(grep -aE 'KPM is (enabled|disabled)' "$LOG" 2>/dev/null | tail -2 | tr '\n' ' ' || true)"
          SUSINFO="$(grep -aiE 'susfs' "$LOG" 2>/dev/null | tail -2 | tr '\n' ' ' || true)"
          KSUOBJ="$(grep -acE 'drivers/kernelsu|KernelSU/kernel' "$LOG" 2>/dev/null || echo 0)"
          echo "::notice title=KSU/susfs/KPM 编译证据::版本=[$KSUVER] KPM=[$KPMINFO] 钩子=[$KSUHOOK] susfs=[$SUSINFO] 对象文件行=$KSUOBJ"
          echo "::notice title=KSU/susfs/KPM 最终配置::$(grep -E 'CONFIG_(KSU|KSU_SUSFS|KPM|KALLSYMS|THREAD_INFO_IN_TASK|FTRACE_SYSCALLS)=' "$BUILD_DIR/out/.config" | tr '\n' ' ')"
          KSUBAD=""
          for KV in KSU KSU_SUSFS KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT KSU_SUSFS_SUS_KSTAT \
                    KSU_SUSFS_SUS_MAP KSU_SUSFS_OPEN_REDIRECT KSU_SUSFS_SPOOF_UNAME \
                    KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
                    KSU_SUSFS_ENABLE_LOG KPM KALLSYMS KALLSYMS_ALL THREAD_INFO_IN_TASK; do
            grep -q "^CONFIG_${KV}=y" "$BUILD_DIR/out/.config" || KSUBAD="$KSUBAD $KV"
          done
          echo "::notice title=susfs/KPM 关键开关::未打开=[${KSUBAD:-无}]"
          echo "::notice title=drivers/kernelsu::软链 -> $(readlink "$BUILD_DIR/drivers/kernelsu") | 面具 Kbuild $([ -f "$BUILD_DIR/KernelSU/kernel/Kbuild" ] && echo 存在 || echo 缺失) | KPM 源码 $([ -d "$BUILD_DIR/KernelSU/kernel/kpm" ] && echo 存在 || echo 缺失)"
          echo "::notice title=susfs 源码::fs/susfs.c $([ -f "$BUILD_DIR/fs/susfs.c" ] && echo "存在 $(wc -l < "$BUILD_DIR/fs/susfs.c") 行" || echo 缺失) | 版本 $(grep -oE 'SUSFS_VERSION "v[0-9.]+"' "$BUILD_DIR/include/linux/susfs.h" 2>/dev/null | head -1)"
          echo "::notice title=drivers/Makefile 里的 kernelsu::$(grep -n 'kernelsu' "$BUILD_DIR/drivers/Makefile" | tr '\n' ' ')"
          echo "::notice title=产物::$(ls -la "$BUILD_DIR/out/arch/arm64/boot/Image"* 2>/dev/null || echo '(无)')"
          echo "::notice title=内核版本串::$(cd "$BUILD_DIR" && make O=out -s kernelrelease 2>/dev/null || echo '(取不到)')"

      - name: Upload DTBs
        if: ${{ success() && inputs.build_dtbs }}
        uses: actions/upload-artifact@v4
        with:
          name: OPPO-K10x-A6-DTBs
          path: |
            ${{ env.BUILD_DIR }}/out/arch/arm64/boot/dts/vendor/**/*.dtb
            ${{ env.BUILD_DIR }}/out/arch/arm64/boot/dts/vendor/**/*.dtbo
          if-no-files-found: warn
          retention-days: 7
