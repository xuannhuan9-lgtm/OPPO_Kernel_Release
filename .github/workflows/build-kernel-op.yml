name: Build OPPO K10x 5G Kernel (official AOSP build.config flow)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # ---- Official OPPO source (oppo-source org) ----
  KERNEL_REPO:    https://github.com/oppo-source/android_kernel_oppo_sm6375.git
  KERNEL_BRANCH:  oppo/sm6375_u_14.0.0_k10x_5g
  MODULES_REPO:   https://github.com/oppo-source/android_kernel_modules_and_devicetree_oppo_sm6375.git
  MODULES_BRANCH: oppo/sm6375_u_14.0.0_k10x_5g

  # ---- Official AOSP kernel build scripts (build/build.sh) ----
  BUILD_REPO:     https://android.googlesource.com/kernel/build
  BUILD_BRANCH:   android11-5.4

  # ---- Toolchain (Rancemxn repack of AOSP clang-r416183b + AOSP GCC) ----
  CLANG_URL: >-
    https://github.com/Rancemxn/android_kernel_oppo_sm6375/releases/download/tool-develop/linux-x86-refs_tags_android-14.0.0_r0.140-clang-r416183b.tar.gz
  GCC_AARCH64_REPO:   https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
  GCC_AARCH64_BRANCH: android10-mainline-release
  GCC_ARM_REPO:       https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9
  GCC_ARM_BRANCH:     android10-release

  # Which vendor fragment the K10x build uses (Holi = SM6375)
  VENDOR_FRAGMENT: vendor/holi_QGKI.config
  BUILD_CONFIG:    build.config.msm.holi

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      CCACHE_DIR:           ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE:       3G
      CCACHE_COMPILERCHECK: content

    steps:
      - name: Checkout this workflow repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget curl automake flex lzop bison gperf build-essential zip \
            zlib1g-dev g++-multilib gcc-multilib libxml2-utils bzip2 libbz2-dev \
            libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev \
            liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl \
            policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc \
            libc6-dev-i386 libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip \
            device-tree-compiler python3 ccache git-lfs gnupg imagemagick \
            libelf-dev libncurses5-dev libsdl1.2-dev gpart fuse2fs e2fsck-static \
            icu-doc rsync adb fastboot libstdc++6 python-is-python3

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-k10x-official-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-k10x-official-

      # ------------------------------------------------------------- sources
      - name: Clone official OPPO kernel source
        run: |
          mkdir -p kernel
          git clone --depth=1 \
            --branch "$KERNEL_BRANCH" \
            "$KERNEL_REPO" \
            kernel/msm-5.4

      - name: Clone official AOSP kernel build scripts
        run: |
          git clone --depth=1 \
            --branch "$BUILD_BRANCH" \
            "$BUILD_REPO" \
            build
          echo "=== build/ contents ==="
          ls build/
          echo "=== build.sh present? ==="
          ls -l build/build.sh

      - name: Clone official OPPO modules + device tree
        run: |
          git clone --depth=1 \
            --branch "$MODULES_BRANCH" \
            "$MODULES_REPO" \
            temp_modules

      - name: Inspect official source layout (diagnostics)
        run: |
          echo "=== modules repo top ==="
          find temp_modules -maxdepth 3 -type d | head -60
          echo
          echo "=== kernel build.config.* files ==="
          ls kernel/msm-5.4/build.config.* 2>/dev/null | sort
          echo
          echo "=== kernel arch/arm64/configs/vendor ==="
          ls kernel/msm-5.4/arch/arm64/configs/vendor/ 2>/dev/null | sort
          echo
          echo "=== kernel arch/arm64/configs (top-level) ==="
          ls kernel/msm-5.4/arch/arm64/configs/ 2>/dev/null | sort

      - name: Extract vendor tree from official modules repo
        run: |
          VENDOR_SRC="$(find temp_modules -type d -name vendor -print -quit)"
          if [ -z "$VENDOR_SRC" ]; then
            echo "ERROR: no vendor/ directory found"
            exit 1
          fi
          echo "vendor source: $VENDOR_SRC"
          rm -rf kernel/msm-5.4/vendor
          rsync -a "$VENDOR_SRC/" kernel/msm-5.4/vendor/
          rm -rf temp_modules

          test -d kernel/msm-5.4/vendor/qcom/opensource/wlan/qcacld-3.0 || {
            echo "ERROR: qcacld-3.0 missing in vendor"
            ls kernel/msm-5.4/vendor/qcom/opensource/wlan || true
            exit 1
          }

      # The WLAN driver lives outside the kernel tree and must be wired in
      # with symlinks + Kconfig/Makefile entries (same requirement as any
      # QCOM msm-5.4 build, official or otherwise).
      - name: Wire official WLAN driver into kernel tree
        working-directory: kernel/msm-5.4
        run: |
          ROOT="$GITHUB_WORKSPACE/kernel/msm-5.4"

          cd drivers/staging
          ln -sfn "$ROOT/vendor/qcom/opensource/wlan/qcacld-3.0"        qcacld-3.0
          ln -sfn "$ROOT/vendor/qcom/opensource/wlan/qca-wifi-host-cmn" qca-wifi-host-cmn
          ln -sfn "$ROOT/vendor/qcom/opensource/wlan/fw-api"            fw-api
          ln -sfn "$ROOT/vendor/qcom/opensource/wlan/utils"             utils
          cd ../..

          grep -q 'drivers/staging/qcacld-3.0/Kconfig' drivers/staging/Kconfig || \
            echo 'source "drivers/staging/qcacld-3.0/Kconfig"' >> drivers/staging/Kconfig
          grep -q 'CONFIG_QCA_CLD_WLAN' drivers/staging/Makefile || \
            echo 'obj-$(CONFIG_QCA_CLD_WLAN) += qcacld-3.0/' >> drivers/staging/Makefile

          sed -i \
            's|WLAN_ROOT := drivers/staging/qcacld-3.0|WLAN_ROOT := $(srctree)/$(src)|g' \
            "$ROOT/vendor/qcom/opensource/wlan/qcacld-3.0/Kbuild"

      # ------------------------------------------------- signature removal
      # build.sh merges the vendor fragment via scripts/kconfig/merge_config.sh
      # so we append the signing-disable directives straight to that fragment.
      # merge_config.sh honours both "# CONFIG_X is not set" and CONFIG_X="".
      - name: Disable module signing in the official vendor fragment
        run: |
          FRAG="kernel/msm-5.4/arch/arm64/configs/${VENDOR_FRAGMENT}"
          if [ ! -f "$FRAG" ]; then
            echo "ERROR: expected vendor fragment not found: $FRAG"
            ls kernel/msm-5.4/arch/arm64/configs/vendor/
            exit 1
          fi

          cat >> "$FRAG" <<'EOF'

# ---- CI: disable module signing ----
# CONFIG_MODULE_SIG is not set
# CONFIG_MODULE_SIG_FORCE is not set
# CONFIG_MODULE_SIG_ALL is not set
# CONFIG_MODULE_SIG_SHA1 is not set
# CONFIG_MODULE_SIG_SHA224 is not set
# CONFIG_MODULE_SIG_SHA256 is not set
# CONFIG_MODULE_SIG_SHA384 is not set
# CONFIG_MODULE_SIG_SHA512 is not set
CONFIG_MODULE_SIG_KEY=""
CONFIG_SYSTEM_TRUSTED_KEYS=""
CONFIG_SYSTEM_REVOCATION_KEYS=""
EOF

          echo "=== tail of $FRAG ==="
          tail -20 "$FRAG"

      # If the tree only ships build.config.msm.lahaina (which is the shared
      # base for QCOM consolidated SoCs incl. Holi), create the holi one.
      - name: Ensure build.config.msm.holi exists
        run: |
          cd kernel/msm-5.4
          if [ -f "$BUILD_CONFIG" ]; then
            echo "$BUILD_CONFIG already present:"
            cat "$BUILD_CONFIG"
            exit 0
          fi
          if [ ! -f build.config.msm.lahaina ]; then
            echo "ERROR: neither $BUILD_CONFIG nor build.config.msm.lahaina found"
            ls build.config.* || true
            exit 1
          fi
          echo "Creating $BUILD_CONFIG from build.config.msm.lahaina"
          sed -e 's/lahaina/holi/g' \
              -e 's/lahaina_QGKI/holi_QGKI/g' \
              build.config.msm.lahaina > "$BUILD_CONFIG"
          echo "=== new $BUILD_CONFIG ==="
          cat "$BUILD_CONFIG"

      # ------------------------------------------------------------- toolchain
      # Prebuilts go in exactly the paths build.config.common / build.config.gki.*
      # expect: $ROOT_DIR/prebuilts-master/clang/host/linux-x86/clang-r416183b
      #         $ROOT_DIR/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
      #         $ROOT_DIR/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9
      - name: Prepare prebuilts-master clang-r416183b
        run: |
          mkdir -p prebuilts-master/clang/host/linux-x86/clang-r416183b
          cd prebuilts-master/clang/host/linux-x86/clang-r416183b
          curl -fL "$CLANG_URL" -o clang.tar.gz \
            --connect-timeout 30 --retry 5 --retry-delay 5
          tar -xzf clang.tar.gz
          rm clang.tar.gz
          cd "$GITHUB_WORKSPACE"

          # If the tarball had a single wrapper directory, hoist its contents.
          if [ ! -x prebuilts-master/clang/host/linux-x86/clang-r416183b/bin/clang ]; then
            NESTED_BIN="$(find prebuilts-master/clang/host/linux-x86/clang-r416183b \
                          -maxdepth 3 -type f -path '*/bin/clang' | head -1)"
            if [ -n "$NESTED_BIN" ]; then
              NESTED_ROOT="$(dirname "$(dirname "$NESTED_BIN")")"
              echo "Hoisting nested root: $NESTED_ROOT"
              shopt -s dotglob
              mv "$NESTED_ROOT"/* prebuilts-master/clang/host/linux-x86/clang-r416183b/
              shopt -u dotglob
            fi
          fi

          prebuilts-master/clang/host/linux-x86/clang-r416183b/bin/clang --version | head -1

      - name: Prepare prebuilts GCC aarch64 4.9
        run: |
          mkdir -p prebuilts/gcc/linux-x86/aarch64
          git clone --depth=1 \
            --branch "$GCC_AARCH64_BRANCH" \
            "$GCC_AARCH64_REPO" \
            prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
          prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-gcc --version | head -1

      - name: Prepare prebuilts GCC arm 4.9
        run: |
          mkdir -p prebuilts/gcc/linux-x86/arm
          git clone --depth=1 \
            --branch "$GCC_ARM_BRANCH" \
            "$GCC_ARM_REPO" \
            prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9
          prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/bin/arm-linux-androideabi-gcc --version | head -1

      # ----------------------------------------------- official build.sh run
      - name: Build with AOSP build/build.sh (official build.config flow)
        run: |
          cd "$GITHUB_WORKSPACE"

          # Sanity: give build.sh a clean env
          export PATH="$GITHUB_WORKSPACE/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin:$PATH"
          export PATH="$GITHUB_WORKSPACE/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin:$PATH"
          export PATH="$GITHUB_WORKSPACE/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/bin:$PATH"

          echo "=== invoking official build.sh ==="
          echo "BUILD_CONFIG = kernel/msm-5.4/$BUILD_CONFIG"
          echo "ROOT_DIR     = $GITHUB_WORKSPACE"
          echo "OUT_DIR      = $GITHUB_WORKSPACE/out"

          set -o pipefail
          BUILD_CONFIG="kernel/msm-5.4/$BUILD_CONFIG" \
          ROOT_DIR="$GITHUB_WORKSPACE" \
          OUT_DIR="$GITHUB_WORKSPACE/out" \
          CCACHE_DIR="$CCACHE_DIR" \
            bash build/build.sh 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      # -------------------------------------------------------------- verify
      - name: Verify .config (signing must be off)
        if: always()
        run: |
          for cfg in \
              "$GITHUB_WORKSPACE/out/.config" \
              "$GITHUB_WORKSPACE/kernel/msm-5.4/out/.config" ; do
            [ -f "$cfg" ] || continue
            echo "=== $cfg ==="
            grep -E '^(CONFIG_MODULE_SIG|CONFIG_MODULE_SIG_FORCE|CONFIG_MODULE_SIG_ALL|CONFIG_SYSTEM_TRUSTED_KEYS|CONFIG_SYSTEM_REVOCATION_KEYS|CONFIG_MODULE_SIG_KEY)' "$cfg" || true
          done

      - name: Locate produced images (diagnostics)
        if: always()
        run: |
          echo "=== Images under workspace ==="
          find "$GITHUB_WORKSPACE" \
            \( -path '*/arch/arm64/boot/Image' -o \
               -path '*/arch/arm64/boot/Image.gz' -o \
               -path '*/arch/arm64/boot/dtbo.img' \) \
            -printf '%p (%s bytes)\n' 2>/dev/null || true
          echo "=== .ko files ==="
          find "$GITHUB_WORKSPACE" -name '*.ko' -printf '%p\n' 2>/dev/null | head -50 || true

      # ------------------------------------------------------------- outputs
      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts/dtbs artifacts/modules

          for OUT in "$GITHUB_WORKSPACE/out" "$GITHUB_WORKSPACE/kernel/msm-5.4/out"; do
            [ -d "$OUT" ] || continue
            for f in Image.gz Image dtbo.img; do
              [ -f "$OUT/arch/arm64/boot/$f" ] && cp "$OUT/arch/arm64/boot/$f" artifacts/
            done
            find "$OUT/arch/arm64/boot/dts" -type f -name '*.dtb' \
              -exec cp {} artifacts/dtbs/ \; 2>/dev/null || true
            find "$OUT/arch/arm64/boot/dts" -type f -name '*.dtbo' \
              -exec cp {} artifacts/dtbs/ \; 2>/dev/null || true
            find "$OUT" -name '*.ko' -exec cp -n {} artifacts/modules/ \; 2>/dev/null || true
            [ -d "$OUT/all_modules" ] && rsync -a "$OUT/all_modules/" artifacts/modules/ || true
            [ -f "$OUT/vmlinux" ]        && cp "$OUT/vmlinux"        artifacts/ || true
            [ -f "$OUT/System.map" ]     && cp "$OUT/System.map"     artifacts/ || true
            [ -f "$OUT/Module.symvers" ] && cp "$OUT/Module.symvers" artifacts/ || true
          done

          echo "=== artifacts ==="
          find artifacts -type f -printf '%p  (%s bytes)\n' | sort
          du -sh artifacts/

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oppo-k10x-5g-kernel-unsigned
          path: artifacts/
          if-no-files-found: warn
