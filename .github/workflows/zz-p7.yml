# 探针7：只有 Build Kernel Image and DTBs
# 跑出 1 个 job = 这段没问题；startup_failure = 这段有问题
on:
  workflow_dispatch:
    inputs:
      enable_ksu:
        description: '是否集成 KernelSU-Next（官方 legacy 流程）。默认 true。注意：FolkPatch/APatch 也是内核级 root，与 KSU 同开会冲突，用它们取 root 读日志时请设 false'
        type: boolean
        default: true
      ksu_hook:
        description: 'KernelSU hook 模式。★必须用 kprobes★ —— syscall_table 模式不挂 reboot 系统调用，面具拿不到驱动 fd，会一直显示「未集成」'
        type: choice
        options:
          - kprobes
          - syscall_table
        default: kprobes
      module_sig:
        description: '模块签名校验。off=彻底关掉（MODULE_SIG=n，module_sig_check 直接 return 0，推荐）；keep=保留校验代码但不强制（MODULE_SIG=y + FORCE=n，已验证能开机）'
        type: choice
        options:
          - 'off'
          - keep
        default: 'off'
      kernel_release_suffix:
        description: '钉死内核版本串后缀（从手机「设置→关于手机→内核版本」抄，形如 -qgki-g1a2b3c4d；留空则不钉）'
        type: string
        default: '-qgki-g6818c821e42d'
      extra_cmdline:
        description: '追加到内核命令行的参数（用 CONFIG_CMDLINE_EXTEND）。默认 loglevel=8 让 pstore 记下 pr_info'
        required: false
        default: 'loglevel=8'
      force_builtin:
        description: '把 ADSP/PIL/GLINK 那批 vendor 驱动强制 =y（official 路线必须开，否则链接失败）'
        required: false
        type: choice
        default: 'true'
        options: ['true', 'false']
      diag_patch:
        description: '应用 adsprpc 诊断补丁：创建世界可读的 /proc/adsprpc_diag（卡二屏时 adb shell cat /proc/adsprpc_diag 直接看 rpdev）'
        required: false
        type: choice
        default: 'true'
        options: ['true', 'false']
      config_source:
        description: '配置来源。dump = 用手机 dump 出的 k10x_defconfig（已验证可编过）；official = 源码树官方三件套 + force_builtin 覆盖（实验性）'
        required: false
        type: choice
        default: 'dump'
        options:
          - 'dump'
          - 'official'
      build_dtbs:
        description: '是否编译 DTB（建议开，用于和 stock DTB 比对）'
        type: boolean
        default: false

      ksu_manager_package:
        description: 'KernelSU-Next 面具包名。留空=内核自动扫描认领（推荐）。spoofed 版包名随机，要填得先用 adb 查真实包名'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build OPPO K10x Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      # SOURCE_BRANCH 由「Resolve Build Inputs」步骤按输入写入
      KERNEL_REPO: https://github.com/oppo-source/android_kernel_oppo_sm6375.git
      DRIVER_REPO: https://github.com/oppo-source/android_kernel_modules_and_devicetree_oppo_sm6375.git
      # stock 内核是 clang 11.0.2 编的：defconfig 里 CONFIG_CLANG_VERSION=110002
      # 原厂 defconfig: CONFIG_CLANG_VERSION=110002 → Clang 11.0.2 = clang-r383902
      # 原厂还开了 LTO_CLANG + CFI_CLANG(强制) + MODVERSIONS，这些对编译器版本极度敏感
      CLANG_CANDIDATES: |
        android-11.0.0_r48:clang-r383902
        android-12.0.0_r1:clang-r383902
        android-11.0.0_r40:clang-r383902
        android-11.0.0_r1:clang-r383902
        android-12.0.0_r2:clang-r383902

      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: '1'
      # Droidspaces kABI 补丁脚本（base64 内嵌，避免 YAML 多行缩进问题）。
      # 必须放 job 级 env：步骤 run 里的变量跨步骤看不到。
      KABI_B64: ""

    steps:

      - name: Build Kernel Image and DTBs
        shell: bash
        run: |
          set -euxo pipefail
          cd "$BUILD_DIR"

          export PATH="$CLANG_DIR/bin:$PATH"
          export ARCH=arm64 SUBARCH=arm64
          export CC=clang LD=ld.lld LLVM=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchains/gcc93/bin/aarch64-buildroot-linux-gnu-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/toolchains/gcc32/bin/arm-linux-androideabi-"

          # 这棵树自带 -Werror=implicit-function-declaration / -Werror=return-type 等
          # （root_Makefile:492-495、1100），KCFLAGS 在 1115 行追加到最后，
          # 所以 -Wno-error 能把它们降级成 warning —— 保留这个保险
          export KCFLAGS="-Wno-error -Wno-strict-prototypes -Wno-error=strict-prototypes -Wno-error=implicit-function-declaration -Wno-error=implicit-int -Wno-error=return-type -Wno-error=incompatible-pointer-types"
          # LTO_CLANG + CFI_CLANG 的 vmlinux 链接很吃内存；OOM 就把 -j 调小
          TARGETS="Image.gz Image"

          # ── KernelSU-Next 面具识别开关 ──
          # KSU_MANAGER_PACKAGE 必须在 make 命令行上传（不能放 env）：
          # 空值的环境变量在 make 里也算「已定义」，会写出
          # -DKSU_MANAGER_PACKAGE=\"\" 这种空包名，反而认不到任何面具。
          EXTRA_KSU_VARS=""
          if [ -n "${{ inputs.ksu_manager_package }}" ]; then
            EXTRA_KSU_VARS="$EXTRA_KSU_VARS KSU_MANAGER_PACKAGE=${{ inputs.ksu_manager_package }}"
            echo "::notice title=KernelSU 面具包名::${{ inputs.ksu_manager_package }}（按包名直接认，跳过 /data/app 扫描）"
          else
            echo "::notice title=KernelSU 面具包名::（未指定，走扫描+签名校验；若面具显示未集成就填上）"
          fi
          if [ -n "" ]; then
            EXTRA_KSU_VARS="$EXTRA_KSU_VARS KSU_VERSION_OVERRIDE="
            echo "::notice title=KernelSU 版本号::强制上报 "
          else
            echo "::notice title=KernelSU 版本号::（自动，按 git 提交数算）"
          fi
          if [ "${{ inputs.build_dtbs }}" = "true" ]; then
            TARGETS="$TARGETS dtbs"
          fi

          # 编译失败时，把真正的报错打成 GitHub 注解 —— 注解是公开可读的，
          # 这样不用登录也能从 API 直接抓到失败原因
          ann() {  # $1=标题  $2=文件
            local msg
            msg=$(sed -e 's/%/%25/g' -e 's/\r//g' "$2" | awk 'BEGIN{ORS=""} {print $0 "%0A"}')
            echo "::error title=$1::${msg}"
          }
          # ccache：把 clang/gcc 挂上缓存，重跑只编改动的文件（35分钟 -> 5分钟）
          mkdir -p "$HOME/ccache-bin"
          for t in clang clang++ gcc g++ cc c++; do
            ln -sfn "$(command -v ccache)" "$HOME/ccache-bin/$t"
          done
          export PATH="$HOME/ccache-bin:$PATH"
          ccache -z || true
          echo "ccache: $(ccache --version | head -1)"
          echo "CCACHE_DIR=$CCACHE_DIR  存在? $([ -d "$CCACHE_DIR" ] && echo yes || echo no)"
          echo "PATH 前两项: $(echo "$PATH" | cut -d: -f1,2)"
          echo "clang 解析到: $(command -v clang)"
          echo "ccache 解析到: $(command -v ccache)"
          if ! make -j"$(nproc)" O=out DISABLE_WRAPPER=1 $EXTRA_KSU_VARS $TARGETS 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            echo "========== 编译失败 =========="
            # 抓 make 的 Error 行，并把每处前面 60 行一起抓出来 —— 真正的编译器报错就在那里。
            # grep -a 防止日志里的二进制字节让 grep 只回一句 "Binary file matches"。
          # 第一优先：直接抓真正的报错文本。并行编译（-j4）下 make 的 "Error N" 行
          # 和真正的编译错误不在同一段输出里，所以先按报错文本抓。
          grep -anE 'ld\.lld: error|ld: error|undefined symbol|fatal error:|: error:|forbidden warning' \
            "$RUNNER_TEMP/build.log" | head -8 > "$RUNNER_TEMP/errs.txt" || true
          # 把报错行前后的上下文一起带上
          if [ -s "$RUNNER_TEMP/errs.txt" ]; then
            cut -d: -f1 "$RUNNER_TEMP/errs.txt" | head -2 | while read -r L; do
              S=$((L-25)); [ "$S" -lt 1 ] && S=1
              echo "===== 第 $L 行上下文 ====="
              sed -n "${S},$((L+5))p" "$RUNNER_TEMP/build.log"
              echo
            done >> "$RUNNER_TEMP/errs.txt" || true
          fi
          # 第二优先：退回 make 的 Error 行
          if [ ! -s "$RUNNER_TEMP/errs.txt" ]; then
            grep -anE 'Error [0-9]+' "$RUNNER_TEMP/build.log" | grep 'make\[' | head -3 | cut -d: -f1 | \
            while read -r L; do
              S=$((L-60)); [ "$S" -lt 1 ] && S=1
              echo "===== 第 $L 行前 60 行 ====="
              sed -n "${S},${L}p" "$RUNNER_TEMP/build.log"
              echo
            done > "$RUNNER_TEMP/errs.txt" || true
          fi
            ann "编译报错行" "$RUNNER_TEMP/errs.txt"
            tail -c 1800 "$RUNNER_TEMP/build.log" > "$RUNNER_TEMP/tail.txt"
            ann "日志尾部" "$RUNNER_TEMP/tail.txt"
            exit 1
          fi

          # ★★★ KernelSU 版本号自检 ★★★
          # 内核上报的 KSU_VERSION 不是写死的，而是从 KernelSU-Next 仓库的
          # git 提交数算出来的（kernel/Kbuild L81/L90）：
          #     KSU_VERSION = 30000 + $(git rev-list --count HEAD) + 289
          # 完整克隆时 = 30000 + 3017 + 289 = 33306。
          # 但 Kbuild L92-97 有个退化分支：拿不到 git 版本就
          #     KSU_VERSION_FALLBACK := 1
          # 于是内核上报 1 —— 远低于面具的 MINIMAL_SUPPORTED_KERNEL=33188，
          # 面具那边任何按版本做的判断都会失败。
          # 触发条件：浅克隆（--depth=1，rev-list 只数到 1）、.git 被删、
          # 或者 KernelSU-Next 被当普通目录拷进来而不是 clone。
          # setup.sh 用的是完整 clone，正常不会中招，但这里必须兜住。
          if [ "${{ inputs.enable_ksu }}" = "true" ]; then
            KV="$(grep -aE '^-- KernelSU-Next version: [0-9]+' "$RUNNER_TEMP/build.log" | tail -1 | grep -oE '[0-9]+$' || true)"
            KCNT="$(git -C "$BUILD_DIR/KernelSU-Next" rev-list --count HEAD 2>/dev/null || echo '取不到')"
            echo "  KernelSU-Next 仓库提交数 = $KCNT（完整克隆应为 3017）"
            if [ -z "$KV" ]; then
              echo "::warning title=KernelSU 版本号::编译日志里没有 '-- KernelSU-Next version:' 行，KSU 可能根本没编进去"
            elif [ "$KV" -lt 33188 ]; then
              echo "::error::KernelSU 版本号只有 $KV，低于面具要求的 33188！多半是 KernelSU-Next 不是完整 git 仓库（浅克隆或 .git 丢失），rev-list --count 退化成了 1"
              grep -aE 'KSU_GIT_VERSION|version fallback|rev-list|KernelSU-Next version' "$RUNNER_TEMP/build.log" | head -5 || true
              exit 1
            else
              echo "::notice title=KernelSU 版本号::$KV（面具 v3.4.1 要求 ≥33188，通过）| KernelSU-Next 提交数 $KCNT"
            fi
          fi

          # ccache 到底有没有生效？把它自己说的数字打出来
          echo "========== ccache 统计 =========="
          ccache -s || true
          echo "CCACHE_DIR 内容: $(ls -A "$CCACHE_DIR" 2>/dev/null | head -5 || echo '(空)')"

          test -s out/arch/arm64/boot/Image.gz
          ls -lh out/arch/arm64/boot/Image.gz

          echo "===== 编出来的 DTB / DTBO ====="
          find out/arch/arm64/boot/dts/vendor \( -name '*.dtb' -o -name '*.dtbo' \) 2>/dev/null | head -50 || true
